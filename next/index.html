}
const CHEV = '<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>';

/* ---------- Task rules ---------- */
const isDone = (t) => t.status === 'done';
const isLive = (t) => !isDone(t) && ([1, 2, 3].includes(t.priority) || !!t.focus);
const isParked = (t) => !isDone(t) && !isLive(t);
const noPriority = (t) => !isDone(t) && !t.priority;
const inPlan = (t) => isLive(t) && (t.priority === 1 || t.priority === 2 || !!t.focus);
const isQuiet = (t) => isLive(t) && ms(t.updatedAt) != null && ms(t.updatedAt) < Date.now() - QUIET_DAYS * DAY;
function planRank(t) { return t.priority === 1 ? 0 : t.priority === 2 ? 1 : 2; }
function byDueThenOrder(a, b) {
  const da = dueMs(a.due), db = dueMs(b.due);
  if (da != null && db != null && da !== db) return da - db;
  if (da != null && db == null) return -1;
  if (da == null && db != null) return 1;
  return (a.sortOrder || 0) - (b.sortOrder || 0);
}
function planSort(a, b) { return (planRank(a) - planRank(b)) || byDueThenOrder(a, b); }
function liveSort(a, b) { return ((a.priority || 9) - (b.priority || 9)) || byDueThenOrder(a, b); }

/* ---------- Agent job rules ---------- */
// A job is on the board until it is finished, and stays while it still needs Ifran or is stuck.
const jobVisible = (j) => !j.finished_at || j.status === 'Needs you' || j.status === 'Stuck';
const visibleJobs = () => D.jobs.filter(jobVisible);
function jobsForTask(taskId) { return visibleJobs().filter(j => j.task_id === taskId); }
function statusCounts(jobs) { const c = { 'Running': 0, 'Needs you': 0, 'Stuck': 0, 'Idle': 0 }; jobs.forEach(j => { if (c[j.status] != null) c[j.status]++; }); return c; }
function jobSort(a, b) { return ((STATUS[a.status] || STATUS.Idle).rank - (STATUS[b.status] || STATUS.Idle).rank) || ((ms(b.updated_at) || 0) - (ms(a.updated_at) || 0)); }
function runningTime(j) {
  const s = ms(j.started_at); if (s == null) return '–';
  const e = ms(j.finished_at) || Date.now();
  const m = Math.max(0, Math.round((e - s) / 60000));
  return m < 1 ? 'under 1 min' : fmtMins(m);
}
function stepText(j) {
  const parts = [];
  if (j.steps_total > 0) parts.push('Step ' + Math.min(j.steps_done, j.steps_total) + ' of ' + j.steps_total);
  if (j.step_note) parts.push(j.step_note);
  return parts.join(' · ') || (STATUS[j.status] ? STATUS[j.status].label : '');
}
function stepBars(j) {
  const total = Math.min(Math.max(j.steps_total || 0, 0), 12);
  if (!total) return '';
  const done = Math.min(j.steps_done || 0, total);
  const c = DOT[(STATUS[j.status] || STATUS.Idle).key];
  let h = '<div class="steps" aria-hidden="true">';
  for (let i = 0; i < total; i++) h += '<span' + (i < done ? ' style="background:' + c + '"' : '') + '></span>';
  return h + '</div>';
}
function statusBadge(status) {
  const s = STATUS[status] || STATUS.Idle;
  return '<span class="badge s-' + s.key + '"><span class="bd" style="background:' + DOT[s.key] + '"></span>' + esc(s.label) + '</span>';
}
function pillsFor(c) {
  return ['Stuck', 'Needs you', 'Running', 'Idle'].filter(s => c[s]).map(s => '<span class="badge s-' + STATUS[s].key + '">' + c[s] + ' ' + STATUS[s].lower + '</span>').join('');
}
function jobLine(j) { return j.task_id ? taskBtn(j.task_id, esc(j.title)) : esc(j.title); }
/* Group header: the whole row toggles (the button's ::after covers it), the name is its own link. */
function groupHead(g, L, act, open, nameStyle) {
  const name = esc(L.name), href = g.k === '__all' ? null : bizHref(g.k);
  const nm = href ? '<a class="nm" href="' + href + '"' + nameStyle + '>' + name + '</a>' : '<span class="nm"' + nameStyle + '>' + name + '</span>';

    '<span class="dot" style="background:' + L.colour + '"></span>' + nm + '<span class="gpills">' + pillsFor(g.c) + '</span></div>';

/* ---------- Time spent ---------- */
function periodStart(p) { return p === 'Day' ? startOfToday() : Date.now() - (p === 'Week' ? 7 : 30) * DAY; }
function bucketOf(who) { return isMe(who) ? 'you' : isCos(who) ? 'cos' : 'agents'; }
function timeSplit(period) {
  const since = periodStart(period);
  const out = { you: { total: 0, by: {} }, cos: { total: 0, by: {} }, agents: { total: 0, by: {} } };
  D.activity.forEach(a => {
    const t = ms(a.at); if (t == null || t < since || !(a.minutes > 0)) return;
    const b = out[bucketOf(a.who)]; const k = a.stream || '__none';
    b.total += a.minutes; b.by[k] = (b.by[k] || 0) + a.minutes;
  });

}
function timeRows(period) {
  const split = timeSplit(period);
  const names = [['you', 'You'], ['cos', 'Chief of Staff'], ['agents', 'Agents']];
  const used = new Set();
  let html = '';
  names.forEach(([k, label]) => {
    const b = split[k];
    let bar = '';
    if (b.total > 0) {
      const keys = D.streams.map(s => s.id).concat(['__none']).filter(id => b.by[id]);
      keys.forEach(id => { used.add(id); const pct = (b.by[id] / b.total) * 100; const c = id === '__none' ? NONE_COLOUR : look(id).colour; bar += '<span style="width:' + pct.toFixed(2) + '%;background:' + c + '" title="' + esc((id === '__none' ? 'No business' : look(id).name) + ': ' + fmtMins(b.by[id])) + '"></span>'; });
    }
    const aria = label + ': ' + (b.total > 0 ? fmtMins(b.total) : 'no time logged');
    html += '<div class="trow"><span class="nm">' + label + '</span><div class="tbar" role="img" aria-label="' + esc(aria) + '">' + bar + '</div><span class="hrs">' + (b.total > 0 ? fmtMins(b.total) : '–') + '</span></div>';
  });
  const any = split.you.total + split.cos.total + split.agents.total > 0;
  let legend = '';
  if (any) {
    D.streams.forEach(s => {
      if (!used.has(s.id)) return;
      const L = look(s.id), href = bizHref(s.id), inner = '<i style="background:' + L.colour + '"></i>' + esc(L.name);

/* What has changed in Sorted since a brief was written. The brief's words are a snapshot; this is

function sinceBrief(b, scope) {
  const at = ms(b.at);

  const tasks = scope ? scope.tasks : myTasks();
  const done = tasks.filter(t => isDone(t) && t.completedAt && t.completedAt > at);
  const added = tasks.filter(t => !isDone(t) && t.createdAt > at);
  const updates = D.activity.filter(a => a.kind === 'work' && !isCos(a.who) && (ms(a.at) || 0) > at && (!scope || scope.mine(a)));
  const counted = new Set(done.concat(added).map(t => t.id));
  updates.forEach(a => { if (a.task_id) counted.add(a.task_id); });

/* ---------- Task history: every update logged against one task ---------- */
function taskActs(id) {
  const seen = new Set(), out = [];
  (cc.taskActs[id] || []).concat(D.activity.filter(a => a.task_id === id)).forEach(a => { if (!seen.has(a.id)) { seen.add(a.id); out.push(a); } });
  return out;
}
let actCountCache = { v: -1, map: null };
function actCount(id) {
  if (actCountCache.v !== cc.actVersion) {
    const m = new Map();
    D.activity.forEach(a => { if (a.task_id) m.set(a.task_id, (m.get(a.task_id) || 0) + 1); });
    actCountCache = { v: cc.actVersion, map: m };
  }
  return actCountCache.map.get(id) || 0;
}
function taskHistoryHTML(t) {
  const acts = taskActs(t.id);
  const jobs = D.jobs.filter(j => j.task_id === t.id);
  const rows = [];
  if (t.createdAt > 1e12) rows.push({ at: t.createdAt, sys: true, html: 'Task created' });
  acts.forEach(a => rows.push({ at: ms(a.at) || 0, html: '<b>' + esc(whoLabel(a.who)) + '</b>' + (a.minutes > 0 ? '<span class="h-min">' + esc(fmtMins(a.minutes)) + '</span>' : '') + '<p>' + activityText(a) + '</p>' }));
  jobs.forEach(j => {
    const s = STATUS[j.status] || STATUS.Idle, out = safeUrl(j.output_url);
    const fin = !!j.finished_at && j.status === 'Idle';
    const detail = [fin ? '' : stepText(j), j.returns ? (fin ? 'Returned' : s.out) + ': ' + j.returns : '', j.finished_at ? 'Finished ' + fmtStamp(ms(j.finished_at)) : ''].filter(Boolean).join(' · ');
    rows.push({ at: ms(j.started_at) || ms(j.created_at) || 0, html: '<b>' + esc(j.agent) + '</b><span class="h-job ' + s.key + '">' + (fin ? 'Finished' : esc(s.label)) + '</span><p>Agent job: ' + esc(j.title) + (detail ? '<br>' + esc(detail) : '') + (out ? ' <a href="' + esc(out) + '" target="_blank" rel="noopener noreferrer">Open output</a>' : '') + '</p>' });
  });
  if (t.status === 'done' && t.completedAt) rows.push({ at: t.completedAt, sys: true, html: 'Completed and moved to the Archive' });
  rows.sort((a, b) => a.at - b.at);
  const mins = acts.reduce((n, a) => n + (a.minutes > 0 ? a.minutes : 0), 0);
  const count = acts.length + jobs.length;
  const sum = count ? plural(acts.length, 'update') + (jobs.length ? ' · ' + plural(jobs.length, 'agent job') : '') + (mins ? ' · ' + fmtMins(mins) + ' logged' : '')
    : 'No updates yet. Anything you, your Chief of Staff or an agent logs on this task appears here, and stays with it in the Archive.';
  return '<div class="hist-sum">' + esc(sum) + '</div>' + (rows.length ? '<div class="hist">' + rows.map(r => '<div class="h-row' + (r.sys ? ' sys' : '') + '"><span class="h-when">' + esc(fmtStamp(r.at)) + '</span><div class="h-body">' + r.html + '</div></div>').join('') + '</div>' : '');
}

/* Fetch one task's complete history, so an old archived task shows everything, not just recent rows. */
async function loadTaskHistory(id) {

async function addTaskUpdate(id, text, minutes) {

/* ---------- Data ---------- */
async function ccLoad() {
  const res = await Promise.all([
    sb.from('streams').select('id,name,colour,position').order('position'),
    sb.from('agent_jobs').select('*').order('created_at', { ascending: false }).limit(500),
    sb.from('activity').select('*').order('at', { ascending: false }).limit(2000),
    sb.from('briefs').select('*').order('at', { ascending: false }).limit(200),
    sb.from('questions').select('*').order('at', { ascending: false }).limit(300),
  ]);
  const bad = res.find(r => r.error);
  if (bad) throw new Error(bad.error.message || 'query failed');
  [D.streams, D.jobs, D.activity, D.briefs, D.questions] = res.map(r => r.data || []);
  cc.loaded = true; cc.error = null; cc.actVersion++;
}
let ccReloadTimer = null;
function ccScheduleReload() {
  clearTimeout(ccReloadTimer);
  ccReloadTimer = setTimeout(async () => {
    if (!sb || !sbUser) return;
    try { await ccLoad(); } catch (e) { cc.error = 'Could not refresh briefs, agents and activity. It will try again shortly.'; }
    render();
    refreshOpenHistory();
  }, 400);
}
let ccChannel = null;
function ccSubscribe() {
  if (ccChannel) sb.removeChannel(ccChannel);
  ccChannel = sb.channel('sorted-home');
  ['streams', 'agent_jobs', 'activity', 'briefs', 'questions'].forEach(t => {
    ccChannel.on('postgres_changes', { event: '*', schema: SB_SCHEMA, table: t, filter: 'user_id=eq.' + sbUser.id }, ccScheduleReload);
  });
  ccChannel.subscribe();
}
async function ccStart() {
  try { await ccLoad(); } catch (e) { cc.error = 'Could not load briefs, agents and activity (' + e.message + '). It will try again shortly.'; cc.loaded = true; setTimeout(ccScheduleReload, 8000); }
  render();
  refreshOpenHistory();
  ccSubscribe();
}
function ccReset() {
  if (ccChannel && sb) { sb.removeChannel(ccChannel); ccChannel = null; }
  D.streams = []; D.jobs = []; D.activity = []; D.briefs = []; D.questions = [];
  cc.loaded = false; cc.error = null; cc.taskActs = {}; cc.actVersion++; cc.msgDraft = ''; cc.ansDraft = {};
}

/* ---------- Actions ---------- */
function setPriorityLive(taskId, p) {
  const t = getTask(taskId);
  if (!t || ![1, 2, 3, 4].includes(p)) return false;
  t.priority = p;
  save();
  return true;
}
/* Answer the decision on a brief: by option (i), or in Ifran's own words (text). */
async function decide(briefId, i, text) {
  const b = D.briefs.find(x => x.id === briefId);
  const d = pendingDecision(b);
  const own = String(text || '').trim();
  if (!d || (!own && !d.options[i])) return;
  const opt = own ? null : d.options[i];
  const act = (opt && opt.action) || null;
  let did = '';
  if (act && act.type === 'set_priority' && getTask(act.task_id) && [1, 2, 3, 4].includes(Number(act.priority))) {
    if (setPriorityLive(act.task_id, Number(act.priority))) did = ' and set priority ' + Number(act.priority);
  }
  const now = new Date().toISOString();
  const label = own || opt.label || ('Option ' + (i + 1));
  const up = await sb.from('briefs').update({ decision_choice: label, decided_at: now }).eq('id', briefId);
  if (up.error) { toast('Could not record your decision: ' + up.error.message); return; }
  b.decision_choice = label; b.decided_at = now;
  const anyAct = d.options.map(o => o && o.action).find(x => x && x.task_id);
  const task = getTask(d.task_id || (act && act.task_id) || (anyAct && anyAct.task_id)) || null;
  await sb.from('activity').insert({ who: 'Ifran', kind: 'decision', stream: b.stream || (task ? taskStream(task) : null), task_id: task ? task.id : null, description: 'Chose “' + label + '”' + (d.question ? ' on: ' + d.question : '') });
  delete cc.ansDraft['d-' + briefId];
  toast('Decision recorded' + did + (task ? ' and logged on the task.' : '.'));
  ccScheduleReload();
  render();
}
/* Answer a question from the Chief of Staff or an agent. The answer is kept on the question and
   logged on its task, so it sits in that task's history. */
async function answerQuestion(id, text) {
  const q = D.questions.find(x => x.id === id);
  const ans = String(text || '').trim();
  if (!q || q.answered_at) return;
  if (!ans) { toast('Type an answer, or pick one of the options'); return; }
  const now = new Date().toISOString();
  const up = await sb.from('questions').update({ answer: ans, answered_at: now }).eq('id', id);
  if (up.error) { toast('Could not record your answer: ' + up.error.message); return; }
  q.answer = ans; q.answered_at = now;
  const task = q.task_id ? getTask(q.task_id) : null;
  const log = await sb.from('activity').insert({ who: 'Ifran', kind: 'decision', stream: q.stream || (task ? taskStream(task) : null), task_id: task ? task.id : null, description: 'Answered “' + ans + '” to ' + (q.who || 'Chief of Staff') + '’s question: ' + q.question });
  delete cc.ansDraft['q-' + id];
  toast(log.error ? 'Answer saved, but it could not be logged on the task.' : task ? 'Answer recorded and logged on the task.' : 'Answer recorded.');
  ccScheduleReload();
  render();
}
/* A finished job that only needed Ifran to see or do something: he can clear it himself. */
async function jobDealtWith(id) {
  const j = D.jobs.find(x => x.id === id);
  if (!j || !j.finished_at) return;
  const up = await sb.from('agent_jobs').update({ status: 'Idle' }).eq('id', id);
  if (up.error) { toast('Could not update the job: ' + up.error.message); return; }
  j.status = 'Idle';
  toast('Marked as dealt with.');
  ccScheduleReload();
  render();
}
async function sendCosMessage(text) {
  const msg = String(text || '').trim();
  if (!msg) return;
  const { data, error } = await sb.from('activity').insert({ who: 'Ifran', kind: 'message', description: msg, minutes: 0 }).select().single();
  if (error) { toast('Could not send: ' + error.message); return; }
  cc.msgDraft = '';

let recog = null;
function toggleDictation() {
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!R) return;
  if (cc.listening && recog) { recog.stop(); return; }
  recog = new R(); recog.lang = 'en-GB'; recog.interimResults = false; recog.continuous = false;
  recog.onresult = (e) => { const said = Array.from(e.results).map(r => r[0].transcript).join(' '); cc.msgDraft = (cc.msgDraft ? cc.msgDraft.trim() + ' ' : '') + said; };
  recog.onend = () => { cc.listening = false; render(); const el = document.getElementById('cos-msg'); if (el) el.focus(); };
  recog.onerror = () => { cc.listening = false; render(); };
  cc.listening = true; render(); recog.start();
}
/* Clicks on the Home and business pages. Returns true when it handled the click. */
function ccClick(e) {
  const b = e.target.closest('[data-cc]');
  if (!b) return false;
  const act = b.dataset.cc, v = b.dataset.v;
  const refocus = (sel) => { const f = document.querySelector(sel); if (f) f.focus(); };
  if (b.tagName === 'A') e.preventDefault();
  if (act === 'cos-toggle') { cc.cosOpen = !cc.cosOpen; ccStore('cosOpen', cc.cosOpen); render(); refocus('[data-cc="cos-toggle"]'); }
  else if (act === 'plan-toggle') { cc.planOpen = !cc.planOpen; ccStore('planOpen', cc.planOpen); render(); refocus('[data-cc="plan-toggle"]'); }
  else if (act === 'home-period') { cc.homePeriod = v; render(); }
  else if (act === 'act-filter') { cc.actFilter = v; cc.actShown = ACTIVITY_PAGE; render(); }
  else if (act === 'act-more') { cc.actShown += ACTIVITY_PAGE; render(); }
  else if (act === 'fleet-toggle') { cc.fleetOpen[b.dataset.k] = !cc.fleetOpen[b.dataset.k]; render(); }
  else if (act === 'fleet-all') {
    const m = {}; visibleJobs().forEach(j => { m[j.stream || '__all'] = v === 'open'; });
    cc.fleetOpen = m;
    render();
  }
  else if (act === 'make-live') { cc.makeLive = b.dataset.tid; render(); refocus('[data-cc="set-pri"]'); }
  else if (act === 'make-live-cancel') { cc.makeLive = null; render(); }
  else if (act === 'set-pri') {
    const t = getTask(b.dataset.tid); const p = Number(b.dataset.p);
    if (t && setPriorityLive(t.id, p)) { cc.makeLive = null; toast('“' + t.title + '” is now live at P' + p + '.'); render(); }
  }
  else if (act === 'show-noprio') { ui.view = 'list'; ui.filterArea = null; ui.filterProject = null; ui.fQuad = ''; ui.fStatus = ''; ui.fPri = '0'; render(); document.getElementById('content').scrollTop = 0; }
  else if (act === 'show-loose') { ui.view = 'list'; ui.filterArea = null; ui.filterProject = null; ui.fQuad = ''; ui.fStatus = ''; ui.fPri = ''; ui.search = ''; render(); document.getElementById('content').scrollTop = 0; }
  else if (act === 'ans-opt') {
    b.disabled = true;
    if (b.dataset.kind === 'd') decide(b.dataset.id, Number(b.dataset.i));
    else { const q = D.questions.find(x => x.id === b.dataset.id); answerQuestion(b.dataset.id, q ? optionLabels(q.options)[Number(b.dataset.i)] : ''); }
  }
  else if (act === 'job-done') { b.disabled = true; jobDealtWith(b.dataset.id); }
  else if (act === 'cos-biz') { cc.cosBizOpen[b.dataset.k] = !cc.cosBizOpen[b.dataset.k]; render(); refocus('[data-cc="cos-biz"][data-k="' + b.dataset.k + '"]'); }
  else if (act === 'dictate') { toggleDictation(); }
  return true;
}
document.addEventListener('input', (e) => {
  if (!e.target) return;
  if (e.target.id === 'cos-msg') cc.msgDraft = e.target.value;
  else if (e.target.dataset && e.target.dataset.ans) cc.ansDraft[e.target.dataset.ans] = e.target.value;   // survives a re-render
});
document.addEventListener('submit', (e) => {
  const ans = e.target.closest('[data-form="ans"]');
  if (ans) {
    e.preventDefault();
    const text = cc.ansDraft[ans.dataset.kind + '-' + ans.dataset.id] || '';
    if (!text.trim()) { toast('Type an answer, or pick one of the options'); return; }
    if (ans.dataset.kind === 'd') decide(ans.dataset.id, -1, text); else answerQuestion(ans.dataset.id, text);
    return;
  }
  const f = e.target.closest('[data-form="msg"]');
  if (!f) return;
  e.preventDefault();
  sendCosMessage(cc.msgDraft);
});

/* ---------- One address per page: Back, Forward and refresh all behave ----------
   #/home, #/list ... with /g/<group id> or /p/<project id> when one is chosen.
   Old Command Centre addresses (#/stream/<id>, #/streams, #/parked) still land sensibly. */
function navHash() {
  return '#/' + ui.view + (ui.filterProject ? '/p/' + encodeURIComponent(ui.filterProject) : ui.filterArea ? '/g/' + encodeURIComponent(ui.filterArea) : '');
}
let navReady = false, navBooted = false;   // navBooted: the address the app was opened on has been read
function syncUrl() {
  if (!navBooted || /^#task=/.test(location.hash)) return;
  const h = navHash();
  if (location.hash === h) { navReady = true; return; }
  try {
    if (navReady) history.pushState(null, '', h); else history.replaceState(null, '', h);
  } catch (e) {}
  navReady = true;
}
function applyHash() {
  const raw = location.hash.replace(/^#\/?/, '');
  if (!raw || !/^#\//.test(location.hash)) return false;
  let parts;
  try { parts = raw.split('/').map(decodeURIComponent); } catch (e) { return false; }
  let view = parts[0], area = null, proj = null;
  if (view === 'stream' || view === 'streams') { const a = areaForStream(parts[1]); view = 'home'; area = a ? a.id : null; }
  else if (view === 'parked' || view === 'agents') view = 'home';
  else if (parts[1] === 'g' && parts[2] && areaOf(parts[2])) area = parts[2];
  else if (parts[1] === 'p' && parts[2] && state.projects.some(p => p.id === parts[2])) proj = parts[2];
  if (!NAV_VIEWS.includes(view)) return false;
  if (proj && view === 'home') view = 'list';
  ui.view = view; ui.filterProject = proj; ui.filterArea = proj ? null : area;
  return true;
}
window.addEventListener('hashchange', () => {
  if (!sbUser) return;
  if (/^#task=/.test(location.hash)) { openTaskFromLink(); return; }
  if (applyHash()) { closeModal(); cc.makeLive = null; render(); document.getElementById('content').scrollTop = 0; }
});

/* Keep briefs, agents and activity fresh while the app stays open, and catch up after the device wakes. */
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { hiddenAt = Date.now(); return; }
  if (!sbUser) return;
  ccScheduleReload();
  if (Date.now() - hiddenAt > 30000) softRefresh();
});
setInterval(() => { if (sbUser && document.visibilityState === 'visible') { ccScheduleReload(); softRefresh(); } }, 300000);


/* ================= Auth & boot ================= */

let authMode = 'signin';

function showAuth() {
  document.getElementById('shell').style.display = 'none';
  document.getElementById('tabbar').style.display = '';
  document.getElementById('authWrap').style.display = 'flex';
}

function showShell() {
  document.getElementById('authWrap').style.display = 'none';
  document.getElementById('shell').style.display = 'flex';
}

function setAuthMode(mode) {
  authMode = mode;
  document.getElementById('authGo').textContent = mode === 'signin' ? 'Sign in' : 'Create account';
  document.getElementById('authSub').textContent = mode === 'signin'
    ? 'Sign in to see your work on any device.'
    : 'Choose the email and password you will use on every device.';
  document.getElementById('authAlt').innerHTML = mode === 'signin'
    ? 'First time here? <button id="authToggle">Create your account</button>'
    : 'Already set up? <button id="authToggle">Sign in instead</button>';
  document.getElementById('authToggle').addEventListener('click', () => setAuthMode(authMode === 'signin' ? 'signup' : 'signin'));
  document.getElementById('authErr').textContent = '';
}

async function doAuth() {
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPass').value;
  const err = document.getElementById('authErr');
  if (!email || !pass) { err.textContent = 'Enter your email and password.'; return; }
  if (authMode === 'signup' && pass.length < 8) { err.textContent = 'Use a password of at least 8 characters.'; return; }
  const btn = document.getElementById('authGo');
  btn.disabled = true; err.textContent = '';
  try {
    const fn = authMode === 'signin'
      ? sb.auth.signInWithPassword({ email, password: pass })
      : sb.auth.signUp({ email, password: pass });
    const { error } = await fn;
    if (error) {
      err.textContent = /invalid/i.test(error.message) ? 'Email or password not recognised.' :
        /already registered/i.test(error.message) ? 'That email already has an account. Sign in instead.' :
        /signups not allowed/i.test(error.message) ? 'New accounts are switched off for this app.' :
        error.message;
    }
  } catch (e) {
    err.textContent = 'Could not reach the server. Check your connection and try again.';
  }
  btn.disabled = false;
}

async function enterApp(session) {
  sbUser = session.user;
  showShell();
  let hashDone = false;
  if (loadCache()) { applyListPrefs(); applyHash(); hashDone = true; navBooted = true; render(); }
  ccStart();
  await fullLoad();
  applyListPrefs();
  if (!hashDone) applyHash();
  navBooted = true;
  render();
  subscribeRealtime();
  openTaskFromLink();
}

/* A link of the form sorted/#task=<id> (handy for the Chief of Staff and agents to hand out)
   opens that task's sheet over whatever page is showing, then tidies the address. */
function openTaskFromLink() {
  const m = location.hash.match(/^#task=(.+)$/);
  if (!m || !sbUser) return;
  let id = m[1];
  try { id = decodeURIComponent(m[1]); } catch (e) {}
  history.replaceState(null, '', location.pathname + location.search + navHash());
  if (!getTask(id)) { toast('That task is no longer in Sorted.'); return; }
  openEdit(id);
}

async function signOutNow() {
  try { await sb.auth.signOut(); } catch (e) {}
  localStorage.removeItem(STORE_KEY);
  state.tasks = []; state.projects = []; state.areas = []; state.settings = defaultSettings();
  sbUser = null;
  ccReset();
  closeModal();
  showAuth();
}

document.getElementById('authGo').addEventListener('click', doAuth);
document.getElementById('authPass').addEventListener('keydown', (e) => { if (e.key === 'Enter') doAuth(); });
document.getElementById('authToggle').addEventListener('click', () => setAuthMode('signup'));

(async function boot() {
  if (!window.supabase) {
    document.getElementById('authWrap').style.display = 'flex';
    document.getElementById('authErr').textContent = 'Could not load the sync library. Check your connection and refresh.';
    return;
  }
  sb = window.supabase.createClient(SB_URL, SB_ANON, { db: { schema: SB_SCHEMA } });
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN' && session && !sbUser) enterApp(session);
    if (event === 'SIGNED_OUT') { sbUser = null; ccReset(); showAuth(); }
  });
  const { data } = await sb.auth.getSession();
  if (data && data.session) enterApp(data.session);
  else showAuth();
})();
</script>
