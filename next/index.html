<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sorted">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<title>Sorted</title>
<style>
  /* ---------- Design tokens ---------- */
  /* One palette for the whole app. q1-q4 double as the agent status colours on Home:
     stuck red, running blue, needs-you amber, idle grey. */
  :root {
    --bg: #F3F4F7;
    --surface: #FFFFFF;
    --surface-2: #F0F1F4;
    --ink: #111318;
    --ink-soft: #5C6270;
    --ink-faint: #666C7A;
    --line: #E5E7EC;
    --line-soft: #EDEFF3;
    --accent: #111318;
    --accent-ink: #FFFFFF;
    --accent-soft: #ECEDF1;
    --link: #3F4BC4;
    --q1: #A6211A; --q1-soft: #FDECEA; --q1-tint: #FEF6F5;
    --q2: #1D4BB8; --q2-soft: #E7EEFF; --q2-tint: #F4F7FF;
    --q3: #8A4B00; --q3-soft: #FFF1DB; --q3-tint: #FFF9EF;
    --q4: #4A4F5C; --q4-soft: #F0F1F4; --q4-tint: #F7F8FA;
    --danger: #A6211A;
    --shadow: 0 1px 2px rgba(17,19,24,0.06), 0 4px 14px rgba(17,19,24,0.05);
    --shadow-lift: 0 6px 24px rgba(17,19,24,0.18);
    --radius: 12px;
    --serif: 'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --sans: 'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --mono: 'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F1115;
      --surface: #171A21;
      --surface-2: #1F232B;
      --ink: #ECEEF2;
      --ink-soft: #A9AFBB;
      --ink-faint: #8A909C;
      --line: #2B303A;
      --line-soft: #232730;
      --accent: #ECEEF2;
      --accent-ink: #111318;
      --accent-soft: #2A2F3A;
      --link: #A8B0FF;
      --q1: #F08A7E; --q1-soft: #3A1F1D; --q1-tint: #221615;
      --q2: #8FB2FF; --q2-soft: #1D2A4A; --q2-tint: #151B2B;
      --q3: #E7B45C; --q3-soft: #3A2C14; --q3-tint: #211B10;
      --q4: #A3A9B5; --q4-soft: #2A2E36; --q4-tint: #1C1F25;
      --danger: #F08A7E;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.25);
      --shadow-lift: 0 6px 28px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1115;
    --surface: #171A21;
    --surface-2: #1F232B;
    --ink: #ECEEF2;
    --ink-soft: #A9AFBB;
    --ink-faint: #8A909C;
    --line: #2B303A;
    --line-soft: #232730;
    --accent: #ECEEF2;
    --accent-ink: #111318;
    --accent-soft: #2A2F3A;
    --link: #A8B0FF;
    --q1: #F08A7E; --q1-soft: #3A1F1D; --q1-tint: #221615;
    --q2: #8FB2FF; --q2-soft: #1D2A4A; --q2-tint: #151B2B;
    --q3: #E7B45C; --q3-soft: #3A2C14; --q3-tint: #211B10;
    --q4: #A3A9B5; --q4-soft: #2A2E36; --q4-tint: #1C1F25;
    --danger: #F08A7E;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.25);
    --shadow-lift: 0 6px 28px rgba(0,0,0,0.5);
  }
  :root[data-theme="light"] {
    --bg: #F3F4F7;
    --surface: #FFFFFF;
    --surface-2: #F0F1F4;
    --ink: #111318;
    --ink-soft: #5C6270;
    --ink-faint: #666C7A;
    --line: #E5E7EC;
    --line-soft: #EDEFF3;
    --accent: #111318;
    --accent-ink: #FFFFFF;
    --accent-soft: #ECEDF1;
    --link: #3F4BC4;
    --q1: #A6211A; --q1-soft: #FDECEA; --q1-tint: #FEF6F5;
    --q2: #1D4BB8; --q2-soft: #E7EEFF; --q2-tint: #F4F7FF;
    --q3: #8A4B00; --q3-soft: #FFF1DB; --q3-tint: #FFF9EF;
    --q4: #4A4F5C; --q4-soft: #F0F1F4; --q4-tint: #F7F8FA;
    --danger: #A6211A;
    --shadow: 0 1px 2px rgba(17,19,24,0.06), 0 4px 14px rgba(17,19,24,0.05);
    --shadow-lift: 0 6px 24px rgba(17,19,24,0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input, select, textarea { font: inherit; color: var(--ink); }
  :focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }

  /* ---------- Shell ---------- */
  .shell { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }

  .sidebar {
    width: 244px; flex: none;
    border-right: 1px solid var(--line);
    background: var(--surface);
    display: flex; flex-direction: column;
    padding: 20px 14px 14px;
    gap: 4px;
    overflow-y: auto;
  }
  .area-row { display: flex; align-items: center; }
  .area-row .proj-btn { flex: 1; font-weight: 600; color: var(--ink); }
  .area-row .proj-btn.active { color: var(--ink); }
  .caret { padding: 4px 7px; color: var(--ink-faint); font-size: 10px; border-radius: 6px; }
  .caret:hover { background: var(--surface-2); color: var(--ink); }
  .proj-btn.indent { padding-left: 28px; }
  .kebab { padding: 4px 5px; color: var(--ink-faint); font-size: 14px; border-radius: 6px; opacity: 0; transition: opacity 0.12s; }
  .area-row:hover .kebab, .kebab:focus-visible { opacity: 1; }
  .kebab:hover { background: var(--surface-2); color: var(--ink); }
  .swatch-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .bg-swatch {
    width: 44px; height: 34px; border-radius: 8px;
    border: 2px solid var(--line);
    color: var(--ink-faint); font-size: 15px;
  }
  .bg-swatch.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .brand {
    font-family: var(--serif);
    font-size: 26px; font-weight: 600;
    letter-spacing: -0.02em;
    padding: 0 10px 14px;
    color: var(--ink);
  }
  .brand .dot { color: var(--link); }
  .nav-btn {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; border-radius: 8px;
    color: var(--ink-soft); text-align: left;
    font-weight: 500;
    transition: background 0.12s;
  }
  .nav-btn:hover { background: var(--surface-2); }
  .nav-btn.active { background: var(--accent); color: var(--accent-ink); }
  .nav-btn.active .nav-count { color: inherit; opacity: 0.75; }
  a.nav-btn { text-decoration: none; }
  .nav-btn svg { flex: none; }
  .nav-count { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }

  .side-label {
    margin: 18px 10px 6px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-faint);
    display: flex; align-items: center; justify-content: space-between;
  }
  .side-label button { color: var(--ink-faint); font-size: 16px; line-height: 1; padding: 0 2px; }
  .side-label button:hover { color: var(--link); }
  .proj-btn {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 10px; border-radius: 8px;
    color: var(--ink-soft); text-align: left; width: 100%;
  }
  .proj-btn:hover { background: var(--surface-2); }
  .proj-btn.active { background: var(--surface-2); color: var(--ink); font-weight: 600; }
  .proj-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .proj-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sidebar-foot { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line-soft); }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  .topbar {
    display: flex; gap: 10px; align-items: center;
    padding: 14px 22px 10px;
  }
  .view-title {
    font-family: var(--serif);
    font-size: 24px; font-weight: 600; letter-spacing: -0.02em;
    text-wrap: balance;
    margin-right: auto;
    white-space: nowrap;
  }
  .view-sub { font-size: 13px; color: var(--ink-faint); margin-left: 10px; font-family: var(--sans); font-weight: 400; }

  .quickadd-wrap { padding: 4px 22px 12px; }
  .quickadd {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 4px 6px 4px 14px;
    box-shadow: var(--shadow);
  }
  .quickadd:focus-within { border-color: var(--accent); }
  .quickadd input {
    flex: 1; border: none; background: none; outline: none;
    padding: 8px 0; font-size: 15px;
  }
  .quickadd input::placeholder { color: var(--ink-faint); }
  .quickadd .add-go {
    background: var(--accent); color: var(--accent-ink);
    border-radius: 8px; padding: 8px 16px; font-weight: 600;
  }
  .quickadd-hint {
    font-size: 12px; color: var(--ink-faint);
    padding: 6px 4px 0;
  }
  .quickadd-hint b { font-weight: 600; color: var(--ink-soft); }

  .searchbar { position: relative; }
  .searchbar input {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 12px 8px 32px; width: 190px; outline: none;
  }
  .searchbar input:focus { border-color: var(--accent); }
  .searchbar svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--ink-faint); }

  .icon-btn {
    padding: 8px; border-radius: 8px; color: var(--ink-soft);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink); }

  .content { flex: 1; overflow-y: auto; padding: 4px 22px 90px; }

  /* ---------- Task rows ---------- */
  .task-row {
    display: flex; align-items: flex-start; gap: 11px;
    background: var(--surface);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius);
    padding: 11px 13px;
    margin-bottom: 7px;
    cursor: pointer;
    transition: box-shadow 0.12s, border-color 0.12s;
  }
  .task-row:hover { border-color: var(--line); box-shadow: var(--shadow); }
  .task-row.drop-above { box-shadow: 0 -3px 0 0 var(--accent); }
  .task-row.drop-below { box-shadow: 0 3px 0 0 var(--accent); }
  .task-row.done-row { opacity: 0.6; }
  .task-row.done-row .t-title { text-decoration: line-through; }
  .check {
    flex: none; width: 20px; height: 20px; margin-top: 1px;
    border: 2px solid var(--ink-faint); border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    color: transparent; background: none;
    transition: all 0.12s;
  }
  .check:hover { border-color: var(--accent); }
  .check.checked { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .t-body { flex: 1; min-width: 0; }
  .t-title { font-weight: 500; overflow-wrap: anywhere; }
  .t-meta { display: flex; flex-wrap: wrap; gap: 5px 10px; margin-top: 4px; font-size: 12px; color: var(--ink-faint); align-items: center; }
  .t-meta .m-proj { display: inline-flex; align-items: center; gap: 5px; }
  .m-due.overdue { color: var(--q1); font-weight: 600; }
  .m-due.today { color: var(--q3); font-weight: 600; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 600;
    padding: 1px 8px; border-radius: 999px;
  }
  .chip.q1 { background: var(--q1-soft); color: var(--q1); }
  .chip.q2 { background: var(--q2-soft); color: var(--q2); }
  .chip.q3 { background: var(--q3-soft); color: var(--q3); }
  .chip.q4 { background: var(--q4-soft); color: var(--q4); }
  .chip.st { background: var(--surface-2); color: var(--ink-soft); }
  .star-btn { flex: none; color: var(--ink-faint); padding: 2px; margin-top: -1px; }
  .star-btn:hover { color: var(--q3); }
  .star-btn.on { color: var(--q3); }

  .group-head {
    font-family: var(--serif);
    font-size: 16px; font-weight: 600; letter-spacing: -0.01em;
    margin: 20px 2px 9px;
    display: flex; align-items: baseline; gap: 8px;
  }
  .group-head:first-child { margin-top: 8px; }
  .group-head .g-count { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .group-head .g-dot { width: 10px; height: 10px; border-radius: 50%; align-self: center; }
  .sub-head {
    font-size: 13px; font-weight: 600; color: var(--ink-soft);
    margin: 10px 2px 6px; display: flex; gap: 7px; align-items: center;
  }
  .sub-head .g-dot { width: 8px; height: 8px; border-radius: 50%; }
  .sub-head .g-count { font-size: 11px; font-weight: 500; color: var(--ink-faint); font-variant-numeric: tabular-nums; }

  .toolbar {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 2px 0 8px;
  }
  .seg { display: inline-flex; background: var(--surface-2); border-radius: 8px; padding: 3px; }
  .seg button { padding: 5px 12px; border-radius: 6px; font-size: 13px; color: var(--ink-soft); font-weight: 500; }
  .seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(17,19,24,0.12); }
  .tool-label { font-size: 12px; color: var(--ink-faint); margin-right: -2px; }
  .link-btn { color: var(--link); font-size: 13px; font-weight: 600; padding: 5px 8px; border-radius: 6px; }
  .link-btn:hover { background: var(--accent-soft); }

  .empty {
    text-align: center; color: var(--ink-faint);
    padding: 48px 20px; font-size: 14px;
  }
  .empty .e-big { font-family: var(--serif); font-weight: 600; font-size: 19px; color: var(--ink-soft); margin-bottom: 6px; }

  /* ---------- Priority table ---------- */
  .table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius); box-shadow: var(--shadow); }
  .ptable { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 520px; }
  .ptable th {
    text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--ink-faint);
    padding: 10px 12px; border-bottom: 1px solid var(--line);
  }
  .ptable td { padding: 10px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
  .ptable tr:last-child td { border-bottom: none; }
  .ptable tbody tr { cursor: pointer; }
  .ptable tbody tr:hover td { background: var(--surface-2); }
  .ptable .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pri-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 50%;
    font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums;
  }
  .pri-1 { background: var(--q1-soft); color: var(--q1); }
  .pri-2 { background: var(--q3-soft); color: var(--q3); }
  .pri-3 { background: var(--q2-soft); color: var(--q2); }
  .pri-4 { background: var(--q4-soft); color: var(--q4); }
  .chip.pri { background: var(--surface-2); color: var(--ink-soft); }

  /* ---------- Tiles, filters, steps ---------- */
  .tile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; margin-bottom: 7px; }
  .tile-grid .task-row { margin-bottom: 0; align-items: flex-start; }
  .mini-select {
    padding: 6px 9px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); font-size: 13px; color: var(--ink-soft); outline: none;
  }
  .mini-select:focus { border-color: var(--accent); }
  .step-row { display: flex; align-items: center; gap: 9px; padding: 5px 0; }
  .step-row .check { width: 17px; height: 17px; margin-top: 0; }
  .step-title { flex: 1; font-size: 14px; overflow-wrap: anywhere; }
  .step-row.done .step-title { text-decoration: line-through; color: var(--ink-faint); }
  .step-del { color: var(--ink-faint); font-size: 16px; line-height: 1; padding: 2px 6px; border-radius: 6px; }
  .step-del:hover { color: var(--danger); background: var(--q1-soft); }
  /* Optional due date on a step: a small chip, or a calendar button when none is set */
  .step-due {
    flex: none; font-size: 12px; font-weight: 600; line-height: 1.3; padding: 3px 9px; border-radius: 999px;
    background: var(--surface-2); color: var(--ink-soft); font-variant-numeric: tabular-nums;
  }
  .step-due.none { background: none; color: var(--ink-faint); padding: 4px 5px; display: inline-flex; border-radius: 6px; }
  .step-due:hover { color: var(--ink); background: var(--surface-2); }
  .step-due.overdue { background: var(--q1-soft); color: var(--q1); }
  .step-due.today { background: var(--q3-soft); color: var(--q3); }
  .step-row.done .step-due { opacity: 0.6; }
  .step-date {
    flex: none; font-size: 12px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--ink); outline: none;
  }
  .step-date:focus { border-color: var(--accent); }


  /* ---------- Matrix ---------- */
  .matrix-wrap { display: grid; grid-template-columns: 26px 1fr 1fr; grid-template-rows: 24px 1fr 1fr; gap: 8px; min-height: 60vh; }
  .ax {
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-faint);
  }
  .ax.vert { writing-mode: vertical-rl; transform: rotate(180deg); }
  .quad {
    background: var(--surface);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius);
    padding: 10px;
    display: flex; flex-direction: column;
    min-height: 170px;
    transition: border-color 0.12s, background 0.12s;
  }
  .quad.qc1 { background: var(--q1-tint); border-color: var(--q1-soft); }
  .quad.qc2 { background: var(--q2-tint); border-color: var(--q2-soft); }
  .quad.qc3 { background: var(--q3-tint); border-color: var(--q3-soft); }
  .quad.qc4 { background: var(--q4-tint); border-color: var(--q4-soft); }
  .quad .task-row { background: var(--surface); }
  .q-axes { display: none; font-size: 11px; font-weight: 500; color: var(--ink-faint); margin-left: 4px; }
  .quad.drag-over { border-color: var(--accent); background: var(--accent-soft); }
  .quad-head {
    display: flex; align-items: center; gap: 8px;
    padding: 2px 4px 8px;
    font-weight: 700; font-size: 14px;
  }
  .quad-head .q-mark { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .quad-head .q-count { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--ink-faint); font-weight: 500; font-variant-numeric: tabular-nums; }
  .quad-body { flex: 1; overflow-y: auto; }
  .quad-body .task-row { padding: 8px 10px; margin-bottom: 6px; }
  .quad-body .t-meta { margin-top: 2px; }
  .tray {
    margin-top: 14px;
    background: var(--surface-2);
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    padding: 12px;
  }
  .tray.drag-over { border-color: var(--accent); background: var(--accent-soft); }
  .tray-head { font-weight: 700; font-size: 14px; display: flex; gap: 8px; align-items: baseline; margin-bottom: 8px; }
  .tray-head span { font-size: 12px; color: var(--ink-faint); font-weight: 500; }
  .drag-hint { font-size: 12px; color: var(--ink-faint); padding: 4px 2px 10px; }

  /* ---------- Board ---------- */
  .board { display: grid; grid-template-columns: repeat(4, minmax(230px, 1fr)); gap: 10px; align-items: start; overflow-x: auto; padding-bottom: 10px; }
  .col {
    background: var(--surface-2);
    border-radius: var(--radius);
    padding: 10px;
    min-height: 200px;
    border: 1px solid transparent;
  }
  .col.drag-over { border-color: var(--accent); background: var(--accent-soft); }
  .col-head { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; padding: 2px 4px 10px; }
  .col-head .q-count { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--ink-faint); font-weight: 500; font-variant-numeric: tabular-nums; }
  .col .task-row { padding: 9px 11px; }

  /* ---------- Modal / sheet ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(17,19,24,0.45);
    display: flex; align-items: center; justify-content: center;
    padding: 18px;
  }
  .sheet {
    background: var(--surface);
    border-radius: 16px;
    box-shadow: var(--shadow-lift);
    width: 100%; max-width: 520px;
    max-height: calc(100vh - 40px); max-height: calc(100dvh - 40px);
    overflow-y: auto;
    padding: 22px;
  }
  .sheet h2 { font-family: var(--serif); font-weight: 600; letter-spacing: -0.01em; font-size: 20px; margin-bottom: 14px; }
  .f-row { margin-bottom: 14px; }
  .f-label { display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 6px; }
  .f-input, .f-select, .f-textarea {
    width: 100%; background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 12px; outline: none;
  }
  .f-input:focus, .f-select:focus, .f-textarea:focus { border-color: var(--accent); }
  .f-textarea { resize: vertical; min-height: 64px; }
  .pick-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .pick {
    padding: 7px 12px; border-radius: 8px;
    background: var(--surface-2); color: var(--ink-soft);
    font-size: 13px; font-weight: 600;
    border: 1px solid transparent;
  }
  .pick.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .pick.q1.on { background: var(--q1-soft); color: var(--q1); border-color: var(--q1); }
  .pick.q2.on { background: var(--q2-soft); color: var(--q2); border-color: var(--q2); }
  .pick.q3.on { background: var(--q3-soft); color: var(--q3); border-color: var(--q3); }
  .pick.q4.on { background: var(--q4-soft); color: var(--q4); border-color: var(--q4); }
  .sheet-actions { display: flex; gap: 8px; margin-top: 20px; align-items: center; }
  /* Task sheet: a quiet aside beside a label, the one-line status box, the waiting-on pair,
     and Save pinned to the bottom so it stays in reach above a long history */
  .f-aside { font-weight: 500; letter-spacing: 0; text-transform: none; margin-left: 7px; }
  .f-textarea.f-status { min-height: 0; resize: none; font-weight: 500; overflow: hidden; }
  .wait-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .wait-row > div { flex: 1; min-width: 150px; }
  .sheet.task-sheet { padding-bottom: 0; }
  /* Steps with the task's optional picture beside them (above them on a phone) */
  .steps-wrap { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
  .steps-main { flex: 1 1 220px; min-width: 0; }
  .task-img { flex: 0 0 132px; display: flex; flex-direction: column; gap: 5px; }
  .task-img.none { flex: 1 1 100%; }
  .task-img.busy { opacity: 0.5; pointer-events: none; }
  .img-view { display: block; width: 100%; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--bg); cursor: zoom-in; }
  .img-view img { display: block; width: 100%; height: 132px; object-fit: cover; }
  .img-acts { display: flex; gap: 12px; justify-content: center; }
  .img-acts button, .img-add { font-size: 12px; font-weight: 500; color: var(--ink-faint); }
  .img-acts button:hover, .img-add:hover { color: var(--ink); text-decoration: underline; }
  .img-add { display: inline-flex; align-items: center; gap: 6px; padding: 2px 0; align-self: flex-start; }
  .lightbox { position: fixed; inset: 0; z-index: 120; background: rgba(10,12,16,0.88); display: flex; align-items: center; justify-content: center; padding: 20px; cursor: zoom-out; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
  .lightbox button { position: absolute; top: 12px; right: 14px; color: #FFFFFF; font-size: 30px; line-height: 1; padding: 4px 10px; }
  @media (max-width: 520px) {
    .task-img { flex: 1 1 100%; order: -1; }
    .task-img.none { order: 0; }
    .img-view img { height: 180px; }
  }
  .task-sheet .sheet-actions {
    position: sticky; bottom: 0; z-index: 2; background: var(--surface);
    margin: 6px -22px 0; padding: 12px 22px calc(12px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--line-soft);
  }
  .btn-primary {
    background: var(--accent); color: var(--accent-ink);
    padding: 10px 20px; border-radius: 8px; font-weight: 600;
  }
  .btn-quiet { padding: 10px 14px; border-radius: 8px; color: var(--ink-soft); font-weight: 500; }
  .btn-quiet:hover { background: var(--surface-2); }
  .btn-danger { color: var(--danger); padding: 10px 14px; border-radius: 8px; font-weight: 600; margin-right: auto; }
  .btn-danger:hover { background: var(--q1-soft); }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg);
    padding: 10px 18px; border-radius: 999px;
    font-size: 14px; font-weight: 500;
    box-shadow: var(--shadow-lift);
    z-index: 90; opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
    max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; }

  /* ---------- Mind map ---------- */
  .map-wrap {
    position: relative;
    height: calc(100vh - 215px); height: calc(100dvh - 215px);
    min-height: 320px;
    background: var(--surface);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius);
    overflow: hidden;
    touch-action: none;
  }
  .map-svg { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; -webkit-user-select: none; }
  .map-svg.panning { cursor: grabbing; }
  .map-toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 2px 0 8px; }
  .map-actions {
    position: absolute; top: 10px; left: 10px; z-index: 5;
    display: flex; gap: 6px; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 9px; padding: 5px; box-shadow: var(--shadow);
  }
  .map-actions button { padding: 5px 10px; border-radius: 6px; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); }
  .map-actions button:hover:not(:disabled) { background: var(--surface-2); color: var(--ink); }
  .map-actions button:disabled { opacity: 0.35; cursor: default; }
  .map-zoom {
    position: absolute; bottom: 10px; right: 10px; z-index: 5;
    display: flex; gap: 4px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 9px; padding: 4px; box-shadow: var(--shadow);
  }
  .map-zoom button { width: 30px; height: 28px; border-radius: 6px; font-weight: 700; color: var(--ink-soft); }
  .map-zoom button:hover { background: var(--surface-2); color: var(--ink); }
  .map-node { cursor: pointer; }
  .map-node rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
  .map-node.sel rect { stroke: var(--accent); stroke-width: 2.2; }
  .map-node.droptgt rect { stroke: var(--accent); stroke-width: 2.2; stroke-dasharray: 4 3; }
  .map-node text { fill: var(--ink); font-size: 13px; font-family: var(--sans); }
  .map-node .n-meta { fill: var(--ink-faint); font-size: 10.5px; }
  .map-node.done rect { opacity: 0.55; }
  .map-node.done .n-title { text-decoration: line-through; fill: var(--ink-faint); }
  .map-node.root-node rect { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.6; }
  .map-node.root-node text { font-family: var(--serif); font-size: 16px; font-weight: 600; fill: var(--accent); }
  .map-node .zi { fill: var(--accent); opacity: 0; pointer-events: none; }
  .map-node.rz-top .zi-top { opacity: 1; }
  .map-node.rz-bottom .zi-bottom { opacity: 1; }
  .map-node.step-node rect { fill: var(--surface-2); stroke: var(--line-soft); }
  .map-node.step-node text { font-size: 12px; fill: var(--ink-soft); }
  .map-node.step-node.done text { text-decoration: line-through; fill: var(--ink-faint); }
  .map-edge { fill: none; stroke-width: 1.6; opacity: 0.55; }
  .map-collapse { cursor: pointer; }
  .map-collapse circle { fill: var(--surface); stroke: var(--ink-faint); stroke-width: 1.2; }
  .map-collapse text { fill: var(--ink-soft); font-size: 10px; font-weight: 700; text-anchor: middle; }
  .map-inline-input {
    position: absolute; z-index: 6;
    border: 2px solid var(--accent); border-radius: 7px;
    background: var(--surface); color: var(--ink);
    padding: 6px 9px; font-size: 13px; outline: none;
    box-shadow: var(--shadow-lift);
    min-width: 180px;
  }
  @media (max-width: 880px) {
    .map-wrap { height: calc(100vh - 300px); height: calc(100dvh - 300px); }
  }

  /* Children indented under their parent in list rows */
  .task-row.child-row { margin-left: 26px; }
  .tile-grid .task-row.child-row { margin-left: 0; }

  /* Desktop: sheets slide in as a right-hand panel (must come after base .sheet rules) */
  @media (min-width: 881px) {
    .overlay { justify-content: flex-end; align-items: stretch; padding: 0; }
    .overlay .sheet {
      max-width: 480px; max-height: none; height: 100%;
      border-radius: 0; border-left: 1px solid var(--line);
      animation: slide-in 0.18s ease-out;
    }
  }
  @keyframes slide-in { from { transform: translateX(30px); opacity: 0.5; } to { transform: none; opacity: 1; } }

  /* ---------- Auth ---------- */
  .auth-wrap {
    position: fixed; inset: 0; z-index: 100;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .auth-card {
    width: 100%; max-width: 360px;
    background: var(--surface);
    border: 1px solid var(--line-soft);
    border-radius: 14px;
    box-shadow: var(--shadow-lift);
    padding: 30px 26px;
  }
  .auth-card .brand { padding: 0 0 4px; font-size: 32px; }
  .auth-sub { color: var(--ink-faint); font-size: 13.5px; margin-bottom: 20px; }
  .auth-card .f-row { margin-bottom: 12px; }
  .auth-btn {
    width: 100%; background: var(--accent); color: var(--accent-ink);
    padding: 11px; border-radius: 8px; font-weight: 600; font-size: 15px;
    margin-top: 4px;
  }
  .auth-btn:disabled { opacity: 0.6; cursor: default; }
  .auth-alt { text-align: center; margin-top: 14px; font-size: 13.5px; color: var(--ink-faint); }
  .auth-alt button { color: var(--link); font-weight: 600; }
  .auth-err { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 10px; text-align: center; }
  .sync-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--q2); flex: none;
    transition: background 0.3s;
  }
  .sync-dot.off { background: var(--q3); }

  /* ---------- Mobile ---------- */
  .tabbar { display: none; }
  .mobile-fab { display: none; }
  .chipbar { display: none; }
  .chip-f {
    flex: none; display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--line);
    font-size: 13px; font-weight: 600; color: var(--ink-soft);
    white-space: nowrap;
  }
  .chip-f.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  @media (max-width: 880px) {
    .sidebar { display: none; }
    .topbar { padding: 12px 14px 8px; flex-wrap: wrap; }
    .quickadd-wrap { padding: 4px 14px 10px; }
    .quickadd-hint { display: none; }
    .chipbar { display: flex; gap: 6px; overflow-x: auto; padding: 0 14px 10px; scrollbar-width: none; }
    .chipbar::-webkit-scrollbar { display: none; }
    .q-axes { display: inline; }
    .tile-grid { grid-template-columns: 1fr; }
    .content { padding: 4px 14px 130px; }
    .searchbar input { width: 130px; }
    .view-title { font-size: 21px; }
    .view-sub { display: block; margin-left: 0; }
    .matrix-wrap { grid-template-columns: 18px 1fr; grid-template-rows: auto auto auto auto auto; min-height: 0; }
    .ax.horiz { display: none; }
    .ax.vert { display: none; }
    .matrix-wrap .quad { grid-column: 1 / -1; min-height: 0; }
    .board { grid-template-columns: repeat(4, 82vw); }
    .tabbar {
      display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
      background: var(--surface);
      border-top: 1px solid var(--line);
      padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
    }
    .tab {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 6px 2px; border-radius: 8px;
      font-size: 10.5px; font-weight: 600; color: var(--ink-faint);
    }
    .tab.active { color: var(--accent); }
  }
  /* ---------- Home and business pages (formerly the separate Command Centre) ----------
     Everything here lives inside .cc so it cannot disturb the task views. Colours are
     aliases of the app tokens above, so these pages follow light and dark mode too. */
  :root {
    --panel: var(--surface);
    --sub: color-mix(in srgb, var(--surface) 55%, var(--bg));
    --track: var(--surface-2);
    --ink-2: color-mix(in srgb, var(--ink) 92%, var(--surface));
    --ink-3: color-mix(in srgb, var(--ink) 80%, var(--surface));
    --muted: var(--ink-soft);
    --cos: #7C5CE0;
    --cos-bg: color-mix(in srgb, var(--cos) 8%, var(--surface));
    --cos-ink: color-mix(in srgb, var(--cos) 58%, var(--ink));
    --run-bg: var(--q2-soft); --run-fg: var(--q2); --run-dot: #2563EB;
    --need-bg: var(--q3-soft); --need-fg: var(--q3); --need-dot: #E39A2B;
    --stuck-bg: var(--q1-soft); --stuck-fg: var(--q1); --stuck-dot: #D9483B;
    --idle-bg: var(--q4-soft); --idle-fg: var(--q4); --idle-dot: #9AA0AC;
  }
  .cc { position: relative; font-size: 14px; line-height: 1.45; padding-top: 4px; display: flex; flex-direction: column; gap: 14px; }
  .cc a { color: var(--link); text-decoration: none; }
  .cc a:hover { text-decoration: underline; }
  .cc .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .cc .mono { font-family: var(--mono); }
  .cc .muted { color: var(--muted); }
  .cc .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
  .cc .panel-pad { padding: 14px 16px; }
  .cc .panel-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-bottom: 6px; }
  .cc .panel-head h2 { font-size: 15px; font-weight: 600; flex: 1 1 auto; }
  .cc .panel-head h2 small { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 6px; }
  .cc .btn { height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); font-size: 12px; font-weight: 500; color: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; }
  .cc .btn:hover { background: var(--sub); text-decoration: none; }
  .cc .cc-seg { display: flex; gap: 2px; padding: 2px; border-radius: 8px; background: var(--track); }
  .cc .cc-seg button { height: 28px; padding: 0 10px; border-radius: 6px; font-size: 12px; font-weight: 500; color: var(--muted); }
  .cc .cc-seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(17,19,24,0.12); }
  .cc .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
  .cc .cc-empty { color: var(--muted); font-size: 13px; line-height: 1.5; padding: 8px 2px; }
  .cc .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .cc .badge .bd { width: 6px; height: 6px; border-radius: 50%; }
  .cc .s-run { background: var(--run-bg); color: var(--run-fg); }
  .cc .s-need { background: var(--need-bg); color: var(--need-fg); }
  .cc .s-stuck { background: var(--stuck-bg); color: var(--stuck-fg); }
  .cc .s-idle { background: var(--idle-bg); color: var(--idle-fg); }
  .cc .steps { display: flex; gap: 3px; }
  .cc .steps span { flex: 1 1 0; height: 5px; border-radius: 3px; background: var(--line); }
  .cc .chev { transition: transform .15s ease; flex: 0 0 auto; color: var(--muted); }
  .cc [aria-expanded="true"] > .chev { transform: rotate(90deg); }
  .cc .banner { padding: 10px 14px; border-radius: 12px; background: var(--stuck-bg); color: var(--stuck-fg); font-size: 13px; }
  .cc .tlink { color: inherit; text-align: left; font: inherit; overflow-wrap: anywhere; }
  .cc .tlink:hover { text-decoration: underline; }

  /* Home: Chief of Staff beside the main column */
  .cc .home { display: grid; grid-template-columns: minmax(240px, 290px) minmax(0, 1fr); gap: 14px; align-items: start; }
  .cc .home.cos-shut { grid-template-columns: 58px minmax(0, 1fr); }
  .cc .home-main { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
  .cc .cos { padding: 14px; display: flex; flex-direction: column; gap: 14px; position: sticky; top: 4px; max-height: calc(100vh - 190px); max-height: calc(100dvh - 190px); overflow-y: auto; }
  .cc .cos-head { display: flex; align-items: center; gap: 10px; }
  .cc .cos-av { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #4F5BD5, #7C5CE0); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; flex: 0 0 auto; }
  .cc .cos-title { display: flex; flex-direction: column; gap: 1px; flex: 1 1 auto; min-width: 0; }
  .cc .cos-title b { font-size: 14px; font-weight: 600; }
  .cc .cos-title span { font-size: 11px; color: var(--muted); }
  .cc .iconbtn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink-3); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .cc .iconbtn:hover { background: var(--sub); }
  .cc .cos-body { display: flex; flex-direction: column; gap: 14px; }
  .cc .cos-part h3 { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .cc .cos-part p { font-size: 13px; line-height: 1.55; color: var(--ink-2); white-space: pre-line; }
  .cc .decided { font-size: 12px; color: var(--muted); }
  /* What has changed since the brief was written, so its commentary is never read as current when it is not */
  .cc .fresh { font-size: 12px; line-height: 1.5; border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
  .cc .fresh.ok { background: var(--track); color: var(--muted); }
  .cc .fresh.stale { background: var(--need-bg); color: var(--need-fg); }
  .cc .fresh b { font-weight: 600; }
  .cc .fresh .tlink { text-decoration: underline; }
  .cc .sysnote { font-size: 12px; line-height: 1.5; color: var(--muted); padding-top: 10px; border-top: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 6px; }
  .cc .msgform { display: flex; gap: 6px; align-items: center; }
  .cc .msgform input { flex: 1 1 auto; min-width: 0; height: 40px; border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; font-size: 13px; background: var(--sub); outline: none; }
  .cc .msgform input:focus { border-color: var(--accent); }
  .cc .msgform input::placeholder { color: var(--ink-faint); }
  .cc .sqbtn { width: 40px; height: 40px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .cc .sqbtn.ghost { background: var(--panel); border: 1px solid var(--line); color: var(--ink-3); }
  .cc .sqbtn[aria-pressed="true"] { background: var(--stuck-dot); color: #FFFFFF; border-color: transparent; }
  .cc .cos-closed { padding: 10px 0; display: flex; flex-direction: column; align-items: center; gap: 10px; position: sticky; top: 4px; }
  .cc .cos-closed .cos-av { width: 38px; height: 38px; }
  .cc .cos-closed .lbl { display: none; }
  .cc .newdot { width: 8px; height: 8px; border-radius: 50%; background: var(--need-dot); }

  .cc .plan-head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line-soft); }
  .cc .plan-head .t { display: flex; flex-direction: column; gap: 1px; flex: 1 1 260px; }
  .cc .plan-head h2 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .cc .plan-head .t span { font-size: 12px; color: var(--muted); }
  .cc .plan-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  .cc .plan-col { padding: 14px 16px; border-right: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .cc .plan-col:last-child { border-right: 0; }
  .cc .plan-name { display: flex; flex-direction: column; gap: 3px; color: var(--ink); }
  .cc .plan-name:hover { text-decoration: none; }
  .cc .plan-name:hover b { text-decoration: underline; }
  .cc .plan-name b { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600; }

function uid() {
  return (crypto.randomUUID) ? crypto.randomUUID() : ('id-' + Date.now() + '-' + Math.floor(Math.random() * 1e9));
}

/* Local cache: instant paint on open; the cloud is the source of truth. */
function loadCache() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data || !Array.isArray(data.tasks)) return false;
    state.tasks = data.tasks;
    state.tasks.forEach(t => {
      if (!Array.isArray(t.steps)) t.steps = [];
      if (t.parentId === undefined) t.parentId = null;
    });
    state.projects = Array.isArray(data.projects) ? data.projects : [];
    state.areas = Array.isArray(data.areas) ? data.areas : [];
    sortAreas();
    state.settings = Object.assign(defaultSettings(), data.settings || {});
    return true;
  } catch (e) { return false; }
}
function saveCache() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ v: 1, tasks: state.tasks, projects: state.projects, areas: state.areas, settings: state.settings }));
  } catch (e) { /* cache only; cloud still saves */ }
}

let saveTimer = null;
let dirtyRev = 0, syncedRev = 0;   // local changes made, and the last of them known to be saved in the cloud
function save() {
  dirtyRev++;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    saveCache();
    scheduleSync();
  }, 150);
}

/* ================= Cloud sync engine =================
   Diff-based: after any change, rows that differ from the last-pushed
   snapshot are upserted, missing ones deleted. Failed pushes stay dirty
   and retry, so brief offline periods heal themselves. */

const baseline = { tasks: {}, projects: {}, areas: {}, settings: null };

const taskToRow = (t) => ({ id: t.id, title: t.title, notes: t.notes || '', project_id: t.projectId || null, area_id: t.areaId || null, parent_id: t.parentId || null, due: t.due || null, quadrant: t.quadrant || null, priority: t.priority || null, status: t.status || 'todo', focus: !!t.focus, steps: t.steps || [], sort_order: t.sortOrder || 0, created_at: t.createdAt || 0, completed_at: t.completedAt || null, waiting_on: t.waitingOn || null, follow_up: t.followUp || null, image_path: t.imagePath || null, image_thumb: t.imageThumb || null });
const rowToTask = (r) => ({ id: r.id, title: r.title, notes: r.notes || '', projectId: r.project_id || null, areaId: r.area_id || null, parentId: r.parent_id || null, due: r.due || null, quadrant: r.quadrant || null, priority: r.priority || null, status: r.status || 'todo', focus: !!r.focus, steps: Array.isArray(r.steps) ? r.steps : [], sortOrder: Number(r.sort_order) || 0, createdAt: Number(r.created_at) || 0, completedAt: r.completed_at === null ? null : Number(r.completed_at), updatedAt: r.updated_at || null, waitingOn: r.waiting_on || null, followUp: r.follow_up || null, imagePath: r.image_path || null, imageThumb: r.image_thumb || null, currentStatus: r.current_status || null, statusAt: r.status_at || null });
/* currentStatus and statusAt are deliberately not in taskToRow. The database refreshes them whenever an update
   is logged on a task, so the app only reads them here and writes them on their own (pushStatusLine). That way a
   stale copy on one device can never overwrite a newer status line. */
const projToRow = (p) => ({ id: p.id, name: p.name, colour: p.colour, area_id: p.areaId || null });
const rowToProj = (r) => ({ id: r.id, name: r.name, colour: r.colour, areaId: r.area_id || null });
const areaToRow = (a) => ({ id: a.id, name: a.name, colour: a.colour, position: a.position || 0, bg: a.bg || '', stream: a.stream || null, internal: !!a.internal });
const rowToArea = (r) => ({ id: r.id, name: r.name, colour: r.colour, position: r.position || 0, bg: r.bg || '', stream: r.stream || null, internal: !!r.internal });
function sortAreas() { state.areas.sort((a, b) => (a.position || 0) - (b.position || 0)); }

/* Group backdrops: token stored in area.bg */
const BG_PRESETS = {
  g1: ['Forest', 'linear-gradient(160deg,#1E5B4A26,#3E5F8A1F)'],
  g2: ['Terracotta', 'linear-gradient(160deg,#B5443026,#A1720E1F)'],
  g3: ['Harvest', 'linear-gradient(160deg,#A1720E26,#1E5B4A1A)'],
  g4: ['Slate', 'linear-gradient(160deg,#3E5F8A26,#66716B1F)'],
  g5: ['Plum', 'linear-gradient(160deg,#7A4E8A26,#B544301A)'],
  g6: ['Sea', 'linear-gradient(160deg,#2E6E8E26,#1E5B4A1F)'],
  g7: ['Sand', 'linear-gradient(160deg,#A9803D26,#B5443014)'],
  g8: ['Moss', 'linear-gradient(160deg,#4E7A5626,#A1720E1A)'],
};
function resolveAreaBg(area) {
  if (!area || !area.bg) return '';
  const v = area.bg;
  if (v === 'wash') return 'linear-gradient(' + area.colour + '2E,' + area.colour + '1A)';
  if (BG_PRESETS[v]) return BG_PRESETS[v][1];
  if (/^#[0-9a-fA-F]{6}$/.test(v)) return 'linear-gradient(' + v + '2E,' + v + '1A)';
  if (v.startsWith('url:')) {
    const u = v.slice(4).replace(/["'()\\\s]/g, '');
    if (/^https?:\/\//.test(u)) {
      return 'linear-gradient(color-mix(in srgb, var(--bg) 78%, transparent), color-mix(in srgb, var(--bg) 86%, transparent)), url("' + u + '") center/cover no-repeat';
    }
  }
  return '';
}
function activeAreaForBg() {
  if (ui.filterArea) return areaOf(ui.filterArea);
  if (ui.filterProject) {
    const p = state.projects.find(p => p.id === ui.filterProject);
    if (p && p.areaId) return areaOf(p.areaId);
  }
  return null;
}

function snapshotBaseline() {
  baseline.tasks = {}; baseline.projects = {}; baseline.areas = {};
  state.tasks.forEach(t => { baseline.tasks[t.id] = JSON.stringify(taskToRow(t)); });
  state.projects.forEach(p => { baseline.projects[p.id] = JSON.stringify(projToRow(p)); });
  state.areas.forEach(a => { baseline.areas[a.id] = JSON.stringify(areaToRow(a)); });
  baseline.settings = JSON.stringify(state.settings);
}

let syncTimer = null, syncInFlight = false, syncFailedOnce = false;
function scheduleSync(delay) {
  clearTimeout(syncTimer);
  syncTimer = setTimeout(runSync, delay || 350);
}

async function runSync() {
  if (!sb || !sbUser) return;
  if (syncInFlight) { scheduleSync(500); return; }
  syncInFlight = true;
  const rev = dirtyRev;
  try {
    const kinds = [
      ['tasks', state.tasks, taskToRow],
      ['projects', state.projects, projToRow],
      ['areas', state.areas, areaToRow],
    ];
    for (const [table, list, toRow] of kinds) {
      const seen = new Set();
      const upserts = [];
      for (const item of list) {
        seen.add(item.id);
        const row = toRow(item);
        const js = JSON.stringify(row);
        if (baseline[table][item.id] !== js) upserts.push([item.id, row, js]);
      }
      const deletions = Object.keys(baseline[table]).filter(id => !seen.has(id));
      if (upserts.length) {
        const { error } = await sb.from(table).upsert(upserts.map(u => u[1]));
        if (error) throw error;
        upserts.forEach(u => { baseline[table][u[0]] = u[2]; });
        if (table === 'tasks') { const nowIso = new Date().toISOString(); upserts.forEach(u => { const cur = getTask(u[0]); if (cur) cur.updatedAt = nowIso; }); }
      }
      if (deletions.length) {
        const { error } = await sb.from(table).delete().in('id', deletions);
        if (error) throw error;
        deletions.forEach(id => { delete baseline[table][id]; });
      }
    }
    const sjs = JSON.stringify(state.settings);
    if (baseline.settings !== sjs) {
      const { error } = await sb.from('settings').upsert({ user_id: sbUser.id, data: state.settings });
      if (error) throw error;
      baseline.settings = sjs;
    }
    syncedRev = rev;
    if (syncFailedOnce) { syncFailedOnce = false; toast('Back online. Everything saved.'); }
    setSyncIndicator(true);
  } catch (e) {
    if (!syncFailedOnce) { syncFailedOnce = true; toast('Cannot reach the cloud. Your changes are kept here and will save when the connection returns.'); }
    setSyncIndicator(false);
    scheduleSync(6000);
  } finally {
    syncInFlight = false;
  }
}

function setSyncIndicator(ok) {
  const el = document.getElementById('syncDot');
  if (el) {
    el.classList.toggle('off', !ok);
    el.title = ok ? 'Synced' : 'Offline: changes waiting to sync';
  }
}

async function fullLoad() {
  const [t, p, a, s] = await Promise.all([
    sb.from('tasks').select('*'),
    sb.from('projects').select('*'),
    sb.from('areas').select('*'),
    sb.from('settings').select('*').maybeSingle(),
  ]);
  if (t.error || p.error || a.error || s.error) {
    toast('Could not load from the cloud; showing this device’s last copy.');
    setSyncIndicator(false);
    return;
  }
  state.tasks = t.data.map(rowToTask);
  state.projects = p.data.map(rowToProj);
  state.areas = a.data.map(rowToArea);
  sortAreas();
  state.settings = Object.assign(defaultSettings(), (s.data && s.data.data) || {});
  snapshotBaseline();
  if (!state.tasks.length && !state.projects.length && !state.areas.length && !s.data) {
    state.areas = seedAreas();
    state.settings = defaultSettings();
    dirtyRev++;
    scheduleSync();
  }
  saveCache();
  setSyncIndicator(true);
}

/* Catch up with changes made elsewhere (another device, the Chief of Staff, an agent) that the
   live feed may have missed while this device slept. Never runs over unsaved local work. */
let softRefreshing = false;
async function softRefresh() {
  if (!sb || !sbUser || softRefreshing || syncInFlight || dirtyRev !== syncedRev) return;
  if (document.querySelector('.sheet') || mapView.inputActive || dragId) return;
  softRefreshing = true;
  const rev = dirtyRev;
  try {
    const [t, p, a, s] = await Promise.all([
      sb.from('tasks').select('*'),
      sb.from('projects').select('*'),
      sb.from('areas').select('*'),
      sb.from('settings').select('*').maybeSingle(),
    ]);
    if (t.error || p.error || a.error || s.error) return;
    if (rev !== dirtyRev || syncInFlight || document.querySelector('.sheet') || mapView.inputActive || dragId) return;
    state.tasks = t.data.map(rowToTask);
    state.projects = p.data.map(rowToProj);
    state.areas = a.data.map(rowToArea);
    sortAreas();
    if (s.data && s.data.data) state.settings = Object.assign(defaultSettings(), s.data.data);
    snapshotBaseline();
    saveCache();
    setSyncIndicator(true);
    render();
  } catch (e) { /* offline: the next attempt will catch up */ }
  finally { softRefreshing = false; }
}

let rtChannel = null;
function subscribeRealtime() {
  if (rtChannel) { sb.removeChannel(rtChannel); rtChannel = null; }
  const apply = (table, rowToX, listKey) => (payload) => {
    const list = state[listKey];
    if (payload.eventType === 'DELETE') {
      const id = payload.old && payload.old.id;
      if (!id) return;
      if (!(id in baseline[table]) && !list.some(x => x.id === id)) return; // echo of our own delete
      state[listKey] = list.filter(x => x.id !== id);
      delete baseline[table][id];
    } else {
      const item = rowToX(payload.new);
      const js = JSON.stringify(table === 'tasks' ? taskToRow(item) : table === 'projects' ? projToRow(item) : areaToRow(item));
      if (baseline[table][item.id] === js) { // echo of our own write: local state is newer or identical
        if (table === 'tasks') {
          const cur = list.find(x => x.id === item.id);
          if (cur) {
            cur.updatedAt = item.updatedAt;
            if (cur.currentStatus !== item.currentStatus || cur.statusAt !== item.statusAt) {
              cur.currentStatus = item.currentStatus; cur.statusAt = item.statusAt;
              saveCache(); refreshOpenStatus();
            }
          }
        }
        return;
      }
      const i = list.findIndex(x => x.id === item.id);
      if (i === -1) list.unshift(item); else list[i] = item;
      baseline[table][item.id] = js;
    }
    if (table === 'areas') sortAreas();
    saveCache();
    render();
    if (table === 'tasks') refreshOpenStatus();
  };
  rtChannel = sb.channel('sorted-sync')
    .on('postgres_changes', { event: '*', schema: SB_SCHEMA, table: 'tasks', filter: 'user_id=eq.' + sbUser.id }, apply('tasks', rowToTask, 'tasks'))
    .on('postgres_changes', { event: '*', schema: SB_SCHEMA, table: 'projects', filter: 'user_id=eq.' + sbUser.id }, apply('projects', rowToProj, 'projects'))
    .on('postgres_changes', { event: '*', schema: SB_SCHEMA, table: 'areas', filter: 'user_id=eq.' + sbUser.id }, apply('areas', rowToArea, 'areas'))
    .on('postgres_changes', { event: '*', schema: SB_SCHEMA, table: 'settings', filter: 'user_id=eq.' + sbUser.id }, (payload) => {
      if (payload.new && payload.new.data) {
        const incoming = Object.assign(defaultSettings(), payload.new.data);
        if (JSON.stringify(incoming) === baseline.settings) return; // echo of our own write
        state.settings = incoming;
        baseline.settings = JSON.stringify(state.settings);
        saveCache(); render();
      }
    })
    .subscribe();
}

/* ================= Dates ================= */

function todayISO() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function addDaysISO(base, days) {
  const [y, m, dd] = base.split('-').map(Number);
  const d = new Date(y, m - 1, dd + days);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function fmtDue(iso) {
  const t = todayISO();
  if (iso === t) return 'Today';
  if (iso === addDaysISO(t, 1)) return 'Tomorrow';
  if (iso === addDaysISO(t, -1)) return 'Yesterday';
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const opts = { weekday: 'short', day: 'numeric', month: 'short' };
  if (y !== new Date().getFullYear()) opts.year = 'numeric';
  return dt.toLocaleDateString('en-GB', opts);
}
/* The same date for use mid-phrase: "follow up yesterday", not "follow up Yesterday". */
function fmtDueIn(iso) {
  const f = fmtDue(iso);
  return (f === 'Today' || f === 'Tomorrow' || f === 'Yesterday') ? f.toLowerCase() : f;
}
function dueClass(iso) {
  const t = todayISO();
  if (iso < t) return 'overdue';
  if (iso === t) return 'today';
  return '';
}

/* ================= Quick-add parsing ================= */

const DOW = { monday: 1, mon: 1, tuesday: 2, tue: 2, tues: 2, wednesday: 3, wed: 3, thursday: 4, thu: 4, thur: 4, thurs: 4, friday: 5, fri: 5, saturday: 6, sat: 6, sunday: 0, sun: 0 };

function nextDow(target) {
  const now = new Date();
  let diff = (target - now.getDay() + 7) % 7;
  if (diff === 0) diff = 7;
  return addDaysISO(todayISO(), diff);
}

function parseQuickAdd(text) {
  const result = { title: '', due: null, quadrant: null, projectId: null, areaId: null, priority: null };
  let working = text.trim();

  // #Name: match an existing project first, then a group (both allow spaces), else a
  // single word creates a new project (filed under the current group when one is open)
  const hashIdx = working.indexOf('#');
  if (hashIdx !== -1) {
    const after = working.slice(hashIdx + 1);
    let matched = null;
    for (const p of [...state.projects].sort((a, b) => b.name.length - a.name.length)) {
      if (after.toLowerCase().startsWith(p.name.toLowerCase())) {
        const rest = after.slice(p.name.length);
        if (rest === '' || rest[0] === ' ') { matched = p; break; }
      }
    }
    let matchedArea = null;
    if (!matched) {
      for (const a of [...state.areas].sort((x, y) => y.name.length - x.name.length)) {
        if (after.toLowerCase().startsWith(a.name.toLowerCase())) {
          const rest = after.slice(a.name.length);
          if (rest === '' || rest[0] === ' ') { matchedArea = a; break; }
        }
      }
    }
    if (matched) {
      result.projectId = matched.id;
      working = (working.slice(0, hashIdx) + working.slice(hashIdx + 1 + matched.name.length)).trim();
    } else if (matchedArea) {
      result.areaId = matchedArea.id;
      working = (working.slice(0, hashIdx) + working.slice(hashIdx + 1 + matchedArea.name.length)).trim();
    } else {
      const word = after.split(/\s+/)[0];
      if (word) {
        const proj = addProject(word, null, ui.filterArea || null);
        result.projectId = proj.id;
        working = (working.slice(0, hashIdx) + after.slice(word.length)).trim();
      }
    }
  }

  const tokens = working.split(/\s+/).filter(Boolean);
  const keep = [];
  for (let i = 0; i < tokens.length; i++) {
    const tk = tokens[i];
    const low = tk.toLowerCase();
    if (tk === '!!') { result.quadrant = 1; continue; }
    if (tk === '!') { result.quadrant = 2; continue; }
    const pm = tk.match(/^[pP]([1-9])$/);
    if (pm) { result.priority = Number(pm[1]); continue; }
    if (low === 'today' || low === 'tonight') { result.due = todayISO(); continue; }
    if (low === 'tomorrow') { result.due = addDaysISO(todayISO(), 1); continue; }
    if (low === 'next' && tokens[i + 1] && tokens[i + 1].toLowerCase() === 'week') { result.due = addDaysISO(todayISO(), 7); i++; continue; }
    if (Object.prototype.hasOwnProperty.call(DOW, low)) { result.due = nextDow(DOW[low]); continue; }
    const dm = tk.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);
    if (dm) {
      const day = Number(dm[1]), mon = Number(dm[2]);
      if (day >= 1 && day <= 31 && mon >= 1 && mon <= 12) {
        let yr = dm[3] ? Number(dm[3]) : new Date().getFullYear();
        if (yr < 100) yr += 2000;
        let iso = yr + '-' + String(mon).padStart(2, '0') + '-' + String(day).padStart(2, '0');
        if (!dm[3] && iso < todayISO()) iso = (yr + 1) + iso.slice(4);
        result.due = iso;
        continue;
      }
    }
    keep.push(tk);
  }
  result.title = keep.join(' ');
  return result;
}

/* ================= Task ops ================= */

function addProject(name, colour, areaId) {
  const existing = state.projects.find(p => p.name.toLowerCase() === name.toLowerCase());
  if (existing) return existing;
  const colours = ['#4F5BD5', '#E0673A', '#0F8A9D', '#C2418B', '#7C5CE0', '#3F4BC4', '#8A5B3E'];
  const proj = { id: uid(), name: name, colour: colour || colours[state.projects.length % colours.length], areaId: areaId || null };
  state.projects.push(proj);
  save();
  return proj;
}

function addArea(name) {
  const existing = state.areas.find(a => a.name.toLowerCase() === name.toLowerCase());
  if (existing) return existing;
  const colours = ['#4F5BD5', '#E0673A', '#0F8A9D', '#C2418B', '#7C5CE0', '#3F4BC4', '#8A5B3E'];
  const area = { id: uid(), name: name, colour: colours[state.areas.length % colours.length], position: state.areas.length };
  state.areas.push(area);
  save();
  return area;
}

function addTask(fields) {
  const minOrder = state.tasks.length ? Math.min.apply(null, state.tasks.map(t => t.sortOrder || 0)) : 1;
  const t = Object.assign({
    id: uid(), title: '', notes: '', projectId: null, areaId: null, parentId: null, due: null,
    quadrant: null, priority: null, status: 'todo', focus: false, steps: [],
    sortOrder: minOrder - 1, createdAt: Date.now(), completedAt: null,
    waitingOn: null, followUp: null, currentStatus: null, statusAt: null,
  }, fields);
  if (!t.title.trim()) return null;
  state.tasks.unshift(t);
  save();
  return t;
}

function getTask(id) { return state.tasks.find(t => t.id === id); }

function toggleDone(id) {
  const t = getTask(id);
  if (!t) return;
  if (t.status === 'done') {
    t.status = 'todo'; t.completedAt = null;
  } else {
    t.status = 'done'; t.completedAt = Date.now();
    toast('Completed. It is in the Archive with its history.', { label: 'Undo', fn: () => { const x = getTask(id); if (x && x.status === 'done') toggleDone(id); } });
  }
  save(); render();
}

function toggleFocus(id) {
  const t = getTask(id);
  if (!t) return;
  t.focus = !t.focus;
  save(); render();
}

function deleteTask(id) {
  const gone = getTask(id);
  if (gone) dropStoredImages([gone.imagePath]);
  state.tasks = state.tasks.filter(t => t.id !== id);
  // Children of a deleted task become top-level rather than disappearing
  state.tasks.forEach(t => { if (t.parentId === id) t.parentId = null; });
  save(); render();
}

function childTasksOf(id) {
  return state.tasks.filter(t => t.parentId === id);
}

function isDescendantTask(candidateId, ancestorId) {
  let t = getTask(candidateId);
  let guard = 0;
  while (t && t.parentId && guard++ < 100) {
    if (t.parentId === ancestorId) return true;
    t = getTask(t.parentId);
  }
  return false;
}

function projectOf(t) { return state.projects.find(p => p.id === t.projectId) || null; }
function areaOf(id) { return state.areas.find(a => a.id === id) || null; }
function taskAreaId(t) {
  const p = projectOf(t);
  const id = p ? p.areaId : t.areaId;
  return id && areaOf(id) ? id : null;   // a group that no longer exists counts as no group
}

/* Waiting on someone: the board status, or a name in the optional "Waiting on" field. */
function isWaiting(t) { return t.status !== 'done' && (t.status === 'waiting' || !!t.waitingOn); }
function chaseDue(t) { return isWaiting(t) && !!t.followUp && t.followUp <= todayISO(); }
/* Steps can carry their own optional due date. */
function nextStepDue(t) {
  let best = null;
  (t.steps || []).forEach(s => { if (!s.done && s.due && (!best || s.due < best.due)) best = s; });
  return best;
}
/* The earliest date anything on the task falls due: the task itself or one of its open steps. */
function effDue(t) {
  const s = nextStepDue(t);
  if (s && (!t.due || s.due < t.due)) return s.due;
  return t.due || null;
}
function sortByEffDue(a, b) {
  const da = effDue(a), db = effDue(b);
  if (da && db && da !== db) return da < db ? -1 : 1;
  if (da && !db) return -1;
  if (!da && db) return 1;
  return a.createdAt - b.createdAt;
}

/* ---------- One optional image per task ----------
   The picture is shrunk in the browser and kept in a private storage bucket, in a folder only
   this user can reach. A tiny square preview travels with the task itself (imageThumb), so the
   Action plan card and the task sheet can show something at once. Most tasks have no image. */
const IMG_BUCKET = 'sorted-task-images';
const imgUrlCache = new Map();   // storage path -> address of the downloaded picture, for this visit
const ICON_IMG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="m4 18 5.5-5 4 3.5 3-2.5L21 18"></path></svg>';
/* The preview is drawn straight into the page, so it must be exactly a small picture and nothing else. */
function safeThumb(v) {
  return typeof v === 'string' && v.length < 40000 && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(v) ? v : null;
}
function thumbImg(t, cls) {
  const src = safeThumb(t.imageThumb);
  return src ? '<img class="' + cls + '" src="' + src + '" alt="">' : '';
}
async function taskImageUrl(path) {
  if (!path || !sb) return null;
  if (imgUrlCache.has(path)) return imgUrlCache.get(path);
  const { data, error } = await sb.storage.from(IMG_BUCKET).download(path);
  if (error || !data) return null;
  const url = URL.createObjectURL(data);
  imgUrlCache.set(path, url);
  return url;
}
/* Shrink a chosen picture to at most 1600 pixels a side, and make the 96 pixel square preview. */
async function prepareImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('unreadable')); i.src = url; });
    const w = img.naturalWidth, h = img.naturalHeight;
    if (!w || !h) throw new Error('unreadable');
    const scale = Math.min(1, 1600 / Math.max(w, h));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * scale)); c.height = Math.max(1, Math.round(h * scale));
    const g = c.getContext('2d');
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height);   // a see-through background would turn black as a JPEG
    g.drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.82));
    const side = Math.min(w, h);
    const t = document.createElement('canvas');
    t.width = 96; t.height = 96;
    const tg = t.getContext('2d');
    tg.fillStyle = '#ffffff'; tg.fillRect(0, 0, 96, 96);
    tg.drawImage(img, (w - side) / 2, (h - side) / 2, side, side, 0, 0, 96, 96);
    return { blob, thumb: t.toDataURL('image/jpeg', 0.7) };
  } finally { URL.revokeObjectURL(url); }
}
/* Like "Add update", a picture takes effect straight away rather than waiting for Save. */
async function setTaskImage(id, file) {
  if (!getTask(id) || !file || !sb || !sbUser) return false;
  if (!/^image\//.test(file.type || '')) { toast('Choose a picture: a photo, a scan or a screenshot'); return false; }
  let made = null;
  try { made = await prepareImage(file); } catch (e) { made = null; }
  if (!made || !made.blob) { toast('That file could not be read as a picture'); return false; }
  const path = sbUser.id + '/' + id + '-' + Date.now() + '.jpg';
  const up = await sb.storage.from(IMG_BUCKET).upload(path, made.blob, { contentType: 'image/jpeg', upsert: false });
  if (up.error) { toast('Could not upload the picture: ' + up.error.message); return false; }
  const cur = getTask(id);
  if (!cur) { dropStoredImages([path]); return false; }
  const old = cur.imagePath;
  cur.imagePath = path; cur.imageThumb = made.thumb;
  imgUrlCache.set(path, URL.createObjectURL(made.blob));
  save(); render();
  dropStoredImages([old]);
  toast('Picture added to this task');

}
function removeTaskImage(id) {
  const t = getTask(id);

/* Best effort: a file left behind harms nothing, so a failure here is not worth interrupting anyone for. */
function dropStoredImages(paths) {
  const list = (paths || []).filter(Boolean);
  if (!list.length || !sb) return;
  list.forEach(p => imgUrlCache.delete(p));

}

/* The status line is saved on its own, never as part of the whole task (see rowToTask). */
function setStatusLine(id, text) {

  if (!baseline.tasks[id]) { if (tries < 40) setTimeout(() => pushStatusLine(id, tries + 1), 500); return; }

/* A group marked internal holds the Chief of Staff's own tasks. They stay out of every view of
   Ifran's work and show only when that group (or a project in it) is the one opened. */
function isInternalTask(t) { const a = areaOf(taskAreaId(t)); return !!(a && a.internal); }
function myTasks() { return state.areas.some(a => a.internal) ? state.tasks.filter(t => !isInternalTask(t)) : state.tasks; }

function visibleTasks() {
  let list = state.tasks;
  if (ui.filterProject) list = list.filter(t => t.projectId === ui.filterProject);
  else if (ui.filterArea) list = list.filter(t => taskAreaId(t) === ui.filterArea);
  else list = myTasks();
  if (ui.search.trim()) {
    const q = ui.search.trim().toLowerCase();
    const has = (v) => (v || '').toLowerCase().includes(q);
    list = list.filter(t => has(t.title) || has(t.notes) || has(t.waitingOn) || has(t.currentStatus));
  }
  return list;
}
function openTasks() { return visibleTasks().filter(t => t.status !== 'done'); }
function doneTasks() { return visibleTasks().filter(t => t.status === 'done').sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0)); }

function sortByDue(a, b) {
  if (a.due && b.due && a.due !== b.due) return a.due < b.due ? -1 : 1;
  if (a.due && !b.due) return -1;
  if (!a.due && b.due) return 1;
  return a.createdAt - b.createdAt;
}
function sortByAdded(a, b) { return b.createdAt - a.createdAt; }
function sortByManual(a, b) { return (a.sortOrder || 0) - (b.sortOrder || 0); }
function listSort() { return ui.sortBy === 'added' ? sortByAdded : ui.sortBy === 'manual' ? sortByManual : sortByDue; }

function moveTaskRelative(movedId, targetId, before) {
  const moved = getTask(movedId);
  const target = getTask(targetId);
  if (!moved || !target || moved.id === target.id) return;
  const ordered = state.tasks.filter(t => t.id !== movedId).sort(sortByManual);
  let idx = ordered.findIndex(t => t.id === targetId);
  if (idx === -1) return;
  if (!before) idx += 1;
  const prev = idx > 0 ? (ordered[idx - 1].sortOrder || 0) : null;
  const next = idx < ordered.length ? (ordered[idx].sortOrder || 0) : null;
  let val;
  if (prev === null && next === null) val = 0;
  else if (prev === null) val = next - 1;
  else if (next === null) val = prev + 1;
  else val = (prev + next) / 2;
  if ((prev !== null && val === prev) || (next !== null && val === next)) {
    // No numeric room left between neighbours: renumber everything cleanly
    ordered.splice(idx, 0, moved);
    ordered.forEach((t, i) => { t.sortOrder = i + 1; });
  } else {
    moved.sortOrder = val;
  }
  save(); render();
}
