<html lang="en-GB">
<head>

<title>Command Centre</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root {
  color-scheme: light;
  --bg: #F3F4F7;
  --panel: #FFFFFF;
  --line: #E5E7EC;
  --line-soft: #F0F1F4;
  --line-softer: #EEF0F3;
  --sub: #FAFAFB;
  --track: #F0F1F4;
  --ink: #111318;
  --ink-2: #23262E;
  --ink-3: #3A3F4B;
  --muted: #5C6270;
  --decor: #9AA0AC;
  --link: #3F4BC4;
  --link-hover: #2C368F;
  --cos-bg: #F6F4FF;
  --cos-ink: #4A3A9E;
  --run-bg: #E7EEFF; --run-fg: #1D4BB8; --run-dot: #2563EB; --run-line: #C9D8FF;
  --need-bg: #FFF1DB; --need-fg: #8A4B00; --need-dot: #E39A2B; --need-line: #F5D9A8;
  --stuck-bg: #FDECEA; --stuck-fg: #A6211A; --stuck-dot: #D9483B; --stuck-line: #F5C4BE;
  --idle-bg: #F0F1F4; --idle-fg: #4A4F5C; --idle-dot: #9AA0AC; --idle-line: #E5E7EC;
  --quiet-bg: #FFF4E0; --quiet-fg: #7A4300;
  --font: 'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
a { color: var(--link); text-decoration: none; }
a:hover { color: var(--link-hover); text-decoration: underline; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, p { margin: 0; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- Top bar ---------- */
.topbar { background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.topbar-in { padding: 10px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.brand { display: flex; align-items: center; gap: 8px; color: var(--ink); font-weight: 600; font-size: 15px; }
.brand:hover { color: var(--ink); text-decoration: none; }
.brand-mark { width: 26px; height: 26px; border-radius: 8px; background: var(--ink); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.mainnav { display: flex; flex-wrap: wrap; gap: 2px; flex: 1 1 300px; }
.mainnav a { padding: 8px 12px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--muted); }
.mainnav a:hover { background: var(--line-soft); color: var(--ink); text-decoration: none; }
.mainnav a[aria-current="page"] { background: var(--ink); color: #FFFFFF; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 500; }
.pill:hover { text-decoration: none; filter: brightness(0.97); }
.pill b { font-weight: 700; }
.s-run { background: var(--run-bg); color: var(--run-fg); }
.s-need { background: var(--need-bg); color: var(--need-fg); }
.s-stuck { background: var(--stuck-bg); color: var(--stuck-fg); }
.s-idle { background: var(--idle-bg); color: var(--idle-fg); }
.topdate { font-size: 12px; color: var(--muted); }
.toplink { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; font-weight: 600; color: var(--ink); }
.toplink:hover { background: var(--line-soft); color: var(--ink); text-decoration: none; }

/* ---------- Shared panels ---------- */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; }
.panel-pad { padding: 14px 16px; }
.panel-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-bottom: 6px; }
.panel-head h2 { font-size: 15px; font-weight: 600; flex: 1 1 auto; }
.btn { height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); font-size: 12px; font-weight: 500; color: var(--ink-3); }
.btn:hover { background: var(--sub); }
.btn-dark { border: 0; background: var(--ink); color: #FFFFFF; }
.btn-dark:hover { background: #2A2D35; }
.seg { display: flex; gap: 2px; padding: 2px; border-radius: 8px; background: var(--track); }
.seg button { height: 28px; padding: 0 10px; border-radius: 6px; border: 0; background: transparent; font-size: 12px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(17,19,24,0.12); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
.empty { color: var(--muted); font-size: 13px; line-height: 1.5; padding: 10px 2px; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.badge .bd { width: 6px; height: 6px; border-radius: 50%; }
.steps { display: flex; gap: 3px; }
.steps span { flex: 1 1 0; height: 5px; border-radius: 3px; background: #E6E8ED; }
.chev { transition: transform .15s ease; flex: 0 0 auto; }
[aria-expanded="true"] > .chev { transform: rotate(90deg); }

/* ---------- Home layout (design J) ---------- */
.home { display: flex; align-items: stretch; min-height: calc(100vh - 51px); }
.cos { flex: 0 0 20%; min-width: 250px; max-width: 320px; background: var(--panel); border-right: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 14px; position: sticky; top: 51px; height: calc(100vh - 51px); overflow-y: auto; }
.cos-head { display: flex; align-items: center; gap: 10px; }
.cos-av { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #4F5BD5, #7C5CE0); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; flex: 0 0 auto; border: 0; }
.cos-title { display: flex; flex-direction: column; gap: 1px; flex: 1 1 auto; min-width: 0; }
.cos-title b { font-size: 14px; font-weight: 600; }
.cos-title span { font-size: 11px; color: var(--muted); }
.iconbtn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.iconbtn:hover { background: var(--sub); }
.cos-body { display: flex; flex-direction: column; gap: 14px; flex: 1 1 auto; }
.cos-part h3 { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.cos-part p { font-size: 13px; line-height: 1.55; color: var(--ink-2); white-space: pre-line; }
.decision { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 12px; background: var(--cos-bg); }
.decision h3 { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--cos-ink); }
.decision p { font-size: 13px; line-height: 1.55; color: var(--ink-2); }
.decision .opts { display: flex; flex-wrap: wrap; gap: 6px; }
.decision .opts button { height: 34px; padding: 0 12px; border-radius: 8px; font-size: 12px; font-weight: 500; }
.opt-1 { border: 0; background: var(--ink); color: #FFFFFF; }
.opt-n { border: 1px solid var(--line); background: var(--panel); color: var(--ink-3); }
.decided { font-size: 12px; color: var(--muted); }
.sysnote { font-size: 12px; line-height: 1.5; color: var(--muted); padding-top: 10px; border-top: 1px solid var(--line-soft); }
.msgform { display: flex; gap: 6px; align-items: center; }
.msgform input { flex: 1 1 auto; min-width: 0; height: 40px; border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; font: inherit; font-size: 13px; background: var(--sub); color: var(--ink); }
.msgform input::placeholder { color: #6B7180; }
.sqbtn { width: 40px; height: 40px; border-radius: 10px; border: 0; background: var(--ink); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.sqbtn.ghost { background: var(--panel); border: 1px solid var(--line); }
.sqbtn[aria-pressed="true"] { background: var(--stuck-dot); }
.cos-closed { flex: 0 0 64px; background: var(--panel); border-right: 1px solid var(--line); padding: 16px 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.cos-closed .cos-av { width: 40px; height: 40px; cursor: pointer; }
.newdot { width: 8px; height: 8px; border-radius: 50%; background: var(--need-dot); }
.cos-closed .lbl { display: none; }
.home-main { flex: 1 1 auto; min-width: 0; padding: 16px 20px 28px; display: flex; flex-direction: column; gap: 14px; }

.plan-head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line-soft); }
.plan-head .t { display: flex; flex-direction: column; gap: 1px; flex: 1 1 260px; }
.plan-head h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.plan-head .t span { font-size: 12px; color: var(--muted); }
.plan-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.plan-col { padding: 14px 16px; border-right: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 10px; }
.plan-col:last-child { border-right: 0; }
.plan-name { display: flex; flex-direction: column; gap: 3px; color: var(--ink); }
.plan-name:hover { color: var(--ink); text-decoration: none; }
.plan-name:hover b { text-decoration: underline; }
.plan-name b { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600; }
.plan-name span { font-size: 11px; color: var(--muted); }
.plan-item { display: flex; gap: 8px; align-items: flex-start; padding: 7px 8px; border-radius: 8px; }
.plan-item .p { font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 4px; background: var(--panel); flex: 0 0 auto; margin-top: 1px; }
.plan-item .x { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.plan-item .x b { font-size: 12px; line-height: 1.4; font-weight: 500; overflow-wrap: anywhere; }
.plan-item .x span { font-size: 11px; }
.more { font-size: 12px; font-weight: 500; padding: 2px; }

.row2 { display: flex; flex-wrap: wrap; gap: 14px; align-items: stretch; }
.fleet { flex: 3 1 460px; display: flex; flex-direction: column; gap: 4px; }
.timebox { flex: 2 1 340px; display: flex; flex-direction: column; gap: 12px; }
.fgroup { border-top: 1px solid var(--line-soft); }
.ghead { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 9px 2px; border-radius: 10px; }
.gtoggle { border: 0; background: transparent; padding: 0; display: flex; align-items: center; }
.gtoggle::after { content: ""; position: absolute; inset: 0; border-radius: 10px; }
.gtoggle:focus-visible { outline: none; }
.gtoggle:focus-visible::after { outline: 2px solid var(--link); outline-offset: -2px; }
.ghead:hover { background: rgba(17,19,24,0.025); }
.ghead .nm { position: relative; z-index: 1; font-size: 14px; font-weight: 600; color: var(--ink); }
.ghead a.nm:hover { color: var(--ink); text-decoration: underline; }
.gpills { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px; }
.fjobs { display: flex; flex-direction: column; gap: 6px; padding: 0 0 10px 22px; }
.fjob { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 10px; background: var(--sub); }
.fjob .in { font-size: 11px; font-weight: 600; color: var(--ink-3); width: 26px; flex: 0 0 auto; }
.fjob .jt { font-size: 13px; flex: 1 1 200px; min-width: 0; overflow-wrap: anywhere; }
.fjob .steps { flex: 0 0 80px; }
.fjob .badge { min-width: 72px; justify-content: center; }

.trow { display: grid; grid-template-columns: 100px minmax(0, 1fr) 54px; gap: 10px; align-items: center; }
.trow .nm { font-size: 12px; font-weight: 500; }
.tbar { display: flex; height: 10px; gap: 2px; border-radius: 5px; overflow: hidden; background: var(--track); }
.tbar span { height: 100%; }
.trow .hrs { font-family: var(--mono); font-size: 11px; color: var(--muted); text-align: right; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; }
.legend span, .legend a { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
.legend a:hover { color: var(--ink); }
.tlink { color: inherit; }
.tlink:hover { color: inherit; text-decoration: underline; }
.arow .biz a { display: flex; align-items: center; gap: 6px; color: var(--ink-3); }
.arow .biz a:hover { color: var(--ink); }
.legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

.acts { overflow-x: auto; }
.acts-in { min-width: 640px; display: flex; flex-direction: column; }
.arow { display: grid; grid-template-columns: 64px 130px 130px minmax(0, 1fr) 70px; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line-soft); align-items: center; }
.arow .w { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.arow .who { font-size: 12px; font-weight: 600; overflow-wrap: anywhere; }
.arow .biz { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); }
.arow .what { font-size: 13px; line-height: 1.4; overflow-wrap: anywhere; }
.arow .what .tag { color: var(--cos-ink); font-weight: 600; }
.arow .took { font-family: var(--mono); font-size: 12px; text-align: right; }
.showmore { margin-top: 8px; align-self: flex-start; }

.house { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 10px 12px; align-items: center; padding: 12px 16px; }
.house .lbl { font-size: 12px; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 4px 9px; border-radius: 999px; max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip:hover { text-decoration: none; filter: brightness(0.97); }
.chip-quiet { background: var(--quiet-bg); color: var(--quiet-fg); }
.chip-wait { background: var(--track); color: var(--ink-3); }

/* ---------- Wide pages (designs E and F) ---------- */
.wrap { max-width: 1280px; margin: 0 auto; padding: 28px 40px 72px; }
.page-title { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }

/* Stream page */
.stream-page { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
.rail { flex: 1 1 220px; max-width: 280px; display: flex; flex-direction: column; gap: 8px; position: sticky; top: 72px; }
.rail .cap { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 0 4px 6px; }
.rail a { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-radius: 16px; border: 1px solid transparent; color: var(--ink); }
.rail a:hover { background: rgba(255,255,255,0.6); text-decoration: none; }
.rail a[aria-current="page"] { background: var(--panel); border-color: var(--line); }
.rail a .nm { font-size: 14px; font-weight: 600; flex: 1 1 auto; }
.rail a .ct { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.stream-main { flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.card-xl { background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 28px; display: flex; flex-direction: column; gap: 20px; }
.card-lg { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 22px; display: flex; flex-direction: column; gap: 10px; }
.card-lg h2 { font-size: 17px; font-weight: 600; }
.card-lg .sub { font-size: 13px; color: var(--muted); }
.shead { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
.stile { width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.stile i { width: 14px; height: 14px; border-radius: 50%; display: block; }
.shead h1 { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; }
.shead .t { display: flex; flex-direction: column; gap: 2px; flex: 1 1 auto; }
.shead .t span { font-size: 14px; color: var(--muted); }
.note { background: var(--cos-bg); border-radius: 18px; padding: 18px 20px; display: flex; gap: 14px; align-items: flex-start; }
.note .cos-av { width: 36px; height: 36px; font-size: 12px; }
.note .x { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.note .x b { font-size: 13px; font-weight: 600; color: var(--cos-ink); }
.note .x p { font-size: 15px; line-height: 1.6; color: var(--ink-2); white-space: pre-line; }
.note .x .when { font-size: 12px; color: var(--muted); }
.stats { display: flex; flex-wrap: wrap; gap: 12px; }
.stat { flex: 1 1 150px; border: 1px solid var(--line-softer); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.stat span { font-size: 13px; color: var(--muted); }
.stat b { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
.cols2 { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
.cols2 > .lcol { flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.cols2 > .rcol { flex: 1 1 320px; min-width: 0; }
.titem { display: flex; gap: 12px; padding: 14px; border-radius: 14px; background: var(--sub); border: 1px solid var(--line-softer); align-items: flex-start; }
.titem .dot { width: 8px; height: 8px; margin-top: 7px; }
.titem .x { display: flex; flex-direction: column; gap: 4px; flex: 1 1 auto; min-width: 0; }
.titem .x b { font-size: 15px; font-weight: 500; overflow-wrap: anywhere; }
.titem .x span { font-size: 13px; color: var(--muted); }
.tag { font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 999px; flex: 0 0 auto; white-space: nowrap; }
.jcard { display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 16px; border: 1px solid var(--line); }
.jcard .top { display: flex; align-items: center; gap: 10px; }
.jcard .in { width: 36px; height: 36px; border-radius: 12px; background: var(--track); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--ink-3); flex: 0 0 auto; }
.jcard .an { font-size: 14px; font-weight: 600; flex: 1 1 auto; min-width: 0; }
.jcard .jt { font-size: 14px; color: var(--ink-3); overflow-wrap: anywhere; }
.jcard .steps span { height: 6px; }
.jcard .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
.parked { display: flex; flex-wrap: wrap; gap: 10px; }
.pchip { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 6px 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--sub); max-width: 100%; }
.pchip .tt { font-size: 14px; overflow-wrap: anywhere; }
.pchip .np { font-size: 11px; font-weight: 500; color: var(--need-fg); background: var(--need-bg); padding: 2px 7px; border-radius: 999px; }
.pchip button { height: 32px; padding: 0 12px; border-radius: 999px; border: 0; background: var(--panel); box-shadow: 0 0 0 1px var(--line); font-size: 12px; font-weight: 500; color: var(--ink-3); }
.pchip button:hover { background: var(--line-soft); }
.pchip button.pri { background: var(--ink); color: #FFFFFF; box-shadow: none; }
.srow { display: flex; gap: 14px; padding: 10px 0; border-top: 1px solid var(--line-soft); align-items: baseline; }
.srow .w { font-family: var(--mono); font-size: 12px; color: var(--muted); width: 62px; flex: 0 0 auto; }
.srow .x { font-size: 14px; line-height: 1.4; overflow-wrap: anywhere; }
.srow .x b { font-weight: 600; }
.srow .took { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--muted); flex: 0 0 auto; }

/* Agents page */
.agents-top { display: flex; flex-wrap: wrap; gap: 24px; align-items: stretch; }
.cos-dark { flex: 3 1 520px; background: var(--ink); color: #FFFFFF; border-radius: 24px; padding: 28px; display: flex; flex-direction: column; gap: 18px; }
.cos-dark .hd { display: flex; align-items: center; gap: 14px; }
.cos-dark .cos-av { width: 52px; height: 52px; font-size: 15px; background: linear-gradient(135deg, #6E79F0, #A68BFF); }
.cos-dark .hd .t { display: flex; flex-direction: column; gap: 3px; flex: 1 1 auto; }
.cos-dark .hd .t b { font-size: 18px; font-weight: 600; }
.cos-dark .hd .t span { font-size: 13px; color: #B4B9C6; }
.cos-dark p { font-size: 17px; line-height: 1.6; color: #E6E8EE; white-space: pre-line; }

<script>
'use strict';

/* ================= Config ================= */
const SB_URL = 'https://fyicijyujhjevlrqlqnq.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ5aWNpanl1amhqZXZscnFscW5xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3ODUwMzgsImV4cCI6MjA5NzM2MTAzOH0.46Ls3IunRF21IM0y6Fyku_hroJxz2H1TBL8J3bKnorU';
const SB_SCHEMA = 'sorted';
const QUIET_DAYS = 30;
const ACTIVITY_PAGE = 40;

/* Per-business palette from the agreed designs; colour itself comes from sorted.streams. */
const PALETTE = {
  property: { soft: '#F1F2FD', tint: '#ECEEFC', ink: '#2E389E' },
  china:    { soft: '#FEF3EE', tint: '#FDEEE7', ink: '#9A3A14' },

  ai:       { soft: '#F5F2FD', tint: '#F0ECFC', ink: '#5236B0' },
};
const NONE_COLOUR = '#9AA0AC';
const STATUS = {
  'Running':   { key: 'run',   rank: 2, label: 'Running',   lower: 'running',  out: 'Comes back as' },
  'Needs you': { key: 'need',  rank: 1, label: 'Needs you', lower: 'need you', out: 'Waiting on you' },
  'Stuck':     { key: 'stuck', rank: 0, label: 'Stuck',     lower: 'stuck',    out: 'Blocked on' },
  'Idle':      { key: 'idle',  rank: 3, label: 'Idle',      lower: 'idle',     out: 'Could take on' },
};
const STATUS_ORDER = ['Running', 'Needs you', 'Stuck', 'Idle'];
const DOT = { run: '#2563EB', need: '#E39A2B', stuck: '#D9483B', idle: '#9AA0AC' };

/* ================= State ================= */
let sb = null;
let user = null;
let rtChannel = null;
let loadError = null;
let loaded = false;
const D = { streams: [], areas: [], projects: [], tasks: [], jobs: [], activity: [], briefs: [] };
const IX = { stream: {}, area: {}, project: {}, task: {} };

function store(key, val) { try { localStorage.setItem('cc.' + key, JSON.stringify(val)); } catch (e) {} }
function recall(key, dflt) { try { const v = localStorage.getItem('cc.' + key); return v === null ? dflt : JSON.parse(v); } catch (e) { return dflt; } }

const UI = {
  cosOpen: recall('cosOpen', true),
  planOpen: recall('planOpen', true),
  homePeriod: 'Week',
  agentsPeriod: 'Week',
  actFilter: 'All',
  actShown: ACTIVITY_PAGE,
  fleetOpen: null,
  agentsOpen: null,
  makeLive: null,
  msgDraft: '',
  listening: false,
};

/* ================= Helpers ================= */
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function safeUrl(u) {
  if (!u) return null;
  try { const x = new URL(String(u)); return (x.protocol === 'https:' || x.protocol === 'http:') ? x.href : null; } catch (e) { return null; }
}
function mixHex(hex, withHex, t) {
  const p = (h) => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const a = p(hex), b = p(withHex);
  return '#' + a.map((v, i) => Math.round(v + (b[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
function look(streamId) {
  const s = IX.stream[streamId];
  if (!s) return { name: 'All businesses', colour: NONE_COLOUR, soft: '#F4F5F7', tint: '#F0F1F4', ink: '#3A3F4B' };
  const pal = PALETTE[s.id] || { soft: mixHex(s.colour, '#FFFFFF', 0.92), tint: mixHex(s.colour, '#FFFFFF', 0.88), ink: mixHex(s.colour, '#000000', 0.38) };
  return { name: s.name, colour: s.colour, soft: pal.soft, tint: pal.tint, ink: pal.ink };
}
const DAY = 86400000;
function startOfToday() { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); }
function ms(v) { if (v == null) return null; if (typeof v === 'number') return v; const t = Date.parse(v); return isNaN(t) ? null : t; }
function dueMs(due) { if (!due) return null; const [y, m, d] = due.split('-').map(Number); return new Date(y, m - 1, d).getTime(); }
function fmtShort(t) {
  if (t == null) return '—';
  const today = startOfToday();
  if (t >= today) return 'Today';
  if (t >= today - DAY) return 'Yesterday';
  const d = new Date(t);
  const o = { day: 'numeric', month: 'short' };
  if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return d.toLocaleDateString('en-GB', o);
}
function fmtWhen(t) {
  if (t == null) return '—';
  if (t >= startOfToday()) return new Date(t).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  return fmtShort(t);
}
function fmtStamp(t) {
  if (t == null) return '';
  const time = new Date(t).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  return fmtShort(t) + ', ' + time;
}
function fmtMins(m) {
  m = Math.round(m || 0);
  if (m <= 0) return '—';
  if (m < 60) return m + ' min';
  const h = Math.floor(m / 60), r = m % 60;
  return r ? h + ' h ' + String(r).padStart(2, '0') : h + ' h';
}
function daysAgo(t) { return Math.max(0, Math.floor((Date.now() - t) / DAY)); }
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }
function initials(agent) {
  const base = String(agent || '').split('·')[0].trim();
  if (/^chief of staff$/i.test(base)) return 'CS';
  const words = base.split(/\s+/).filter(w => w && !/^(of|the|and|a|an|for)$/i.test(w));
  return (words.slice(0, 2).map(w => w[0]).join('') || '?').toUpperCase();
}
function isCos(who) { return /^chief of staff$/i.test(String(who || '').trim()); }
function isMe(who) { return /^(ifran|you)$/i.test(String(who || '').trim()); }
function whoLabel(who) { return isMe(who) ? 'You' : who; }
/* Links into Sorted (opens that exact task) and to stream pages. */
function taskHref(id) { return '../#task=' + encodeURIComponent(id); }
function taskLink(id, html, cls) { return '<a class="tlink' + (cls ? ' ' + cls : '') + '" href="' + taskHref(id) + '" title="Open in Sorted">' + html + '</a>'; }
function streamHref(id) { return '#/stream/' + encodeURIComponent(id); }
/* Group header: the whole row toggles (the button's ::after covers it), the name is its own link. */
function groupHead(g, L, act, open, nameStyle, chev) {
  const name = esc(L.name);
  const nm = g.k === '__all'
    ? '<span class="nm"' + nameStyle + '>' + name + '</span>'
    : '<a class="nm" href="' + streamHref(g.k) + '"' + nameStyle + '>' + name + '</a>';
  return '<div class="ghead"><button type="button" class="gtoggle" data-act="' + act + '" data-k="' + esc(g.k) + '" aria-expanded="' + open + '" aria-label="' + (open ? 'Hide' : 'Show') + ' jobs for ' + name + '">' + chev + '</button>' +
    '<span class="dot" style="background:' + L.colour + '"></span>' + nm + '<span class="gpills">' + pillsFor(g.c) + '</span></div>';
}

/* ================= Task rules (brief section 3) ================= */
function taskStream(t) {
  const areaId = t.project_id ? (IX.project[t.project_id] || {}).area_id : t.area_id;
  const a = areaId ? IX.area[areaId] : null;
  return a && a.stream ? a.stream : null;
}
const isDone = (t) => t.status === 'done';
const isLive = (t) => !isDone(t) && ([1, 2, 3].includes(t.priority) || !!t.focus);
const isParked = (t) => !isDone(t) && !isLive(t);
const noPriority = (t) => !isDone(t) && !t.priority;
const inPlan = (t) => isLive(t) && (t.priority === 1 || t.priority === 2 || !!t.focus);
const isQuiet = (t) => isLive(t) && ms(t.updated_at) != null && ms(t.updated_at) < Date.now() - QUIET_DAYS * DAY;
function planRank(t) { return t.priority === 1 ? 0 : t.priority === 2 ? 1 : 2; }
function byDueThenOrder(a, b) {
  const da = dueMs(a.due), db = dueMs(b.due);
  if (da != null && db != null && da !== db) return da - db;
  if (da != null && db == null) return -1;
  if (da == null && db != null) return 1;
  return (a.sort_order || 0) - (b.sort_order || 0);
}
function planSort(a, b) { return (planRank(a) - planRank(b)) || byDueThenOrder(a, b); }
function liveSort(a, b) { return ((a.priority || 9) - (b.priority || 9)) || byDueThenOrder(a, b); }

/* ================= Agent job rules ================= */
// A job is on the board until it is finished, and stays while it still needs Ifran or is stuck.
const jobVisible = (j) => !j.finished_at || j.status === 'Needs you' || j.status === 'Stuck';
const visibleJobs = () => D.jobs.filter(jobVisible);
function jobsForTask(taskId) { return visibleJobs().filter(j => j.task_id === taskId); }
function statusCounts(jobs) { const c = { 'Running': 0, 'Needs you': 0, 'Stuck': 0, 'Idle': 0 }; jobs.forEach(j => { if (c[j.status] != null) c[j.status]++; }); return c; }
function jobSort(a, b) { return ((STATUS[a.status] || STATUS.Idle).rank - (STATUS[b.status] || STATUS.Idle).rank) || ((ms(b.updated_at) || 0) - (ms(a.updated_at) || 0)); }
function runningTime(j) {
  const s = ms(j.started_at); if (s == null) return '—';
  const e = ms(j.finished_at) || Date.now();
  const m = Math.max(0, Math.round((e - s) / 60000));
  return m < 1 ? 'under 1 min' : fmtMins(m);
}
function stepText(j) {
  const parts = [];
  if (j.steps_total > 0) parts.push('Step ' + Math.min(j.steps_done, j.steps_total) + ' of ' + j.steps_total);
  if (j.step_note) parts.push(j.step_note);
  return parts.join(' · ') || (STATUS[j.status] ? STATUS[j.status].label : '');
}
function stepBars(j, height) {
  const total = Math.min(Math.max(j.steps_total || 0, 0), 12);
  if (!total) return '';
  const done = Math.min(j.steps_done || 0, total);
  const c = DOT[(STATUS[j.status] || STATUS.Idle).key];
  let h = '<div class="steps" aria-hidden="true">';
  for (let i = 0; i < total; i++) h += '<span style="' + (i < done ? 'background:' + c + ';' : '') + (height ? 'height:' + height + 'px' : '') + '"></span>';
  return h + '</div>';
}
function statusBadge(status) {
  const s = STATUS[status] || STATUS.Idle;
  return '<span class="badge s-' + s.key + '"><span class="bd" style="background:' + DOT[s.key] + '"></span>' + esc(s.label) + '</span>';
}

/* ================= Time spent (brief section 3) ================= */
function periodStart(p) { return p === 'Day' ? startOfToday() : Date.now() - (p === 'Week' ? 7 : 30) * DAY; }
function bucketOf(who) { return isMe(who) ? 'you' : isCos(who) ? 'cos' : 'agents'; }
function timeSplit(period) {
  const since = periodStart(period);
  const out = { you: { total: 0, by: {} }, cos: { total: 0, by: {} }, agents: { total: 0, by: {} } };
  D.activity.forEach(a => {
    const t = ms(a.at); if (t == null || t < since || !(a.minutes > 0)) return;
    const b = out[bucketOf(a.who)]; const k = a.stream || '__none';
    b.total += a.minutes; b.by[k] = (b.by[k] || 0) + a.minutes;
  });
  return out;
}
function timeRows(period, cls) {
  const split = timeSplit(period);
  const names = [['you', 'You'], ['cos', 'Chief of Staff'], ['agents', 'Agents']];
  const used = new Set();
  let html = '';
  names.forEach(([k, label]) => {
    const b = split[k];
    let bar = '';
    if (b.total > 0) {
      const keys = D.streams.map(s => s.id).concat(['__none']).filter(id => b.by[id]);
      keys.forEach(id => { used.add(id); const pct = (b.by[id] / b.total) * 100; const c = id === '__none' ? NONE_COLOUR : look(id).colour; bar += '<span style="width:' + pct.toFixed(2) + '%;background:' + c + '" title="' + esc((id === '__none' ? 'No business' : look(id).name) + ': ' + fmtMins(b.by[id])) + '"></span>'; });
    }
    const aria = label + ': ' + (b.total > 0 ? fmtMins(b.total) : 'no time logged');
    html += '<div class="trow"><span class="nm">' + label + '</span><div class="tbar" role="img" aria-label="' + esc(aria) + '">' + bar + '</div><span class="hrs">' + (b.total > 0 ? fmtMins(b.total) : '—') + '</span></div>';
  });
  const any = split.you.total + split.cos.total + split.agents.total > 0;
  let legend = '';
  if (any) {
    D.streams.forEach(s => { if (used.has(s.id)) legend += '<a href="' + streamHref(s.id) + '"><i style="background:' + s.colour + '"></i>' + esc(s.name) + '</a>'; });
    if (used.has('__none')) legend += '<span><i style="background:' + NONE_COLOUR + '"></i>No business</span>';
  }
  return html + (any ? '<div class="legend">' + legend + '</div>' : '<p class="empty">No time logged ' + (period === 'Day' ? 'today' : period === 'Week' ? 'in the last 7 days' : 'in the last 30 days') + '. Time appears here as work is logged through the system.</p>');
}
function periodSeg(cur, act) {
  return '<div class="seg" role="group" aria-label="Period">' + ['Day', 'Week', 'Month'].map(p => '<button type="button" data-act="' + act + '" data-v="' + p + '" aria-pressed="' + (p === cur) + '">' + p + '</button>').join('') + '</div>';
}

function latestBrief(streamId) { return D.briefs.find(b => (b.stream || null) === (streamId || null)) || null; }
function pendingDecision(b) { return b && b.decision && !b.decided_at && Array.isArray(b.decision.options) && b.decision.options.length ? b.decision : null; }
function decisionHtml(b, dark) {
  const d = pendingDecision(b);
  if (!d) {
    if (b && b.decision && b.decided_at) return '<p class="decided">You chose “' + esc(b.decision_choice || '') + '” ' + esc(fmtStamp(ms(b.decided_at))) + '.</p>';
    return '';

function planNote(t) {
  const bits = [];
  const job = jobsForTask(t.id).sort(jobSort)[0];
  if (t.status === 'waiting') bits.push('Waiting on others');
  else if (job) bits.push('Agent ' + STATUS[job.status].lower);
  else if (t.status === 'doing') bits.push('In progress');
  const d = dueMs(t.due);
  if (d != null) {
    const today = startOfToday();
    if (d < today) { const n = Math.round((today - d) / DAY); bits.push(plural(n, 'day') + ' over'); }
    else if (d === today) bits.push('Due today');
    else bits.push('Due ' + fmtShort(d));
  }
  if (t.focus && bits.length < 2) bits.push('In focus');
  if (isQuiet(t) && bits.length < 2) bits.push('Quiet ' + daysAgo(ms(t.updated_at)) + ' d');
  if (noPriority(t) && bits.length < 2) bits.push('No priority');

}

  const pRest = '<section class="card-lg" aria-label="Everything else live"><h2>Everything else live</h2>' + (rest.length ? rest.map(t => streamTaskItem(t, L)).join('') : '<p class="empty">No other live work here.</p>') + '</section>';
  const pAgents = '<section class="card-lg" aria-label="Agents on this stream" style="gap:14px"><h2>Agents on this stream</h2>' + (jobs.length ? jobs.map(jobCard).join('') : '<p class="empty">No agents are working on this business. When the Chief of Staff hands work here, each job shows its progress in this panel.</p>') + '</section>';
  const pParked = '<section class="card-lg" aria-label="Parked for later" style="gap:14px"><div style="display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px"><h2>Parked for later</h2><span class="sub">Priority 4 and anything without a priority · they don’t count against you</span></div>' +
    (parked.length ? '<div class="parked">' + parked.map(t => {
      const picking = UI.makeLive === t.id;
      const ctrl = picking
        ? '<span class="vh">Choose a priority for ' + esc(t.title) + '</span>' + [1, 2, 3].map(p => '<button type="button" class="pri" data-act="set-pri" data-task="' + esc(t.id) + '" data-p="' + p + '">P' + p + '</button>').join('') + '<button type="button" data-act="make-live-cancel">Cancel</button>'
        : '<button type="button" data-act="make-live" data-task="' + esc(t.id) + '" aria-label="Make ' + esc(t.title) + ' live">Make live</button>';
      return '<div class="pchip">' + taskLink(t.id, esc(t.title), 'tt') + (noPriority(t) ? '<span class="np">No priority</span>' : '') + ctrl + '</div>';
    }).join('') + '</div>' : '<p class="empty">Nothing parked here.</p>') + '</section>';
  const pActs = '<section class="card-lg" aria-label="Activity in this stream" style="gap:4px"><h2 style="margin-bottom:6px">Activity in this stream</h2>' +
    (acts.length ? acts.map(a => { const link = safeUrl(a.link); return '<div class="srow"><span class="w">' + esc(fmtWhen(ms(a.at))) + '</span><span class="x"><b>' + esc(whoLabel(a.who)) + '</b> ' + (a.kind === 'message' ? 'to the Chief of Staff: ' : '') + esc(a.description) + (link ? ' <a href="' + esc(link) + '" target="_blank" rel="noopener noreferrer">Open</a>' : '') + '</span><span class="took">' + esc(fmtMins(a.minutes)) + '</span></div>'; }).join('') : '<p class="empty">No activity logged for this business yet.</p>') + '</section>';

  return '<div class="wrap"><div class="stream-page">' + rail + '<main class="stream-main" id="main">' + head + '<div class="cols2"><div class="lcol">' + pNow + pRest + '</div><div class="rcol">' + pAgents + '</div></div>' + pParked + pActs + '</main></div></div>';
}

/* ================= Agents page (design E) ================= */
function renderAgents() {
  const b = latestBrief(null);
  const jobs = visibleJobs();
  const c = statusCounts(jobs);
  const agentNames = new Set(jobs.filter(j => !isCos(j.agent)).map(j => j.agent));
  const sub = (agentNames.size ? 'Coordinating ' + plural(agentNames.size, 'agent') : 'No agents working yet') + (b ? ' · last brief ' + fmtStamp(ms(b.at)) : '');
  const cos = '<div class="cos-dark"><div class="hd"><div class="cos-av" aria-hidden="true">CS</div><div class="t"><b>Chief of Staff</b><span>' + esc(sub) + '</span></div></div>' +
    (b ? '<p>' + esc(b.standing || b.holding || b.late || 'The latest brief has no text yet.') + '</p>' + decisionHtml(b, true) : '<p>No brief yet. Once the Chief of Staff is running, its latest view of the fleet appears here.</p>') +
    '<div><a href="#/home">Message it from Home</a></div></div>';
  const counts = '<div class="counts" aria-label="Agent status counts">' + STATUS_ORDER.map(s => '<div class="count"><span><span class="dot" style="width:8px;height:8px;background:' + DOT[STATUS[s].key] + '"></span>' + STATUS[s].label + '</span><b>' + c[s] + '</b></div>').join('') + '</div>';

  const groups = fleetGroups(agentsState);
  let fleet = '<section class="bigpanel" aria-label="Fleet at work"><div class="hd"><h1 class="page-title">Fleet at work</h1><span>Business → agent → what comes back to you</span></div>';
  if (!jobs.length) fleet += '<p class="empty">No agent work yet. When the Chief of Staff hands a job to an agent, it appears here with its progress, how long it has been running, and what it will bring back to you.</p>';
  else {
    fleet += '<div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn" data-act="agents-all" data-v="open">Expand all</button><button type="button" class="btn" data-act="agents-all" data-v="close">Collapse all</button></div>';
    groups.forEach(g => {
      const L = look(g.k === '__all' ? null : g.k);
      const open = !!UI.agentsOpen[g.k];
      fleet += '<div class="ag-group" style="background:' + (open ? '#FFFFFF' : L.soft) + '">' + groupHead(g, L, 'agents-toggle', open, ' style="color:' + L.ink + '"', '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5C6270" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>');
      if (open) {
        fleet += '<div class="ag-rows">' + g.js.map(j => {
          const s = STATUS[j.status] || STATUS.Idle;
          const out = safeUrl(j.output_url);
          return '<div class="ag-row"><div class="ag-job" style="border-color:var(--' + s.key + '-line)"><div class="in" aria-hidden="true">' + esc(initials(j.agent)) + '</div><div class="who"><div class="l1"><b>' + esc(j.agent) + '</b>' + statusBadge(j.status) + '</div><span class="jt">' + (j.task_id ? taskLink(j.task_id, esc(j.title)) : esc(j.title)) + '</span></div>' +
            '<div class="prog">' + stepBars(j) + '<div class="m"><span>' + esc(stepText(j)) + '</span><span class="mono">' + esc(runningTime(j)) + '</span></div></div></div>' +
            '<div class="ag-arrow" aria-hidden="true"><svg width="28" height="12" viewBox="0 0 28 12" fill="none" stroke="#C4C8D2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h22M19 1.5L24 6l-5 4.5"></path></svg></div>' +
            '<div class="ag-out"><span class="l">' + esc(s.out) + '</span><span class="v">' + esc(j.returns || '—') + '</span>' + (out ? '<a href="' + esc(out) + '" target="_blank" rel="noopener noreferrer" style="font-size:13px">Open output</a>' : '') + '</div></div>';
        }).join('') + '</div>';
      }
      fleet += '</div>';
    });
  }
  fleet += '</section>';
  const time = '<section class="bigpanel" aria-label="Where the time went"><div class="hd"><h2 class="sm">Where the time went</h2>' + periodSeg(UI.agentsPeriod, 'agents-period') + '</div>' + timeRows(UI.agentsPeriod) + '</section>';
  return '<main class="wrap" id="main" style="display:flex;flex-direction:column;gap:24px"><section class="agents-top" aria-label="Chief of Staff and agent status">' + cos + counts + '</section>' + fleet + time + '</main>';
}

/* ================= Parked ideas (later phase) ================= */
function renderParked() {
  const links = D.streams.map(s => '<a href="#/stream/' + encodeURIComponent(s.id) + '" style="display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--sub);color:var(--ink)"><span class="dot" style="background:' + s.colour + '"></span>' + esc(s.name) + '</a>').join('');
  return '<main class="wrap" id="main"><section class="card-xl"><h1 class="page-title">Parked ideas</h1><p style="font-size:15px;line-height:1.6;color:var(--ink-2);max-width:62ch">This page is planned for a later build. Until then, parked work for each business sits at the bottom of its stream page, where you can make any of it live.</p><div style="display:flex;flex-wrap:wrap;gap:8px">' + links + '</div></section></main>';
}

/* ================= Render ================= */
function render() {
  const root = document.getElementById('root');
  if (!user) return;
  if (!loaded) { root.innerHTML = topbar(route()) + '<p class="empty" style="padding:24px">Loading your work…</p>'; return; }
  const a = document.activeElement;
  const focusId = a && a.id ? a.id : null;
  const caret = a && typeof a.selectionStart === 'number' ? [a.selectionStart, a.selectionEnd] : null;
  const scroll = window.scrollY;
  const r = route();
  const page = r.page === 'stream' ? renderStream(r.id) : r.page === 'agents' ? renderAgents() : r.page === 'parked' ? renderParked() : renderHome();
  root.innerHTML = topbar(route()) + page;
  if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus({ preventScroll: true }); if (caret && el.setSelectionRange) { try { el.setSelectionRange(caret[0], caret[1]); } catch (e) {} } } }
  window.scrollTo(0, scroll);
}

/* ================= Data ================= */
function reindex() {
  IX.stream = {}; D.streams.forEach(s => { IX.stream[s.id] = s; });
  IX.area = {}; D.areas.forEach(a => { IX.area[a.id] = a; });
  IX.project = {}; D.projects.forEach(p => { IX.project[p.id] = p; });
  IX.task = {}; D.tasks.forEach(t => { IX.task[t.id] = t; });
}
async function loadAll() {
  const res = await Promise.all([
    sb.from('streams').select('id,name,colour,position').order('position'),
    sb.from('areas').select('id,name,position,stream').order('position'),
    sb.from('projects').select('id,name,area_id'),
    sb.from('tasks').select('id,title,project_id,area_id,parent_id,due,priority,status,focus,completed_at,created_at,updated_at,sort_order'),
    sb.from('agent_jobs').select('*').order('created_at', { ascending: false }).limit(500),
    sb.from('activity').select('*').order('at', { ascending: false }).limit(2000),
    sb.from('briefs').select('*').order('at', { ascending: false }).limit(200),
  ]);
  const bad = res.find(r => r.error);
  if (bad) throw new Error(bad.error.message || 'query failed');
  [D.streams, D.areas, D.projects, D.tasks, D.jobs, D.activity, D.briefs] = res.map(r => r.data || []);
  reindex();
  loaded = true;
  loadError = null;
}
let reloadTimer = null;
function scheduleReload() {
  clearTimeout(reloadTimer);
  reloadTimer = setTimeout(async () => {
    try { await loadAll(); } catch (e) { loadError = 'Could not refresh from the database. It will try again shortly.'; }
    render();
  }, 400);
}
function subscribe() {
  if (rtChannel) sb.removeChannel(rtChannel);
  rtChannel = sb.channel('command-centre');
  ['streams', 'areas', 'projects', 'tasks', 'agent_jobs', 'activity', 'briefs'].forEach(t => {
    rtChannel.on('postgres_changes', { event: '*', schema: SB_SCHEMA, table: t, filter: 'user_id=eq.' + user.id }, scheduleReload);
  });
  rtChannel.subscribe();
}

/* ================= Actions ================= */
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 3200);
}
async function setPriority(taskId, p) {
  const t = IX.task[taskId];
  if (!t || ![1, 2, 3, 4].includes(p)) return false;
  const { error } = await sb.from('tasks').update({ priority: p }).eq('id', taskId);
  if (error) { toast('Could not update the task: ' + error.message); return false; }
  t.priority = p;
  return true;
}
async function decide(briefId, i) {
  const b = D.briefs.find(x => x.id === briefId);
  const d = pendingDecision(b);
  if (!d || !d.options[i]) return;
  const opt = d.options[i];
  const act = opt.action || null;
  let did = '';
  if (act && act.type === 'set_priority' && IX.task[act.task_id] && [1, 2, 3, 4].includes(Number(act.priority))) {
    if (await setPriority(act.task_id, Number(act.priority))) did = ' and set priority ' + Number(act.priority);
  }
  const now = new Date().toISOString();
  const up = await sb.from('briefs').update({ decision_choice: opt.label || ('Option ' + (i + 1)), decided_at: now }).eq('id', briefId);
  if (up.error) { toast('Could not record your decision: ' + up.error.message); return; }
  b.decision_choice = opt.label; b.decided_at = now;
  const taskId = act && IX.task[act.task_id] ? act.task_id : null;
  await sb.from('activity').insert({ who: 'Ifran', kind: 'decision', stream: b.stream || (taskId ? taskStream(IX.task[taskId]) : null), task_id: taskId, description: 'Chose “' + (opt.label || 'Option ' + (i + 1)) + '”' + (d.question ? ' on: ' + d.question : '') });
  toast('Decision recorded' + did + '.');
  render();
}
async function sendMessage(text) {
  const msg = text.trim();
  if (!msg) return;
  const { error } = await sb.from('activity').insert({ who: 'Ifran', kind: 'message', description: msg, minutes: 0 });
  if (error) { toast('Could not send: ' + error.message); return; }
  UI.msgDraft = '';
  toast('Sent to your Chief of Staff.');
  scheduleReload();
  render();
}
let recog = null;
function toggleDictation() {
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!R) return;
  if (UI.listening && recog) { recog.stop(); return; }
  recog = new R(); recog.lang = 'en-GB'; recog.interimResults = false; recog.continuous = false;
  recog.onresult = (e) => { const said = Array.from(e.results).map(r => r[0].transcript).join(' '); UI.msgDraft = (UI.msgDraft ? UI.msgDraft.trim() + ' ' : '') + said; };
  recog.onend = () => { UI.listening = false; render(); const el = document.getElementById('cos-msg'); if (el) el.focus(); };
  recog.onerror = () => { UI.listening = false; render(); };
  UI.listening = true; render(); recog.start();
}

document.addEventListener('input', (e) => { if (e.target && e.target.id === 'cos-msg') UI.msgDraft = e.target.value; });
document.addEventListener('submit', (e) => {
  const f = e.target.closest('[data-form]');
  if (!f) return;
  e.preventDefault();
  if (f.dataset.form === 'msg') sendMessage(UI.msgDraft);
  if (f.dataset.form === 'signin') doSignIn(f);
});
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act, v = b.dataset.v;
  if (act === 'cos-toggle') { UI.cosOpen = !UI.cosOpen; store('cosOpen', UI.cosOpen); render(); const f = document.querySelector('[data-act="cos-toggle"]'); if (f) f.focus(); }
  else if (act === 'plan-toggle') { UI.planOpen = !UI.planOpen; store('planOpen', UI.planOpen); render(); const f = document.querySelector('[data-act="plan-toggle"]'); if (f) f.focus(); }
  else if (act === 'home-period') { UI.homePeriod = v; render(); }
  else if (act === 'agents-period') { UI.agentsPeriod = v; render(); }
  else if (act === 'act-filter') { UI.actFilter = v; UI.actShown = ACTIVITY_PAGE; render(); }
  else if (act === 'act-more') { UI.actShown += ACTIVITY_PAGE; render(); }
  else if (act === 'fleet-toggle') { UI.fleetOpen[b.dataset.k] = !UI.fleetOpen[b.dataset.k]; render(); }
  else if (act === 'agents-toggle') { UI.agentsOpen[b.dataset.k] = !UI.agentsOpen[b.dataset.k]; render(); }
  else if (act === 'fleet-all' || act === 'agents-all') {
    const m = {}; visibleJobs().forEach(j => { m[j.stream || '__all'] = v === 'open'; });
    if (act === 'fleet-all') UI.fleetOpen = m; else UI.agentsOpen = m; render();
  }
  else if (act === 'make-live') { UI.makeLive = b.dataset.task; render(); const f = document.querySelector('[data-act="set-pri"]'); if (f) f.focus(); }
  else if (act === 'make-live-cancel') { UI.makeLive = null; render(); }
  else if (act === 'set-pri') {
    const t = IX.task[b.dataset.task]; const p = Number(b.dataset.p);
    if (t && await setPriority(t.id, p)) { UI.makeLive = null; toast('“' + t.title + '” is now live at P' + p + '.'); render(); }
  }
  else if (act === 'decide') { b.disabled = true; await decide(b.dataset.brief, Number(b.dataset.i)); }
  else if (act === 'dictate') { toggleDictation(); }
});
window.addEventListener('hashchange', () => { UI.makeLive = null; render(); window.scrollTo(0, 0); const m = document.getElementById('main'); if (m) { m.setAttribute('tabindex', '-1'); m.focus({ preventScroll: true }); } });

/* ================= Sign in & boot ================= */
function showSignIn(err) {
  document.getElementById('root').innerHTML = '<div class="centre"><form class="signin" data-form="signin"><h1><span class="brand-mark"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3"></circle></svg></span>Command Centre</h1><p class="muted" style="font-size:13px">Sign in with your Sorted account.</p>' +
    '<label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label>' +
    '<button type="submit" class="go">Sign in</button><p class="err" role="alert">' + esc(err || '') + '</p></form></div>';
}
async function doSignIn(f) {
  const email = f.email.value.trim(), password = f.password.value;
  const btn = f.querySelector('.go'); btn.disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false;
  if (error) f.querySelector('.err').textContent = /invalid/i.test(error.message) ? 'Email or password not recognised.' : error.message;
}
async function start(session) {
  if (user && user.id === session.user.id) return;
  user = session.user;
  render();
  try { await loadAll(); } catch (e) { loadError = 'Could not load from the database (' + e.message + '). It will try again shortly.'; loaded = true; setTimeout(scheduleReload, 8000); }
  render();
  subscribe();
}
(async function boot() {
  if (!window.supabase) { document.getElementById('root').innerHTML = '<div class="centre"><p class="empty">Could not load the database library. Check your connection and refresh.</p></div>'; return; }
  sb = window.supabase.createClient(SB_URL, SB_ANON, { db: { schema: SB_SCHEMA } });
  sb.auth.onAuthStateChange((event, session) => {
    if (session && (event === 'SIGNED_IN' || event === 'INITIAL_SESSION')) start(session);
    if (event === 'SIGNED_OUT') { user = null; loaded = false; showSignIn(); }
  });
  const { data } = await sb.auth.getSession();
  if (data && data.session) start(data.session); else showSignIn();
  setInterval(() => { if (user && loaded) render(); }, 60000);
  setInterval(() => { if (user) scheduleReload(); }, 300000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && user) scheduleReload(); });
})();
</script>
