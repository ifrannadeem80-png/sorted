<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E5B4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sorted">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png" type="image/png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<title>Sorted</title>
<style>
  /* ---------- Design tokens ---------- */
  :root {
    --bg: #F6F7F5;
    --surface: #FFFFFF;
    --surface-2: #EDF0EB;
    --ink: #1B2420;
    --ink-soft: #5C6862;
    --ink-faint: #8B958F;
    --line: #DDE3DC;
    --line-soft: #E8ECE6;
    --accent: #1E5B4A;
    --accent-ink: #FFFFFF;
    --accent-soft: #E2EDE8;
    --q1: #B54430; --q1-soft: #F6E3DE; --q1-tint: #FAF1EE;
    --q2: #1E5B4A; --q2-soft: #E2EDE8; --q2-tint: #F0F6F3;
    --q3: #A1720E; --q3-soft: #F4EAD3; --q3-tint: #F9F4E7;
    --q4: #66716B; --q4-soft: #E9ECE9; --q4-tint: #F1F3F1;
    --danger: #B3402E;
    --shadow: 0 1px 2px rgba(27,36,32,0.06), 0 4px 16px rgba(27,36,32,0.07);
    --shadow-lift: 0 2px 6px rgba(27,36,32,0.10), 0 10px 30px rgba(27,36,32,0.14);
    --radius: 10px;
    --serif: 'Charter', 'Bitstream Charter', 'Sitka Text', Cambria, Georgia, serif;
    --sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131816;
      --surface: #1B221F;
      --surface-2: #222B27;
      --ink: #E7ECE8;
      --ink-soft: #A0ACA5;
      --ink-faint: #6E7A73;
      --line: #2D3732;
      --line-soft: #26302B;
      --accent: #62A98E;
      --accent-ink: #10201A;
      --accent-soft: #22362E;
      --q1: #D9765F; --q1-soft: #3A2620; --q1-tint: #221B18;
      --q2: #62A98E; --q2-soft: #22362E; --q2-tint: #18221E;
      --q3: #CFA045; --q3-soft: #38301B; --q3-tint: #211E15;
      --q4: #90998F; --q4-soft: #2A322D; --q4-tint: #1D211F;
      --danger: #D9765F;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.25);
      --shadow-lift: 0 2px 6px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"] {
    --bg: #131816;
    --surface: #1B221F;
    --surface-2: #222B27;
    --ink: #E7ECE8;
    --ink-soft: #A0ACA5;
    --ink-faint: #6E7A73;
    --line: #2D3732;
    --line-soft: #26302B;
    --accent: #62A98E;
    --accent-ink: #10201A;
    --accent-soft: #22362E;
    --q1: #D9765F; --q1-soft: #3A2620; --q1-tint: #221B18;
    --q2: #62A98E; --q2-soft: #22362E; --q2-tint: #18221E;
    --q3: #CFA045; --q3-soft: #38301B; --q3-tint: #211E15;
    --q4: #90998F; --q4-soft: #2A322D; --q4-tint: #1D211F;
    --danger: #D9765F;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.25);
    --shadow-lift: 0 2px 6px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.45);
  }
  :root[data-theme="light"] {
    --bg: #F6F7F5;
    --surface: #FFFFFF;
    --surface-2: #EDF0EB;
    --ink: #1B2420;
    --ink-soft: #5C6862;
    --ink-faint: #8B958F;
    --line: #DDE3DC;
    --line-soft: #E8ECE6;
    --accent: #1E5B4A;
    --accent-ink: #FFFFFF;
    --accent-soft: #E2EDE8;
    --q1: #B54430; --q1-soft: #F6E3DE; --q1-tint: #FAF1EE;
    --q2: #1E5B4A; --q2-soft: #E2EDE8; --q2-tint: #F0F6F3;
    --q3: #A1720E; --q3-soft: #F4EAD3; --q3-tint: #F9F4E7;
    --q4: #66716B; --q4-soft: #E9ECE9; --q4-tint: #F1F3F1;
    --danger: #B3402E;
    --shadow: 0 1px 2px rgba(27,36,32,0.06), 0 4px 16px rgba(27,36,32,0.07);
    --shadow-lift: 0 2px 6px rgba(27,36,32,0.10), 0 10px 30px rgba(27,36,32,0.14);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input, select, textarea { font: inherit; color: var(--ink); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }

  /* ---------- Shell ---------- */
  .shell { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }

  .sidebar {
    width: 244px; flex: none;
    border-right: 1px solid var(--line);
    background: var(--surface);
    display: flex; flex-direction: column;
    padding: 20px 14px 14px;
    gap: 4px;
    overflow-y: auto;
  }
  .area-row { display: flex; align-items: center; }
  .area-row .proj-btn { flex: 1; font-weight: 600; color: var(--ink); }
  .area-row .proj-btn.active { color: var(--accent); }
  .caret { padding: 4px 7px; color: var(--ink-faint); font-size: 10px; border-radius: 6px; }
  .caret:hover { background: var(--surface-2); color: var(--ink); }
  .proj-btn.indent { padding-left: 28px; }
  .kebab { padding: 4px 5px; color: var(--ink-faint); font-size: 14px; border-radius: 6px; opacity: 0; transition: opacity 0.12s; }
  .area-row:hover .kebab, .kebab:focus-visible { opacity: 1; }
  .kebab:hover { background: var(--surface-2); color: var(--ink); }
  .swatch-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .bg-swatch {
    width: 44px; height: 34px; border-radius: 8px;
    border: 2px solid var(--line);
    color: var(--ink-faint); font-size: 15px;
  }
  .bg-swatch.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .brand {
    font-family: var(--serif);
    font-size: 26px; font-weight: 700;
    letter-spacing: 0.01em;
    padding: 0 10px 14px;
    color: var(--ink);
  }
  .brand .dot { color: var(--accent); }
  .nav-btn {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; border-radius: 8px;
    color: var(--ink-soft); text-align: left;
    font-weight: 500;
    transition: background 0.12s;
  }
  .nav-btn:hover { background: var(--surface-2); }
  .nav-btn.active { background: var(--accent-soft); color: var(--accent); }
  .nav-btn svg { flex: none; }
  .nav-count { margin-left: auto; font-size: 12px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }

  .side-label {
    margin: 18px 10px 6px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-faint);
    display: flex; align-items: center; justify-content: space-between;
  }
  .side-label button { color: var(--ink-faint); font-size: 16px; line-height: 1; padding: 0 2px; }
  .side-label button:hover { color: var(--accent); }
  .proj-btn {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 10px; border-radius: 8px;
    color: var(--ink-soft); text-align: left; width: 100%;
  }
  .proj-btn:hover { background: var(--surface-2); }
  .proj-btn.active { background: var(--accent-soft); color: var(--accent); }
  .proj-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .proj-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sidebar-foot { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line-soft); }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  .topbar {
    display: flex; gap: 10px; align-items: center;
    padding: 14px 22px 10px;
  }
  .view-title {
    font-family: var(--serif);
    font-size: 24px; font-weight: 700;
    text-wrap: balance;
    margin-right: auto;
    white-space: nowrap;
  }
  .view-sub { font-size: 13px; color: var(--ink-faint); margin-left: 10px; font-family: var(--sans); font-weight: 400; }

  .quickadd-wrap { padding: 4px 22px 12px; }
  .quickadd {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 4px 6px 4px 14px;
    box-shadow: var(--shadow);
  }
  .quickadd:focus-within { border-color: var(--accent); }
  .quickadd input {
    flex: 1; border: none; background: none; outline: none;
    padding: 8px 0; font-size: 15px;
  }
  .quickadd input::placeholder { color: var(--ink-faint); }
  .quickadd .add-go {
    background: var(--accent); color: var(--accent-ink);
    border-radius: 8px; padding: 8px 16px; font-weight: 600;
  }
  .quickadd-hint {
    font-size: 12px; color: var(--ink-faint);
    padding: 6px 4px 0;
  }
  .quickadd-hint b { font-weight: 600; color: var(--ink-soft); }

  .searchbar { position: relative; }
  .searchbar input {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 12px 8px 32px; width: 190px; outline: none;
  }
  .searchbar input:focus { border-color: var(--accent); }
  .searchbar svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--ink-faint); }

  .icon-btn {
    padding: 8px; border-radius: 8px; color: var(--ink-soft);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink); }

  .content { flex: 1; overflow-y: auto; padding: 4px 22px 90px; }

  /* ---------- Task rows ---------- */
  .task-row {
    display: flex; align-items: flex-start; gap: 11px;
    background: var(--surface);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius);
    padding: 11px 13px;
    margin-bottom: 7px;
    cursor: pointer;
    transition: box-shadow 0.12s, border-color 0.12s;
  }
  .task-row:hover { border-color: var(--line); box-shadow: var(--shadow); }
  .task-row.done-row { opacity: 0.6; }
  .task-row.done-row .t-title { text-decoration: line-through; }
  .check {
    flex: none; width: 20px; height: 20px; margin-top: 1px;
    border: 2px solid var(--ink-faint); border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    color: transparent; background: none;
    transition: all 0.12s;
  }
  .check:hover { border-color: var(--accent); }
  .check.checked { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .t-body { flex: 1; min-width: 0; }
  .t-title { font-weight: 500; overflow-wrap: anywhere; }
  .t-meta { display: flex; flex-wrap: wrap; gap: 5px 10px; margin-top: 4px; font-size: 12px; color: var(--ink-faint); align-items: center; }
  .t-meta .m-proj { display: inline-flex; align-items: center; gap: 5px; }
  .m-due.overdue { color: var(--q1); font-weight: 600; }
  .m-due.today { color: var(--q3); font-weight: 600; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 600;
    padding: 1px 8px; border-radius: 999px;
  }
  .chip.q1 { background: var(--q1-soft); color: var(--q1); }
  .chip.q2 { background: var(--q2-soft); color: var(--q2); }
  .chip.q3 { background: var(--q3-soft); color: var(--q3); }
  .chip.q4 { background: var(--q4-soft); color: var(--q4); }
  .chip.st { background: var(--surface-2); color: var(--ink-soft); }
  .star-btn { flex: none; color: var(--ink-faint); padding: 2px; margin-top: -1px; }
  .star-btn:hover { color: var(--q3); }
  .star-btn.on { color: var(--q3); }

  .group-head {
    font-family: var(--serif);
    font-size: 16px; font-weight: 700;
    margin: 20px 2px 9px;
    display: flex; align-items: baseline; gap: 8px;
  }
  .group-head:first-child { margin-top: 8px; }
  .group-head .g-count { font-family: var(--sans); font-size: 12px; font-weight: 500; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .group-head .g-dot { width: 10px; height: 10px; border-radius: 50%; align-self: center; }
  .sub-head {
    font-size: 13px; font-weight: 600; color: var(--ink-soft);
    margin: 10px 2px 6px; display: flex; gap: 7px; align-items: center;
  }
  .sub-head .g-dot { width: 8px; height: 8px; border-radius: 50%; }
  .sub-head .g-count { font-size: 11px; font-weight: 500; color: var(--ink-faint); font-variant-numeric: tabular-nums; }

  .toolbar {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 2px 0 8px;
  }
  .seg { display: inline-flex; background: var(--surface-2); border-radius: 8px; padding: 3px; }
  .seg button { padding: 5px 12px; border-radius: 6px; font-size: 13px; color: var(--ink-soft); font-weight: 500; }
  .seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  .tool-label { font-size: 12px; color: var(--ink-faint); margin-right: -2px; }
  .link-btn { color: var(--accent); font-size: 13px; font-weight: 600; padding: 5px 8px; border-radius: 6px; }
  .link-btn:hover { background: var(--accent-soft); }

  .empty {
    text-align: center; color: var(--ink-faint);
    padding: 48px 20px; font-size: 14px;
  }
  .empty .e-big { font-family: var(--serif); font-size: 19px; color: var(--ink-soft); margin-bottom: 6px; }

  /* ---------- Priority table ---------- */
  .table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius); box-shadow: var(--shadow); }
  .ptable { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 520px; }
  .ptable th {
    text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--ink-faint);
    padding: 10px 12px; border-bottom: 1px solid var(--line);
  }
  .ptable td { padding: 10px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
  .ptable tr:last-child td { border-bottom: none; }
  .ptable tbody tr { cursor: pointer; }
  .ptable tbody tr:hover td { background: var(--surface-2); }
  .ptable .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pri-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 50%;
    font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums;
  }
  .pri-1 { background: var(--q1-soft); color: var(--q1); }
  .pri-2 { background: var(--q3-soft); color: var(--q3); }
  .pri-3 { background: var(--q2-soft); color: var(--q2); }
  .pri-4 { background: var(--q4-soft); color: var(--q4); }
  .chip.pri { background: var(--surface-2); color: var(--ink-soft); }

  /* ---------- Tiles, filters, steps ---------- */
  .tile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; margin-bottom: 7px; }
  .tile-grid .task-row { margin-bottom: 0; align-items: flex-start; }
  .mini-select {
    padding: 6px 9px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); font-size: 13px; color: var(--ink-soft); outline: none;
  }
  .mini-select:focus { border-color: var(--accent); }
  .step-row { display: flex; align-items: center; gap: 9px; padding: 5px 0; }
  .step-row .check { width: 17px; height: 17px; margin-top: 0; }
  .step-title { flex: 1; font-size: 14px; overflow-wrap: anywhere; }
  .step-row.done .step-title { text-decoration: line-through; color: var(--ink-faint); }
  .step-del { color: var(--ink-faint); font-size: 16px; line-height: 1; padding: 2px 6px; border-radius: 6px; }
  .step-del:hover { color: var(--danger); background: var(--q1-soft); }


  /* ---------- Matrix ---------- */
  .matrix-wrap { display: grid; grid-template-columns: 26px 1fr 1fr; grid-template-rows: 24px 1fr 1fr; gap: 8px; min-height: 60vh; }
  .ax {
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-faint);
  }
  .ax.vert { writing-mode: vertical-rl; transform: rotate(180deg); }
  .quad {
    background: var(--surface);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius);
    padding: 10px;
    display: flex; flex-direction: column;
    min-height: 170px;
    transition: border-color 0.12s, background 0.12s;
  }
  .quad.qc1 { background: var(--q1-tint); border-color: var(--q1-soft); }
  .quad.qc2 { background: var(--q2-tint); border-color: var(--q2-soft); }
  .quad.qc3 { background: var(--q3-tint); border-color: var(--q3-soft); }
  .quad.qc4 { background: var(--q4-tint); border-color: var(--q4-soft); }
  .quad .task-row { background: var(--surface); }
  .q-axes { display: none; font-size: 11px; font-weight: 500; color: var(--ink-faint); margin-left: 4px; }
  .quad.drag-over { border-color: var(--accent); background: var(--accent-soft); }
  .quad-head {
    display: flex; align-items: center; gap: 8px;
    padding: 2px 4px 8px;
    font-weight: 700; font-size: 14px;
  }
  .quad-head .q-mark { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .quad-head .q-count { margin-left: auto; font-size: 12px; color: var(--ink-faint); font-weight: 500; font-variant-numeric: tabular-nums; }
  .quad-body { flex: 1; overflow-y: auto; }
  .quad-body .task-row { padding: 8px 10px; margin-bottom: 6px; }
  .quad-body .t-meta { margin-top: 2px; }
  .tray {
    margin-top: 14px;
    background: var(--surface-2);
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    padding: 12px;
  }
  .tray.drag-over { border-color: var(--accent); background: var(--accent-soft); }
  .tray-head { font-weight: 700; font-size: 14px; display: flex; gap: 8px; align-items: baseline; margin-bottom: 8px; }
  .tray-head span { font-size: 12px; color: var(--ink-faint); font-weight: 500; }
  .drag-hint { font-size: 12px; color: var(--ink-faint); padding: 4px 2px 10px; }

  /* ---------- Board ---------- */
  .board { display: grid; grid-template-columns: repeat(4, minmax(230px, 1fr)); gap: 10px; align-items: start; overflow-x: auto; padding-bottom: 10px; }
  .col {
    background: var(--surface-2);
    border-radius: var(--radius);
    padding: 10px;
    min-height: 200px;
    border: 1px solid transparent;
  }
  .col.drag-over { border-color: var(--accent); background: var(--accent-soft); }
  .col-head { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; padding: 2px 4px 10px; }
  .col-head .q-count { margin-left: auto; font-size: 12px; color: var(--ink-faint); font-weight: 500; font-variant-numeric: tabular-nums; }
  .col .task-row { padding: 9px 11px; }

  /* ---------- Modal / sheet ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(15,20,17,0.45);
    display: flex; align-items: center; justify-content: center;
    padding: 18px;
  }
  .sheet {
    background: var(--surface);
    border-radius: 14px;
    box-shadow: var(--shadow-lift);
    width: 100%; max-width: 520px;
    max-height: calc(100vh - 40px); max-height: calc(100dvh - 40px);
    overflow-y: auto;
    padding: 22px;
  }
  .sheet h2 { font-family: var(--serif); font-size: 20px; margin-bottom: 14px; }
  .f-row { margin-bottom: 14px; }
  .f-label { display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 6px; }
  .f-input, .f-select, .f-textarea {
    width: 100%; background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 12px; outline: none;
  }
  .f-input:focus, .f-select:focus, .f-textarea:focus { border-color: var(--accent); }
  .f-textarea { resize: vertical; min-height: 64px; }
  .pick-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .pick {
    padding: 7px 12px; border-radius: 8px;
    background: var(--surface-2); color: var(--ink-soft);
    font-size: 13px; font-weight: 600;

<script>
'use strict';

/* ================= Cloud config ================= */

const SB_URL = 'https://cnouvshaoramdmkcjcxe.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNub3V2c2hhb3JhbWRta2NqY3hlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NDkwMDIsImV4cCI6MjEwMDUyNTAwMn0.W641moclFovb-I9lQqmG4sLWN3jGCtVOWAaoeGdpkJw';
let sb = null;
let sbUser = null;

/* ================= State ================= */

const STORE_KEY = 'sorted.cloud.v1';

const QUADS = [1, 2, 3, 4];

const defaultSettings = () => ({
  quadNames: ['Do first', 'Schedule', 'Delegate', 'Park'],
  axisX: ['Urgent', 'Not urgent'],
  axisY: ['Important', 'Not important'],
  collapsed: [],
  groupTint: true,

function seedAreas() {

    { id: uid(), name: 'Property', colour: '#1E5B4A', position: 0 },
    { id: uid(), name: 'China (Orders)', colour: '#B54430', position: 1 },
    { id: uid(), name: 'Tiling Smart', colour: '#A1720E', position: 2 },
    { id: uid(), name: 'AI System Development', colour: '#3E5F8A', position: 3 },
  ];
}

let state = {
  tasks: [],
  projects: [],
  areas: [],
  settings: defaultSettings(),
};

let ui = {
  view: 'today',           // today | list | matrix | board | priority | done
  groupBy: 'project',      // project | due | quadrant
  sortBy: 'due',           // due | added
  layout: 'rows',          // rows | tiles (list view)
  fQuad: '', fPri: '', fStatus: '',   // list view filters ('' = any)
  filterProject: null,     // project id or null
  filterArea: null,        // area (group) id or null
  search: '',
  showDone: false,
  editingId: null,
};

function uid() {
  return (crypto.randomUUID) ? crypto.randomUUID() : ('id-' + Date.now() + '-' + Math.floor(Math.random() * 1e9));
}

/* Local cache: instant paint on open; the cloud is the source of truth. */
function loadCache() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data || !Array.isArray(data.tasks)) return false;
    state.tasks = data.tasks;
    state.tasks.forEach(t => { if (!Array.isArray(t.steps)) t.steps = []; });
    state.projects = Array.isArray(data.projects) ? data.projects : [];
    state.areas = Array.isArray(data.areas) ? data.areas : [];
    sortAreas();
    state.settings = Object.assign(defaultSettings(), data.settings || {});
    return true;
  } catch (e) { return false; }
}
function saveCache() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ v: 1, tasks: state.tasks, projects: state.projects, areas: state.areas, settings: state.settings }));
  } catch (e) { /* cache only; cloud still saves */ }
}

let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    saveCache();
    scheduleSync();
  }, 150);
}

/* ================= Cloud sync engine =================
   Diff-based: after any change, rows that differ from the last-pushed
   snapshot are upserted, missing ones deleted. Failed pushes stay dirty
   and retry, so brief offline periods heal themselves. */

const baseline = { tasks: {}, projects: {}, areas: {}, settings: null };

const taskToRow = (t) => ({ id: t.id, title: t.title, notes: t.notes || '', project_id: t.projectId || null, area_id: t.areaId || null, due: t.due || null, quadrant: t.quadrant || null, priority: t.priority || null, status: t.status || 'todo', focus: !!t.focus, steps: t.steps || [], created_at: t.createdAt || 0, completed_at: t.completedAt || null });
const rowToTask = (r) => ({ id: r.id, title: r.title, notes: r.notes || '', projectId: r.project_id || null, areaId: r.area_id || null, due: r.due || null, quadrant: r.quadrant || null, priority: r.priority || null, status: r.status || 'todo', focus: !!r.focus, steps: Array.isArray(r.steps) ? r.steps : [], createdAt: Number(r.created_at) || 0, completedAt: r.completed_at === null ? null : Number(r.completed_at) });
const projToRow = (p) => ({ id: p.id, name: p.name, colour: p.colour, area_id: p.areaId || null });
const rowToProj = (r) => ({ id: r.id, name: r.name, colour: r.colour, areaId: r.area_id || null });
const areaToRow = (a) => ({ id: a.id, name: a.name, colour: a.colour, position: a.position || 0, bg: a.bg || '' });
const rowToArea = (r) => ({ id: r.id, name: r.name, colour: r.colour, position: r.position || 0, bg: r.bg || '' });
function sortAreas() { state.areas.sort((a, b) => (a.position || 0) - (b.position || 0)); }

/* Group backdrops: token stored in area.bg */
const BG_PRESETS = {
  g1: ['Forest', 'linear-gradient(160deg,#1E5B4A26,#3E5F8A1F)'],
  g2: ['Terracotta', 'linear-gradient(160deg,#B5443026,#A1720E1F)'],
  g3: ['Harvest', 'linear-gradient(160deg,#A1720E26,#1E5B4A1A)'],
  g4: ['Slate', 'linear-gradient(160deg,#3E5F8A26,#66716B1F)'],
  g5: ['Plum', 'linear-gradient(160deg,#7A4E8A26,#B544301A)'],
  g6: ['Sea', 'linear-gradient(160deg,#2E6E8E26,#1E5B4A1F)'],
  g7: ['Sand', 'linear-gradient(160deg,#A9803D26,#B5443014)'],
  g8: ['Moss', 'linear-gradient(160deg,#4E7A5626,#A1720E1A)'],
};
function resolveAreaBg(area) {
  if (!area || !area.bg) return '';
  const v = area.bg;
  if (v === 'wash') return 'linear-gradient(' + area.colour + '2E,' + area.colour + '1A)';
  if (BG_PRESETS[v]) return BG_PRESETS[v][1];
  if (/^#[0-9a-fA-F]{6}$/.test(v)) return 'linear-gradient(' + v + '2E,' + v + '1A)';
  if (v.startsWith('url:')) {
    const u = v.slice(4).replace(/["'()\\\s]/g, '');
    if (/^https?:\/\//.test(u)) {
      return 'linear-gradient(color-mix(in srgb, var(--bg) 78%, transparent), color-mix(in srgb, var(--bg) 86%, transparent)), url("' + u + '") center/cover no-repeat';
    }
  }
  return '';
}
function activeAreaForBg() {
  if (ui.filterArea) return areaOf(ui.filterArea);
  if (ui.filterProject) {
    const p = state.projects.find(p => p.id === ui.filterProject);
    if (p && p.areaId) return areaOf(p.areaId);
  }
  return null;
}

function snapshotBaseline() {
  baseline.tasks = {}; baseline.projects = {}; baseline.areas = {};
  state.tasks.forEach(t => { baseline.tasks[t.id] = JSON.stringify(taskToRow(t)); });
  state.projects.forEach(p => { baseline.projects[p.id] = JSON.stringify(projToRow(p)); });
  state.areas.forEach(a => { baseline.areas[a.id] = JSON.stringify(areaToRow(a)); });
  baseline.settings = JSON.stringify(state.settings);
}

let syncTimer = null, syncInFlight = false, syncFailedOnce = false;
function scheduleSync(delay) {
  clearTimeout(syncTimer);
  syncTimer = setTimeout(runSync, delay || 350);
}

async function runSync() {
  if (!sb || !sbUser) return;
  if (syncInFlight) { scheduleSync(500); return; }
  syncInFlight = true;
  try {
    const kinds = [
      ['tasks', state.tasks, taskToRow],
      ['projects', state.projects, projToRow],
      ['areas', state.areas, areaToRow],
    ];
    for (const [table, list, toRow] of kinds) {
      const seen = new Set();
      const upserts = [];
      for (const item of list) {
        seen.add(item.id);
        const row = toRow(item);
        const js = JSON.stringify(row);
        if (baseline[table][item.id] !== js) upserts.push([item.id, row, js]);
      }
      const deletions = Object.keys(baseline[table]).filter(id => !seen.has(id));
      if (upserts.length) {
        const { error } = await sb.from(table).upsert(upserts.map(u => u[1]));
        if (error) throw error;
        upserts.forEach(u => { baseline[table][u[0]] = u[2]; });
      }
      if (deletions.length) {
        const { error } = await sb.from(table).delete().in('id', deletions);
        if (error) throw error;
        deletions.forEach(id => { delete baseline[table][id]; });
      }
    }
    const sjs = JSON.stringify(state.settings);
    if (baseline.settings !== sjs) {
      const { error } = await sb.from('settings').upsert({ user_id: sbUser.id, data: state.settings });
      if (error) throw error;
      baseline.settings = sjs;
    }
    if (syncFailedOnce) { syncFailedOnce = false; toast('Back online. Everything saved.'); }
    setSyncIndicator(true);
  } catch (e) {
    if (!syncFailedOnce) { syncFailedOnce = true; toast('Cannot reach the cloud. Your changes are kept here and will save when the connection returns.'); }
    setSyncIndicator(false);
    scheduleSync(6000);
  } finally {
    syncInFlight = false;
  }
}

function setSyncIndicator(ok) {
  const el = document.getElementById('syncDot');
  if (el) {
    el.classList.toggle('off', !ok);
    el.title = ok ? 'Synced' : 'Offline: changes waiting to sync';
  }
}

async function fullLoad() {
  const [t, p, a, s] = await Promise.all([
    sb.from('tasks').select('*'),
    sb.from('projects').select('*'),
    sb.from('areas').select('*'),
    sb.from('settings').select('*').maybeSingle(),
  ]);
  if (t.error || p.error || a.error || s.error) {
    toast('Could not load from the cloud; showing this device’s last copy.');
    setSyncIndicator(false);
    return;
  }
  state.tasks = t.data.map(rowToTask);
  state.projects = p.data.map(rowToProj);
  state.areas = a.data.map(rowToArea);
  sortAreas();
  state.settings = Object.assign(defaultSettings(), (s.data && s.data.data) || {});
  snapshotBaseline();
  if (!state.tasks.length && !state.projects.length && !state.areas.length && !s.data) {
    state.areas = seedAreas();
    state.settings = defaultSettings();
    scheduleSync();
  }
  saveCache();
  setSyncIndicator(true);
}

let rtChannel = null;
function subscribeRealtime() {
  if (rtChannel) { sb.removeChannel(rtChannel); rtChannel = null; }
  const apply = (table, rowToX, listKey) => (payload) => {
    const list = state[listKey];
    if (payload.eventType === 'DELETE') {
      const id = payload.old && payload.old.id;
      if (!id) return;
      if (!(id in baseline[table]) && !list.some(x => x.id === id)) return; // echo of our own delete
      state[listKey] = list.filter(x => x.id !== id);
      delete baseline[table][id];
    } else {
      const item = rowToX(payload.new);
      const js = JSON.stringify(table === 'tasks' ? taskToRow(item) : table === 'projects' ? projToRow(item) : areaToRow(item));
      if (baseline[table][item.id] === js) return; // echo of our own write: local state is newer or identical
      const i = list.findIndex(x => x.id === item.id);
      if (i === -1) list.unshift(item); else list[i] = item;
      baseline[table][item.id] = js;
    }
    if (table === 'areas') sortAreas();
    saveCache();
    render();
  };
  rtChannel = sb.channel('sorted-sync')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks', filter: 'user_id=eq.' + sbUser.id }, apply('tasks', rowToTask, 'tasks'))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'projects', filter: 'user_id=eq.' + sbUser.id }, apply('projects', rowToProj, 'projects'))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'areas', filter: 'user_id=eq.' + sbUser.id }, apply('areas', rowToArea, 'areas'))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'settings', filter: 'user_id=eq.' + sbUser.id }, (payload) => {
      if (payload.new && payload.new.data) {
        const incoming = Object.assign(defaultSettings(), payload.new.data);
        if (JSON.stringify(incoming) === baseline.settings) return; // echo of our own write
        state.settings = incoming;
        baseline.settings = JSON.stringify(state.settings);
        saveCache(); render();
      }
    })
    .subscribe();
}

/* ================= Dates ================= */

function todayISO() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function addDaysISO(base, days) {
  const [y, m, dd] = base.split('-').map(Number);
  const d = new Date(y, m - 1, dd + days);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function fmtDue(iso) {
  const t = todayISO();
  if (iso === t) return 'Today';
  if (iso === addDaysISO(t, 1)) return 'Tomorrow';
  if (iso === addDaysISO(t, -1)) return 'Yesterday';
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const opts = { weekday: 'short', day: 'numeric', month: 'short' };
  if (y !== new Date().getFullYear()) opts.year = 'numeric';
  return dt.toLocaleDateString('en-GB', opts);
}
function dueClass(iso) {
  const t = todayISO();
  if (iso < t) return 'overdue';
  if (iso === t) return 'today';
  return '';
}

/* ================= Quick-add parsing ================= */

const DOW = { monday: 1, mon: 1, tuesday: 2, tue: 2, tues: 2, wednesday: 3, wed: 3, thursday: 4, thu: 4, thur: 4, thurs: 4, friday: 5, fri: 5, saturday: 6, sat: 6, sunday: 0, sun: 0 };

function nextDow(target) {
  const now = new Date();
  let diff = (target - now.getDay() + 7) % 7;
  if (diff === 0) diff = 7;
  return addDaysISO(todayISO(), diff);
}

function parseQuickAdd(text) {
  const result = { title: '', due: null, quadrant: null, projectId: null, areaId: null, priority: null };
  let working = text.trim();

  // #Name: match an existing project first, then a group (both allow spaces), else a
  // single word creates a new project (filed under the current group when one is open)
  const hashIdx = working.indexOf('#');
  if (hashIdx !== -1) {
    const after = working.slice(hashIdx + 1);
    let matched = null;
    for (const p of [...state.projects].sort((a, b) => b.name.length - a.name.length)) {
      if (after.toLowerCase().startsWith(p.name.toLowerCase())) {
        const rest = after.slice(p.name.length);
        if (rest === '' || rest[0] === ' ') { matched = p; break; }
      }
    }
    let matchedArea = null;
    if (!matched) {
      for (const a of [...state.areas].sort((x, y) => y.name.length - x.name.length)) {
        if (after.toLowerCase().startsWith(a.name.toLowerCase())) {
          const rest = after.slice(a.name.length);
          if (rest === '' || rest[0] === ' ') { matchedArea = a; break; }
        }
      }
    }
    if (matched) {
      result.projectId = matched.id;
      working = (working.slice(0, hashIdx) + working.slice(hashIdx + 1 + matched.name.length)).trim();
    } else if (matchedArea) {
      result.areaId = matchedArea.id;
      working = (working.slice(0, hashIdx) + working.slice(hashIdx + 1 + matchedArea.name.length)).trim();
    } else {
      const word = after.split(/\s+/)[0];
      if (word) {
        const proj = addProject(word, null, ui.filterArea || null);
        result.projectId = proj.id;
        working = (working.slice(0, hashIdx) + after.slice(word.length)).trim();
      }
    }
  }

  const tokens = working.split(/\s+/).filter(Boolean);
  const keep = [];
  for (let i = 0; i < tokens.length; i++) {
    const tk = tokens[i];
    const low = tk.toLowerCase();
    if (tk === '!!') { result.quadrant = 1; continue; }
    if (tk === '!') { result.quadrant = 2; continue; }
    const pm = tk.match(/^[pP]([1-9])$/);
    if (pm) { result.priority = Number(pm[1]); continue; }
    if (low === 'today' || low === 'tonight') { result.due = todayISO(); continue; }
    if (low === 'tomorrow') { result.due = addDaysISO(todayISO(), 1); continue; }
    if (low === 'next' && tokens[i + 1] && tokens[i + 1].toLowerCase() === 'week') { result.due = addDaysISO(todayISO(), 7); i++; continue; }
    if (Object.prototype.hasOwnProperty.call(DOW, low)) { result.due = nextDow(DOW[low]); continue; }
    const dm = tk.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);
    if (dm) {
      const day = Number(dm[1]), mon = Number(dm[2]);
      if (day >= 1 && day <= 31 && mon >= 1 && mon <= 12) {
        let yr = dm[3] ? Number(dm[3]) : new Date().getFullYear();
        if (yr < 100) yr += 2000;
        let iso = yr + '-' + String(mon).padStart(2, '0') + '-' + String(day).padStart(2, '0');
        if (!dm[3] && iso < todayISO()) iso = (yr + 1) + iso.slice(4);
        result.due = iso;
        continue;
      }
    }
    keep.push(tk);
  }
  result.title = keep.join(' ');
  return result;
}

/* ================= Task ops ================= */

function addProject(name, colour, areaId) {
  const existing = state.projects.find(p => p.name.toLowerCase() === name.toLowerCase());
  if (existing) return existing;
  const colours = ['#1E5B4A', '#B54430', '#A1720E', '#3E5F8A', '#7A4E8A', '#4E7A56', '#8A5B3E'];
  const proj = { id: uid(), name: name, colour: colour || colours[state.projects.length % colours.length], areaId: areaId || null };
  state.projects.push(proj);
  save();
  return proj;
}

function addArea(name) {
  const existing = state.areas.find(a => a.name.toLowerCase() === name.toLowerCase());
  if (existing) return existing;
  const colours = ['#1E5B4A', '#B54430', '#A1720E', '#3E5F8A', '#7A4E8A', '#4E7A56', '#8A5B3E'];
  const area = { id: uid(), name: name, colour: colours[state.areas.length % colours.length], position: state.areas.length };
  state.areas.push(area);
  save();
  return area;
}

function addTask(fields) {
  const t = Object.assign({
    id: uid(), title: '', notes: '', projectId: null, areaId: null, due: null,
    quadrant: null, priority: null, status: 'todo', focus: false, steps: [],
    createdAt: Date.now(), completedAt: null,
  }, fields);
  if (!t.title.trim()) return null;
  state.tasks.unshift(t);
  save();
  return t;
}

function getTask(id) { return state.tasks.find(t => t.id === id); }

function toggleDone(id) {
  const t = getTask(id);
  if (!t) return;
  if (t.status === 'done') {
    t.status = 'todo'; t.completedAt = null;
  } else {
    t.status = 'done'; t.completedAt = Date.now();
  }
  save(); render();
}

function toggleFocus(id) {
  const t = getTask(id);
  if (!t) return;
  t.focus = !t.focus;
  save(); render();
}

function deleteTask(id) {
  state.tasks = state.tasks.filter(t => t.id !== id);
  save(); render();
}

function projectOf(t) { return state.projects.find(p => p.id === t.projectId) || null; }
function areaOf(id) { return state.areas.find(a => a.id === id) || null; }
function taskAreaId(t) {
  const p = projectOf(t);
  return p ? (p.areaId || null) : (t.areaId || null);
}

/* ================= Filtering ================= */

function visibleTasks() {
  let list = state.tasks;
  if (ui.filterProject) list = list.filter(t => t.projectId === ui.filterProject);
  else if (ui.filterArea) list = list.filter(t => taskAreaId(t) === ui.filterArea);
  if (ui.search.trim()) {
    const q = ui.search.trim().toLowerCase();
    list = list.filter(t => t.title.toLowerCase().includes(q) || (t.notes || '').toLowerCase().includes(q));
  }
  return list;
}
function openTasks() { return visibleTasks().filter(t => t.status !== 'done'); }
function doneTasks() { return visibleTasks().filter(t => t.status === 'done').sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0)); }

function sortByDue(a, b) {
  if (a.due && b.due && a.due !== b.due) return a.due < b.due ? -1 : 1;
  if (a.due && !b.due) return -1;
  if (!a.due && b.due) return 1;
  return a.createdAt - b.createdAt;
}
function sortByAdded(a, b) { return b.createdAt - a.createdAt; }
function listSort() { return ui.sortBy === 'added' ? sortByAdded : sortByDue; }

const STATUSES = [
  { key: 'todo', name: 'To do' },
  { key: 'doing', name: 'In progress' },
  { key: 'waiting', name: 'Waiting on' },
  { key: 'done', name: 'Done' },
];

function statusName(key) { const s = STATUSES.find(s => s.key === key); return s ? s.name : key; }

function taskRowHTML(t, opts) {
  opts = opts || {};
  const proj = projectOf(t);
  const meta = [];
  if (proj && !opts.hideProject) {
    meta.push('<span class="m-proj"><span class="proj-dot" style="background:' + proj.colour + '"></span>' + esc(proj.name) + '</span>');
  }
  if (!proj && t.areaId && !opts.hideArea) {
    const area = areaOf(t.areaId);
    if (area) meta.push('<span class="m-proj"><span class="proj-dot" style="background:' + area.colour + '"></span>' + esc(area.name) + '</span>');
  }
  if (t.due && !opts.hideDue) {
    meta.push('<span class="m-due ' + dueClass(t.due) + '">' + esc(fmtDue(t.due)) + '</span>');
  }
  if (t.priority && !opts.hidePriority) {
    const pcls = t.priority >= 1 && t.priority <= 4 ? 'q' + (t.priority === 2 ? 3 : t.priority === 3 ? 2 : t.priority) : 'q4';
    meta.push('<span class="chip ' + pcls + '">P' + t.priority + '</span>');
  }
  if (t.quadrant && !opts.hideQuad) {
    meta.push('<span class="chip q' + t.quadrant + '">' + esc(state.settings.quadNames[t.quadrant - 1]) + '</span>');
  }
  if (!opts.hideStatus && (t.status === 'doing' || t.status === 'waiting')) {
    meta.push('<span class="chip st">' + esc(statusName(t.status)) + '</span>');
  }
  const stepTotal = (t.steps || []).length;
  if (stepTotal) {
    const stepDone = t.steps.filter(s => s.done).length;
    meta.push('<span title="Steps">' + stepDone + ' of ' + stepTotal + '</span>');
  }
  if (t.notes) {
    meta.push('<span title="Has notes">&#9998;</span>');
  }
  const doneCls = t.status === 'done' ? ' done-row' : '';
  let tint = '';
  if (state.settings.groupTint) {
    const tintArea = areaOf(taskAreaId(t));
    if (tintArea) tint = ' style="border-left:3px solid ' + tintArea.colour + ';background-image:linear-gradient(' + tintArea.colour + '1F,' + tintArea.colour + '1F)"';
  }
  return '<div class="task-row' + doneCls + '"' + tint + ' draggable="true" data-task="' + t.id + '" role="button" tabindex="0">' +
    '<button class="check' + (t.status === 'done' ? ' checked' : '') + '" data-act="done" aria-label="Mark complete">' + ICONS.tick + '</button>' +
    '<div class="t-body"><div class="t-title">' + esc(t.title) + '</div>' +
    (meta.length ? '<div class="t-meta">' + meta.join('') + '</div>' : '') +
    '</div>' +
    '<button class="star-btn' + (t.focus ? ' on' : '') + '" data-act="focus" aria-label="Toggle Today focus" title="Add to Today">' + (t.focus ? ICONS.star : ICONS.starOff) + '</button>' +
    '</div>';
}

function rowsHTML(list, opts) { return list.map(t => taskRowHTML(t, opts)).join(''); }

/* ================= Views ================= */

const VIEWS = [
  { key: 'today', name: 'Today' },
  { key: 'list', name: 'List' },
  { key: 'matrix', name: 'Matrix' },
  { key: 'board', name: 'Board' },
  { key: 'priority', name: 'Priority' },
];

function renderSidebar() {
  const open = state.tasks.filter(t => t.status !== 'done');
  const counts = {
    today: open.filter(t => t.focus || (t.due && t.due <= todayISO())).length,
    list: open.length,
    matrix: open.filter(t => !t.quadrant).length,
    board: open.filter(t => t.status === 'doing').length,
    priority: open.filter(t => t.priority).length,
  };
  const countLabel = { today: '', list: '', matrix: ' unsorted', board: ' active', priority: ' prioritised' };
  let html = '<div class="brand">Sorted<span class="dot">.</span></div>';
  for (const v of VIEWS) {
    const c = counts[v.key];
    html += '<button class="nav-btn' + (ui.view === v.key ? ' active' : '') + '" data-view="' + v.key + '">' +
      ICONS[v.key] + v.name +
      (c ? '<span class="nav-count" title="' + c + countLabel[v.key] + '">' + c + '</span>' : '') +
      '</button>';
  }
  const projBtn = (p, indent) => {
    const c = state.tasks.filter(t => t.projectId === p.id && t.status !== 'done').length;
    return '<button class="proj-btn' + (indent ? ' indent' : '') + (ui.filterProject === p.id ? ' active' : '') + '" data-proj="' + p.id + '">' +
      '<span class="proj-dot" style="background:' + p.colour + '"></span><span class="proj-name">' + esc(p.name) + '</span>' +
      (c ? '<span class="nav-count">' + c + '</span>' : '') + '</button>';
  };
  html += '<div class="side-label">Groups <button data-addproj title="New project" aria-label="New project">+</button></div>';
  const collapsed = state.settings.collapsed || [];
  for (const a of state.areas) {
    const c = open.filter(t => taskAreaId(t) === a.id).length;
    const isCollapsed = collapsed.includes(a.id);
    html += '<div class="area-row">' +
      '<button class="proj-btn' + (ui.filterArea === a.id ? ' active' : '') + '" data-area="' + a.id + '">' +
      '<span class="proj-dot" style="background:' + a.colour + '"></span><span class="proj-name">' + esc(a.name) + '</span>' +
      (c ? '<span class="nav-count">' + c + '</span>' : '') + '</button>' +
      '<button class="kebab" data-astyle="' + a.id + '" title="Group backdrop" aria-label="Backdrop for ' + esc(a.name) + '">&#8943;</button>' +
      '<button class="caret" data-caret="' + a.id + '" aria-label="' + (isCollapsed ? 'Expand' : 'Collapse') + ' ' + esc(a.name) + '">' + (isCollapsed ? '&#9656;' : '&#9662;') + '</button>' +
      '</div>';
    if (!isCollapsed) {
      for (const p of state.projects.filter(p => p.areaId === a.id)) html += projBtn(p, true);
    }
  }
  const unfiled = state.projects.filter(p => !p.areaId);
  if (unfiled.length) {
    html += '<div class="side-label">Other projects</div>';
    for (const p of unfiled) html += projBtn(p, false);
  }
  const doneCount = state.tasks.filter(t => t.status === 'done').length;
  html += '<div class="sidebar-foot">' +
    '<button class="nav-btn' + (ui.view === 'done' ? ' active' : '') + '" data-view="done">' + ICONS.done + 'Completed' +
    (doneCount ? '<span class="nav-count">' + doneCount + '</span>' : '') + '</button>' +
    '<button class="nav-btn" data-openset>' +
    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M4 21h16"></path></svg>' +
    'Backup &amp; settings</button></div>';
  document.getElementById('sidebar').innerHTML = html;
}

function renderTabbar() {
  let html = '';
  for (const v of VIEWS) {
    html += '<button class="tab' + (ui.view === v.key ? ' active' : '') + '" data-view="' + v.key + '">' + ICONS[v.key] + v.name + '</button>';
  }
  html += '<button class="tab" data-openset><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M4 21h16"></path></svg>More</button>';
  document.getElementById('tabbar').innerHTML = html;
}

function viewTitle() {
  if (ui.filterProject) {
    const p = state.projects.find(p => p.id === ui.filterProject);
    if (p) return esc(p.name);
  }
  if (ui.filterArea) {
    const a = areaOf(ui.filterArea);
    if (a) return esc(a.name);
  }
  if (ui.view === 'done') return 'Completed';
  const v = VIEWS.find(v => v.key === ui.view);
  return v ? v.name : '';
}

function renderChipbar() {
  let html = '<button class="chip-f' + (!ui.filterArea && !ui.filterProject ? ' on' : '') + '" data-all>All</button>';
  const activeProj = ui.filterProject ? state.projects.find(p => p.id === ui.filterProject) : null;
  for (const a of state.areas) {
    const expanded = ui.filterArea === a.id || (activeProj && activeProj.areaId === a.id);
    html += '<button class="chip-f' + (ui.filterArea === a.id ? ' on' : '') + '" data-area="' + a.id + '">' +
      '<span class="proj-dot" style="background:' + a.colour + '"></span>' + esc(a.name) + '</button>';
    if (expanded) {
      for (const p of state.projects.filter(p => p.areaId === a.id)) {
        html += '<button class="chip-f' + (ui.filterProject === p.id ? ' on' : '') + '" data-proj="' + p.id + '">' + esc(p.name) + '</button>';
      }
    }
  }
  for (const p of state.projects.filter(p => !p.areaId)) {
    html += '<button class="chip-f' + (ui.filterProject === p.id ? ' on' : '') + '" data-proj="' + p.id + '">' +
      '<span class="proj-dot" style="background:' + p.colour + '"></span>' + esc(p.name) + '</button>';
  }
  document.getElementById('chipbar').innerHTML = html;
}

function render() {
  renderSidebar();
  renderTabbar();
  renderChipbar();
  const titleEl = document.getElementById('viewTitle');
  const t = todayISO();
  const [y, m, d] = t.split('-').map(Number);
  const dateStr = new Date(y, m - 1, d).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  titleEl.innerHTML = viewTitle() + (ui.view === 'today' && !ui.filterProject ? '<span class="view-sub">' + dateStr + '</span>' : '');
  const el = document.getElementById('content');

  else if (ui.view === 'matrix') el.innerHTML = renderMatrix();

/* ----- Priority ----- */

function whereLabel(t) {
  const proj = projectOf(t);
  if (proj) return '<span class="m-proj"><span class="proj-dot" style="background:' + proj.colour + '"></span>' + esc(proj.name) + '</span>';
  const area = t.areaId ? areaOf(t.areaId) : null;
  if (area) return '<span class="m-proj"><span class="proj-dot" style="background:' + area.colour + '"></span>' + esc(area.name) + '</span>';
  return '<span style="color:var(--ink-faint)">&ndash;</span>';
}

function renderPriority() {
  const items = openTasks().filter(t => t.priority)
    .sort((a, b) => (a.priority - b.priority) || sortByDue(a, b));
  if (!items.length) {
    return '<div class="empty"><div class="e-big">No priorities set.</div>' +
      'Give a task a priority from 1 to 4 in its editor, or type <b>p1</b> to <b>p4</b> when adding one, e.g. "Chase arrears p1". Only prioritised work appears here.</div>';
  }
  let html = '<div class="table-wrap"><table class="ptable"><thead><tr>' +
    '<th style="width:36px"></th><th style="width:52px">Pri</th><th>Task</th><th>Where</th><th style="width:110px">Due</th>' +
    '</tr></thead><tbody>';
  for (const t of items) {
    const pcls = t.priority >= 1 && t.priority <= 4 ? 'pri-' + t.priority : 'pri-4';
    html += '<tr data-task="' + t.id + '" tabindex="0">' +
      '<td><button class="check" data-act="done" aria-label="Mark complete">' + ICONS.tick + '</button></td>' +
      '<td><span class="pri-badge ' + pcls + '">' + t.priority + '</span></td>' +
      '<td><div class="t-title" style="font-weight:500">' + esc(t.title) + '</div>' +
      (t.quadrant ? '<span class="chip q' + t.quadrant + '" style="margin-top:3px">' + esc(state.settings.quadNames[t.quadrant - 1]) + '</span>' : '') +
      '</td>' +
      '<td>' + whereLabel(t) + '</td>' +
      '<td class="num"><span class="m-due ' + (t.due ? dueClass(t.due) : '') + '">' + (t.due ? esc(fmtDue(t.due)) : '&ndash;') + '</span></td>' +
      '</tr>';
  }
  html += '</tbody></table></div>';
  html += '<div class="drag-hint" style="padding-top:10px">Priority is your own ranking of what matters today, separate from the matrix. Completed tasks leave this table automatically.</div>';
  return html;
}

/* ----- Completed archive ----- */

function renderArchive() {
  const done = doneTasks();
  if (!done.length) {
    return '<div class="empty"><div class="e-big">Nothing completed yet.</div>Finished tasks are kept here automatically. Tick a task anywhere in the app to complete it.</div>';
  }
  const t = todayISO();
  const dayOf = (ms) => {
    const d = new Date(ms);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  };
  const buckets = [
    ['Today', x => dayOf(x.completedAt || 0) === t],
    ['Yesterday', x => dayOf(x.completedAt || 0) === addDaysISO(t, -1)],
    ['Past week', x => { const d = dayOf(x.completedAt || 0); return d < addDaysISO(t, -1) && d >= addDaysISO(t, -7); }],
    ['Past month', x => { const d = dayOf(x.completedAt || 0); return d < addDaysISO(t, -7) && d >= addDaysISO(t, -31); }],
    ['Older', x => dayOf(x.completedAt || 0) < addDaysISO(t, -31)],
  ];
  let html = '<div class="drag-hint">Everything you finish is kept here. Untick a task to bring it back; use Backup &amp; settings to clear the archive.</div>';
  for (const [name, fn] of buckets) {
    const items = done.filter(fn);
    if (!items.length) continue;
    html += '<div class="group-head">' + name + ' <span class="g-count">' + items.length + '</span></div>' + rowsHTML(items);
  }
  return html;
}

/* ----- Today ----- */

function renderToday() {
  const open = openTasks();
  const t = todayISO();
  const weekEnd = addDaysISO(t, 7);
  const focus = open.filter(x => x.focus).sort(sortByDue);
  const overdue = open.filter(x => !x.focus && x.due && x.due < t).sort(sortByDue);
  const today = open.filter(x => !x.focus && x.due === t).sort(sortByDue);
  const week = open.filter(x => !x.focus && x.due && x.due > t && x.due <= weekEnd).sort(sortByDue);
  let html = '';
  if (focus.length) html += '<div class="group-head">Focus <span class="g-count">' + focus.length + '</span></div>' + rowsHTML(focus);
  if (overdue.length) html += '<div class="group-head" style="color:var(--q1)">Overdue <span class="g-count">' + overdue.length + '</span></div>' + rowsHTML(overdue);
  if (today.length) html += '<div class="group-head">Due today <span class="g-count">' + today.length + '</span></div>' + rowsHTML(today);
  if (week.length) html += '<div class="group-head">This week <span class="g-count">' + week.length + '</span></div>' + rowsHTML(week);
  if (!html) {
    html = '<div class="empty"><div class="e-big">A clear day.</div>Nothing due or flagged for now. Star a task with the &#9734; to bring it here, or add one above.</div>';
  }
  return html;
}

/* ----- List ----- */

function applyListFilters(list) {
  let out = list;
  if (ui.fQuad !== '') out = out.filter(t => ui.fQuad === '0' ? !t.quadrant : t.quadrant === Number(ui.fQuad));
  if (ui.fPri !== '') out = out.filter(t => ui.fPri === '0' ? !t.priority : t.priority === Number(ui.fPri));
  if (ui.fStatus !== '') out = out.filter(t => t.status === ui.fStatus);
  return out;
}

function renderList() {
  const open = applyListFilters(openTasks());
  const done = doneTasks();
  const s = state.settings;
  const filtersOn = ui.fQuad !== '' || ui.fPri !== '' || ui.fStatus !== '';
  const inColumns = ui.layout === 'columns';
  let html = '<div class="toolbar">' +
    (inColumns ? '' : '<span class="tool-label">Group by</span><div class="seg">' +
    ['project', 'due', 'quadrant'].map(g =>
      '<button class="' + (ui.groupBy === g ? 'on' : '') + '" data-group="' + g + '">' + (g === 'project' ? 'Project' : g === 'due' ? 'Due date' : 'Quadrant') + '</button>'
    ).join('') + '</div>') +
    '<span class="tool-label">Sort</span><div class="seg">' +
    '<button class="' + (ui.sortBy === 'due' ? 'on' : '') + '" data-sort="due">Due date</button>' +
    '<button class="' + (ui.sortBy === 'added' ? 'on' : '') + '" data-sort="added">Newest</button></div>' +
    '<div class="seg">' +
    '<button class="' + (ui.layout === 'rows' ? 'on' : '') + '" data-layout="rows">Rows</button>' +
    '<button class="' + (ui.layout === 'tiles' ? 'on' : '') + '" data-layout="tiles">Tiles</button>' +
    '<button class="' + (inColumns ? 'on' : '') + '" data-layout="columns">Columns</button></div>';
  if (ui.filterProject) html += '<button class="link-btn" data-clearproj>Show all projects</button>';
  html += '</div>';
  html += '<div class="toolbar"><span class="tool-label">Filter</span>' +
    '<select class="mini-select" data-f="fQuad" aria-label="Filter by quadrant"><option value="">Any quadrant</option>' +
    QUADS.map(q => '<option value="' + q + '"' + (ui.fQuad === String(q) ? ' selected' : '') + '>' + esc(s.quadNames[q - 1]) + '</option>').join('') +
    '<option value="0"' + (ui.fQuad === '0' ? ' selected' : '') + '>Unsorted</option></select>' +
    '<select class="mini-select" data-f="fPri" aria-label="Filter by priority"><option value="">Any priority</option>' +
    [1, 2, 3, 4].map(p => '<option value="' + p + '"' + (ui.fPri === String(p) ? ' selected' : '') + '>P' + p + '</option>').join('') +
    '<option value="0"' + (ui.fPri === '0' ? ' selected' : '') + '>No priority</option></select>' +
    '<select class="mini-select" data-f="fStatus" aria-label="Filter by status"><option value="">Any status</option>' +
    STATUSES.filter(st => st.key !== 'done').map(st => '<option value="' + st.key + '"' + (ui.fStatus === st.key ? ' selected' : '') + '>' + st.name + '</option>').join('') + '</select>' +
    (filtersOn ? '<button class="link-btn" data-clearfilters>Clear filters</button>' : '') +
    '</div>';

  if (!open.length && !done.length) {
    return html + '<div class="empty"><div class="e-big">' + (filtersOn ? 'Nothing matches those filters.' : 'Nothing here yet.') + '</div>' + (filtersOn ? 'Loosen or clear the filters above.' : 'Add your first task in the bar above. Use #Project to file it as you go.') + '</div>';
  }

  const wrap = (items, opts) => {
    const inner = rowsHTML([...items].sort(listSort()), opts);
    return ui.layout === 'tiles' ? '<div class="tile-grid">' + inner + '</div>' : inner;
  };

  if (inColumns) {
    const cols = state.areas.map(a => ({ id: a.id, name: a.name, colour: a.colour }));
    const otherItems = open.filter(t => !taskAreaId(t));
    if (otherItems.length) cols.push({ id: null, name: 'Other', colour: null });
    html += '<div class="board" style="grid-template-columns:repeat(' + cols.length + ',minmax(250px,1fr))">';
    for (const c of cols) {
      const items = open.filter(t => taskAreaId(t) === c.id).sort(listSort());
      const colBg = c.id ? resolveAreaBg(areaOf(c.id)) : '';
      html += '<div class="col"' + (colBg ? ' style="background:' + (colBg + ' var(--surface-2)').replace(/"/g, '&quot;') + '"' : '') + '>' +
        '<div class="col-head">' + (c.colour ? '<span class="g-dot" style="background:' + c.colour + ';width:10px;height:10px;border-radius:50%"></span>' : '') + esc(c.name) +
        '<span class="q-count">' + items.length + '</span></div>' +
        rowsHTML(items, { hideArea: true }) +
        (items.length ? '' : '<div class="empty" style="padding:16px 8px;font-size:13px">Nothing here</div>') +
        '</div>';
    }
    html += '</div>';
    if (done.length) {
      html += '<div class="toolbar" style="margin-top:18px"><button class="link-btn" data-toggledone>' + (ui.showDone ? 'Hide' : 'Show') + ' completed (' + done.length + ')</button></div>';
      if (ui.showDone) html += rowsHTML(done.slice(0, 100));
    }
    return html;
  }

  if (ui.groupBy === 'project') {
    for (const a of [...state.areas, null]) {
      const aid = a ? a.id : null;
      const direct = open.filter(t => !t.projectId && (t.areaId || null) === aid);
      const blocks = [];
      for (const p of state.projects.filter(p => (p.areaId || null) === aid)) {
        const items = open.filter(t => t.projectId === p.id);
        if (items.length) blocks.push({ p, items });
      }
      if (!blocks.length && !direct.length) continue;
      const total = direct.length + blocks.reduce((n, b) => n + b.items.length, 0);
      html += '<div class="group-head">' +
        (a ? '<span class="g-dot" style="background:' + a.colour + '"></span>' + esc(a.name) : 'Other') +
        ' <span class="g-count">' + total + '</span></div>';
      if (direct.length) html += wrap(direct, { hideProject: true, hideArea: true });
      for (const b of blocks) {
        html += '<div class="sub-head"><span class="g-dot" style="background:' + b.p.colour + '"></span>' + esc(b.p.name) + ' <span class="g-count">' + b.items.length + '</span></div>' + wrap(b.items, { hideProject: true });
      }
    }
  } else if (ui.groupBy === 'due') {
    const t = todayISO();
    const buckets = [
      ['Overdue', x => x.due && x.due < t],
      ['Today', x => x.due === t],
      ['Tomorrow', x => x.due === addDaysISO(t, 1)],
      ['This week', x => x.due && x.due > addDaysISO(t, 1) && x.due <= addDaysISO(t, 7)],
      ['Later', x => x.due && x.due > addDaysISO(t, 7)],
      ['No date', x => !x.due],
    ];
    for (const [name, fn] of buckets) {
      const items = open.filter(fn);
      if (!items.length) continue;
      const style = name === 'Overdue' ? ' style="color:var(--q1)"' : '';
      html += '<div class="group-head"' + style + '>' + name + ' <span class="g-count">' + items.length + '</span></div>' + wrap(items);
    }
  } else {
    for (const q of QUADS) {
      const items = open.filter(x => x.quadrant === q);
      if (!items.length) continue;
      html += '<div class="group-head"><span class="g-dot" style="background:var(--q' + q + ')"></span>' + esc(state.settings.quadNames[q - 1]) + ' <span class="g-count">' + items.length + '</span></div>' + wrap(items, { hideQuad: true });
    }
    const unsorted = open.filter(x => !x.quadrant);
    if (unsorted.length) html += '<div class="group-head">Not yet sorted <span class="g-count">' + unsorted.length + '</span></div>' + wrap(unsorted);
  }

  if (done.length) {
    html += '<div class="toolbar" style="margin-top:18px"><button class="link-btn" data-toggledone>' + (ui.showDone ? 'Hide' : 'Show') + ' completed (' + done.length + ')</button></div>';
    if (ui.showDone) html += ui.layout === 'tiles' ? '<div class="tile-grid">' + rowsHTML(done.slice(0, 100)) + '</div>' : rowsHTML(done.slice(0, 100));
  }
  return html;
}

/* ----- Matrix ----- */

function renderMatrix() {
  const open = openTasks();
  const s = state.settings;
  const unsorted = open.filter(t => !t.quadrant).sort(sortByDue);
  const isTouch = window.matchMedia('(pointer: coarse)').matches;
  let html = '<div class="drag-hint">' + (isTouch ? 'Tap a task to file it in a quadrant.' : 'Drag tasks between quadrants, or tap to edit.') + '</div>';
  html += '<div class="matrix-wrap">';
  html += '<div></div><div class="ax horiz">' + esc(s.axisX[0]) + '</div><div class="ax horiz">' + esc(s.axisX[1]) + '</div>';
  const cells = [
    { q: 1, axis: s.axisY[0] }, { q: 2, axis: null },
    { q: 3, axis: s.axisY[1] }, { q: 4, axis: null },
  ];
  const axesFor = (q) => esc(s.axisX[q === 1 || q === 3 ? 0 : 1]) + ' &middot; ' + esc(s.axisY[q <= 2 ? 0 : 1]);
  for (const c of cells) {
    if (c.axis !== null) html += '<div class="ax vert">' + esc(c.axis) + '</div>';
    const items = open.filter(t => t.quadrant === c.q).sort(sortByDue);
    html += '<div class="quad qc' + c.q + '" data-quad="' + c.q + '">' +
      '<div class="quad-head"><span class="q-mark" style="background:var(--q' + c.q + ')"></span>' + esc(s.quadNames[c.q - 1]) +
      '<span class="q-axes">' + axesFor(c.q) + '</span>' +
      '<span class="q-count">' + items.length + '</span></div>' +
      '<div class="quad-body">' + rowsHTML(items, { hideQuad: true }) +
      (items.length ? '' : '<div class="empty" style="padding:18px 8px;font-size:13px">Drop tasks here</div>') +
      '</div></div>';
  }
  html += '</div>';
  html += '<div class="tray" data-quad="0"><div class="tray-head">To be sorted <span>' + unsorted.length + (unsorted.length === 1 ? ' task' : ' tasks') + '</span></div>' +
    (unsorted.length ? rowsHTML(unsorted, { hideQuad: true }) : '<div class="empty" style="padding:10px;font-size:13px">Everything is sorted. New tasks land here first.</div>') +
    '</div>';
  return html;
}

/* ----- Board ----- */

function renderBoard() {
  const open = openTasks();
  const done = doneTasks();
  let html = '<div class="drag-hint">' + (window.matchMedia('(pointer: coarse)').matches ? 'Tap a task to change its status.' : 'Drag tasks across columns as work moves.') + '</div>';
  html += '<div class="board">';
  for (const st of STATUSES) {
    const items = st.key === 'done' ? done.slice(0, 30) : open.filter(t => t.status === st.key).sort(sortByDue);
    html += '<div class="col" data-status="' + st.key + '">' +
      '<div class="col-head">' + esc(st.name) + '<span class="q-count">' + items.length + '</span></div>' +
      rowsHTML(items, { hideStatus: true }) +
      '</div>';
  }
  html += '</div>';
  return html;
}

/* ================= Modals ================= */

function closeModal() {
  document.getElementById('modalRoot').innerHTML = '';
  ui.editingId = null;
}

function openEdit(id) {
  const t = getTask(id);
  if (!t) return;
  ui.editingId = id;
  const s = state.settings;
  const projOpts = ['<option value="">No project</option>'].concat(
    state.projects.map(p => '<option value="' + p.id + '"' + (t.projectId === p.id ? ' selected' : '') + '>' + esc(p.name) + '</option>')
  ).join('');
  const areaOpts = ['<option value="">No group</option>'].concat(
    state.areas.map(a => '<option value="' + a.id + '"' + (t.areaId === a.id ? ' selected' : '') + '>' + esc(a.name) + '</option>')
  ).join('');
  const quadBtns = QUADS.map(q =>
    '<button class="pick q' + q + (t.quadrant === q ? ' on' : '') + '" data-quad="' + q + '">' + esc(s.quadNames[q - 1]) + '</button>'
  ).join('') + '<button class="pick' + (!t.quadrant ? ' on' : '') + '" data-quad="0">Unsorted</button>';
  const statBtns = STATUSES.map(st =>
    '<button class="pick' + (t.status === st.key ? ' on' : '') + '" data-status="' + st.key + '">' + st.name + '</button>'
  ).join('');
  const priBtns = [1, 2, 3, 4].map(p =>
    '<button class="pick' + (t.priority === p ? ' on' : '') + '" data-pri="' + p + '">P' + p + '</button>'
  ).join('') + '<button class="pick' + (!t.priority ? ' on' : '') + '" data-pri="0">None</button>';
  document.getElementById('modalRoot').innerHTML =
    '<div class="overlay" data-close>' +
    '<div class="sheet" role="dialog" aria-label="Edit task">' +
    '<h2>Edit task</h2>' +
    '<div class="f-row"><label class="f-label" for="etTitle">Task</label><input class="f-input" id="etTitle" value="' + esc(t.title) + '"></div>' +
    '<div class="f-row"><span class="f-label">Steps</span><div id="etSteps"></div>' +
    '<div style="display:flex;gap:6px;margin-top:4px"><input class="f-input" id="etStepNew" placeholder="Break the task into steps"><button class="pick" id="etStepAdd">Add</button></div></div>' +
    '<div class="f-row"><label class="f-label" for="etNotes">Notes</label><textarea class="f-textarea" id="etNotes">' + esc(t.notes || '') + '</textarea></div>' +
    '<div class="f-row" style="display:flex;gap:10px;flex-wrap:wrap">' +
    '<div style="flex:1;min-width:140px"><label class="f-label" for="etProj">Project</label><select class="f-select" id="etProj">' + projOpts + '</select></div>' +
    '<div style="flex:1;min-width:140px"><label class="f-label" for="etArea" title="Used when the task has no project">Group</label><select class="f-select" id="etArea">' + areaOpts + '</select></div>' +
    '<div style="flex:1;min-width:140px"><label class="f-label" for="etDue">Due date</label><input class="f-input" id="etDue" type="date" value="' + (t.due || '') + '"></div>' +
    '</div>' +
    '<div class="f-row"><span class="f-label">Quadrant</span><div class="pick-row" id="etQuads">' + quadBtns + '</div></div>' +
    '<div class="f-row"><span class="f-label" title="Your own 1 to 4 ranking, shown in the Priority view">Priority</span><div class="pick-row" id="etPris">' + priBtns + '</div></div>' +
    '<div class="f-row"><span class="f-label">Status</span><div class="pick-row" id="etStats">' + statBtns + '</div></div>' +
    '<div class="f-row"><span class="f-label">Today list</span><button class="pick' + (t.focus ? ' on' : '') + '" id="etFocus">' + (t.focus ? '&#9733; In Today focus' : '&#9734; Add to Today focus') + '</button></div>' +
    '<div class="sheet-actions">' +
    '<button class="btn-danger" id="etDelete">Delete</button>' +
    '<button class="btn-quiet" data-close-btn>Cancel</button>' +
    '<button class="btn-primary" id="etSave">Save</button>' +
    '</div></div></div>';

  const root = document.getElementById('modalRoot');
  const local = { quadrant: t.quadrant, status: t.status, focus: t.focus, priority: t.priority, deleteArmed: false,
    steps: (t.steps || []).map(s => ({ id: s.id || uid(), title: s.title, done: !!s.done })) };

  const renderSteps = () => {
    const box = root.querySelector('#etSteps');
    box.innerHTML = local.steps.map(s =>
      '<div class="step-row' + (s.done ? ' done' : '') + '" data-sid="' + s.id + '">' +
      '<button class="check' + (s.done ? ' checked' : '') + '" data-stoggle aria-label="Toggle step">' + ICONS.tick + '</button>' +
      '<span class="step-title">' + esc(s.title) + '</span>' +
      '<button class="step-del" data-sdel aria-label="Remove step">&times;</button></div>'
    ).join('') || '<div style="font-size:13px;color:var(--ink-faint);padding:2px 0">No steps yet. Steps let one task hold its sub-activities.</div>';
  };
  renderSteps();
  root.querySelector('#etSteps').addEventListener('click', (e) => {
    const row = e.target.closest('[data-sid]');
    if (!row) return;
    const s = local.steps.find(x => x.id === row.dataset.sid);
    if (!s) return;
    if (e.target.closest('[data-stoggle]')) { s.done = !s.done; renderSteps(); }
    if (e.target.closest('[data-sdel]')) { local.steps = local.steps.filter(x => x.id !== s.id); renderSteps(); }
  });
  const addStep = () => {
    const inp = root.querySelector('#etStepNew');
    const v = inp.value.trim();
    if (!v) return;
    local.steps.push({ id: uid(), title: v, done: false });
    inp.value = ''; inp.focus();
    renderSteps();
  };
  root.querySelector('#etStepAdd').addEventListener('click', addStep);
  root.querySelector('#etStepNew').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addStep(); } });

  root.querySelector('.overlay').addEventListener('click', (e) => {
    if (e.target.dataset.close !== undefined && e.target.classList.contains('overlay')) closeModal();
  });
  root.querySelector('[data-close-btn]').addEventListener('click', closeModal);

  root.querySelector('#etQuads').addEventListener('click', (e) => {
    const b = e.target.closest('[data-quad]');
    if (!b) return;
    local.quadrant = Number(b.dataset.quad) || null;
    root.querySelectorAll('#etQuads .pick').forEach(x => x.classList.toggle('on', (Number(x.dataset.quad) || null) === local.quadrant));
  });
  root.querySelector('#etPris').addEventListener('click', (e) => {
    const b = e.target.closest('[data-pri]');
    if (!b) return;
    local.priority = Number(b.dataset.pri) || null;
    root.querySelectorAll('#etPris .pick').forEach(x => x.classList.toggle('on', (Number(x.dataset.pri) || null) === local.priority));
  });
  root.querySelector('#etStats').addEventListener('click', (e) => {
    const b = e.target.closest('[data-status]');
    if (!b) return;
    local.status = b.dataset.status;
    root.querySelectorAll('#etStats .pick').forEach(x => x.classList.toggle('on', x.dataset.status === local.status));
  });
  root.querySelector('#etFocus').addEventListener('click', (e) => {
    local.focus = !local.focus;
    e.currentTarget.classList.toggle('on', local.focus);
    e.currentTarget.innerHTML = local.focus ? '&#9733; In Today focus' : '&#9734; Add to Today focus';
  });
  root.querySelector('#etDelete').addEventListener('click', (e) => {
    if (!local.deleteArmed) {
      local.deleteArmed = true;
      e.currentTarget.textContent = 'Really delete?';
      return;
    }
    deleteTask(t.id);
    closeModal();
    toast('Task deleted');
  });
  root.querySelector('#etSave').addEventListener('click', () => {
    const title = root.querySelector('#etTitle').value.trim();
    if (!title) { toast('The task needs a title'); return; }
    t.title = title;
    t.notes = root.querySelector('#etNotes').value.trim();
    t.projectId = root.querySelector('#etProj').value || null;
    t.areaId = root.querySelector('#etArea').value || null;
    t.due = root.querySelector('#etDue').value || null;
    t.quadrant = local.quadrant;
    t.priority = local.priority;
    t.focus = local.focus;
    t.steps = local.steps;
    if (local.status !== t.status) {
      t.status = local.status;
      t.completedAt = t.status === 'done' ? Date.now() : null;
    }
    save(); closeModal(); render();
  });
  root.querySelector('#etTitle').focus();
}

  const areaOpts = ['<option value="">No group</option>'].concat(
    state.areas.map(a => '<option value="' + a.id + '"' + (ui.filterArea === a.id ? ' selected' : '') + '>' + esc(a.name) + '</option>')

    '<div class="sheet-actions">' +
    '<button class="btn-quiet" data-close-btn>Cancel</button>' +

function openBulkAdd() {
  document.getElementById('modalRoot').innerHTML =
    '<div class="overlay" data-close>' +
    '<div class="sheet" role="dialog" aria-label="Add several tasks">' +
    '<h2>Add several tasks</h2>' +
    '<div class="f-row"><label class="f-label" for="baText">One task per line</label>' +
    '<textarea class="f-textarea" id="baText" style="min-height:160px" placeholder="Call plumber tomorrow #Office !!\nReview lease friday #Legal !\nOrder tile samples 12/8"></textarea>' +
    '<div style="font-size:12.5px;color:var(--ink-faint);margin-top:8px">Paste from anywhere, including an Excel column. The same shortcuts work on each line: dates like <b>tomorrow</b> or <b>12/8</b>, <b>#Project</b>, <b>!</b> important, <b>!!</b> urgent and important.</div>' +
    '</div>' +

  root.querySelector('.overlay').addEventListener('click', (e) => {
    if (e.target.classList.contains('overlay')) closeModal();
  });
  root.querySelector('[data-close-btn]').addEventListener('click', closeModal);
  root.querySelector('#baGo').addEventListener('click', () => {
    const lines = root.querySelector('#baText').value.split(/\r?\n/);
    let added = 0, skipped = 0;
    for (const line of lines) {
      const clean = line.replace(/\t/g, ' ').replace(/^\s*(?:[-*•]|\d+[.)])\s+/, '').trim();
      if (!clean) continue;
      const parsed = parseQuickAdd(clean);
      if (!parsed.title) { skipped++; continue; }
      if (!parsed.projectId && !parsed.areaId) {
        if (ui.filterProject) parsed.projectId = ui.filterProject;
        else if (ui.filterArea) parsed.areaId = ui.filterArea;
      }
      addTask(parsed);
      added++;
    }
    if (!added) { toast(skipped ? 'No task descriptions found on those lines' : 'Nothing to add yet'); return; }
    closeModal(); render();
    toast('Added ' + added + ' ' + (added === 1 ? 'task' : 'tasks') + (skipped ? ', skipped ' + skipped : ''));
  });

}
