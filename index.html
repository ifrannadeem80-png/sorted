/* ================= Backup ================= */

function backupPayload() {
  return JSON.stringify({ app: 'Sorted', v: 1, exportedAt: new Date().toISOString(), tasks: state.tasks, projects: state.projects, areas: state.areas, settings: state.settings }, null, 2);
}

async function exportBackup() {
  const filename = 'sorted-backup-' + todayISO() + '.json';
  const data = backupPayload();
  if (window.claude && window.claude.downloads) {
    try {
      await window.claude.downloads.save({ filename, data });
      toast('Backup saved');
      return;
    } catch (err) {
      if (err && err.code === 'declined') return;
      if (err && err.code === 'rate_limited') { toast('One moment, then try again'); return; }
      /* fall through to plain download */
    }
  }
  try {
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast('Backup downloaded');
  } catch (e) {
    toast('Could not create the backup file');
  }
}

function importBackup(text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { toast('That file is not a valid backup'); return; }
  if (!data || !Array.isArray(data.tasks)) { toast('That file is not a Sorted backup'); return; }
  // Merge: keep existing tasks, add any from the backup not already present
  const existingIds = new Set(state.tasks.map(t => t.id));
  let added = 0;
  for (const t of data.tasks) {
    if (t && t.id && !existingIds.has(t.id) && t.title) { state.tasks.push(t); added++; }
  }
  const existingProj = new Set(state.projects.map(p => p.id));
  for (const p of (data.projects || [])) {
    if (p && p.id && !existingProj.has(p.id) && !state.projects.some(x => x.name.toLowerCase() === p.name.toLowerCase())) state.projects.push(p);
  }
  const existingArea = new Set(state.areas.map(a => a.id));
  for (const a of (data.areas || [])) {
    if (a && a.id && !existingArea.has(a.id) && !state.areas.some(x => x.name.toLowerCase() === a.name.toLowerCase())) state.areas.push(a);
  }
  if (data.settings && state.tasks.length === added) state.settings = Object.assign(defaultSettings(), data.settings);
  save(); render(); closeModal();
  toast(added ? ('Restored ' + added + ' ' + (added === 1 ? 'task' : 'tasks')) : 'Nothing new to restore; your list already has these tasks');
}

/* ================= Toast ================= */

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

/* ================= Events ================= */

function setView(v) {
  ui.view = v;
  render();
}

function applyProjectFilter(id) {
  ui.filterProject = (ui.filterProject === id) ? null : id;
  ui.filterArea = null;
  if (ui.filterProject && ui.view === 'today') ui.view = 'list';
  render();
}

function applyAreaFilter(id) {
  ui.filterArea = (ui.filterArea === id) ? null : id;
  ui.filterProject = null;
  if (ui.filterArea && ui.view === 'today') ui.view = 'list';
  render();
}

document.getElementById('sidebar').addEventListener('click', (e) => {
  const nav = e.target.closest('[data-view]');
  if (nav) { setView(nav.dataset.view); return; }
  const caret = e.target.closest('[data-caret]');
  if (caret) {
    const id = caret.dataset.caret;
    const c = state.settings.collapsed || (state.settings.collapsed = []);
    const i = c.indexOf(id);
    if (i === -1) c.push(id); else c.splice(i, 1);
    save(); render();
    return;
  }
  const styleBtn = e.target.closest('[data-astyle]');
  if (styleBtn) { openAreaStyle(styleBtn.dataset.astyle); return; }
  const area = e.target.closest('[data-area]');
  if (area) { applyAreaFilter(area.dataset.area); return; }
  const proj = e.target.closest('[data-proj]');
  if (proj) { applyProjectFilter(proj.dataset.proj); return; }
  if (e.target.closest('[data-addproj]')) { openNewProject(); return; }
  if (e.target.closest('[data-openset]')) openSettings();
});

document.getElementById('chipbar').addEventListener('click', (e) => {
  if (e.target.closest('[data-all]')) { ui.filterProject = null; ui.filterArea = null; render(); return; }
  const area = e.target.closest('[data-area]');
  if (area) { applyAreaFilter(area.dataset.area); return; }
  const proj = e.target.closest('[data-proj]');
  if (proj) { applyProjectFilter(proj.dataset.proj); return; }
});

document.getElementById('tabbar').addEventListener('click', (e) => {
  const nav = e.target.closest('[data-view]');
  if (nav) { setView(nav.dataset.view); return; }
  if (e.target.closest('[data-openset]')) openSettings();
});

document.getElementById('settingsBtn').addEventListener('click', openSettings);

function doQuickAdd() {
  const inp = document.getElementById('quickAdd');
  const text = inp.value.trim();
  if (!text) return;
  const parsed = parseQuickAdd(text);
  if (!parsed.title) { toast('The task needs a few words of description'); return; }
  if (!parsed.projectId && !parsed.areaId) {
    if (ui.filterProject) parsed.projectId = ui.filterProject;
    else if (ui.filterArea) parsed.areaId = ui.filterArea;
  }
  addTask(parsed);
  inp.value = '';
  render();
}
document.getElementById('quickAddGo').addEventListener('click', doQuickAdd);
document.getElementById('bulkAddBtn').addEventListener('click', openBulkAdd);
document.getElementById('quickAdd').addEventListener('keydown', (e) => { if (e.key === 'Enter') doQuickAdd(); });

let searchTimer = null;
document.getElementById('searchInput').addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { ui.search = e.target.value; render(); }, 180);
});

document.getElementById('content').addEventListener('change', (e) => {
  const sel = e.target.closest('[data-f]');
  if (sel) { ui[sel.dataset.f] = sel.value; render(); }
});

document.getElementById('content').addEventListener('click', (e) => {
  const groupBtn = e.target.closest('[data-group]');
  if (groupBtn) { ui.groupBy = groupBtn.dataset.group; render(); return; }
  const sortBtn = e.target.closest('[data-sort]');
  if (sortBtn) { ui.sortBy = sortBtn.dataset.sort; render(); return; }
  const layoutBtn = e.target.closest('[data-layout]');
  if (layoutBtn) { ui.layout = layoutBtn.dataset.layout; render(); return; }
  if (e.target.closest('[data-clearfilters]')) { ui.fQuad = ''; ui.fPri = ''; ui.fStatus = ''; render(); return; }
  if (e.target.closest('[data-toggledone]')) { ui.showDone = !ui.showDone; render(); return; }
  if (e.target.closest('[data-clearproj]')) { ui.filterProject = null; render(); return; }
  const row = e.target.closest('[data-task]');
  if (!row) return;
  const id = row.dataset.task;
  const act = e.target.closest('[data-act]');
  if (act && act.dataset.act === 'done') { toggleDone(id); return; }
  if (act && act.dataset.act === 'focus') { toggleFocus(id); return; }
  openEdit(id);
});
document.getElementById('content').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const row = e.target.closest && e.target.closest('[data-task]');
  if (row && e.target === row) { e.preventDefault(); openEdit(row.dataset.task); }
});

/* Drag and drop */
let dragId = null;
document.getElementById('content').addEventListener('dragstart', (e) => {
  const row = e.target.closest('[data-task]');
  if (!row) return;
  dragId = row.dataset.task;
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', dragId); } catch (err) {}
});
document.getElementById('content').addEventListener('dragover', (e) => {
  const zone = e.target.closest('[data-quad], [data-status]');
  if (!zone) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  zone.classList.add('drag-over');
});
document.getElementById('content').addEventListener('dragleave', (e) => {
  const zone = e.target.closest('[data-quad], [data-status]');
  if (zone && !zone.contains(e.relatedTarget)) zone.classList.remove('drag-over');
});
document.getElementById('content').addEventListener('drop', (e) => {
  const zone = e.target.closest('[data-quad], [data-status]');
  if (!zone || !dragId) return;
  e.preventDefault();
  zone.classList.remove('drag-over');
  const t = getTask(dragId);
  dragId = null;
  if (!t) return;
  if (zone.dataset.quad !== undefined) {
    t.quadrant = Number(zone.dataset.quad) || null;
  } else if (zone.dataset.status) {
    const st = zone.dataset.status;
    if (st !== t.status) {
      t.status = st;
      t.completedAt = st === 'done' ? Date.now() : null;
    }
  }
  save(); render();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

/* ================= Auth & boot ================= */

let authMode = 'signin';

function showAuth() {
  document.getElementById('shell').style.display = 'none';
  document.getElementById('tabbar').style.display = '';
  document.getElementById('authWrap').style.display = 'flex';
}

function showShell() {
  document.getElementById('authWrap').style.display = 'none';
  document.getElementById('shell').style.display = 'flex';
}

function setAuthMode(mode) {
  authMode = mode;
  document.getElementById('authGo').textContent = mode === 'signin' ? 'Sign in' : 'Create account';
  document.getElementById('authSub').textContent = mode === 'signin'
    ? 'Sign in to see your tasks on any device.'
    : 'Choose the email and password you will use on every device.';
  document.getElementById('authAlt').innerHTML = mode === 'signin'
    ? 'First time here? <button id="authToggle">Create your account</button>'
    : 'Already set up? <button id="authToggle">Sign in instead</button>';
  document.getElementById('authToggle').addEventListener('click', () => setAuthMode(authMode === 'signin' ? 'signup' : 'signin'));
  document.getElementById('authErr').textContent = '';
}

async function doAuth() {
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPass').value;
  const err = document.getElementById('authErr');
  if (!email || !pass) { err.textContent = 'Enter your email and password.'; return; }
  if (authMode === 'signup' && pass.length < 8) { err.textContent = 'Use a password of at least 8 characters.'; return; }
  const btn = document.getElementById('authGo');
  btn.disabled = true; err.textContent = '';
  try {
    const fn = authMode === 'signin'
      ? sb.auth.signInWithPassword({ email, password: pass })
      : sb.auth.signUp({ email, password: pass });
    const { error } = await fn;
    if (error) {
      err.textContent = /invalid/i.test(error.message) ? 'Email or password not recognised.' :
        /already registered/i.test(error.message) ? 'That email already has an account. Sign in instead.' :
        /signups not allowed/i.test(error.message) ? 'New accounts are switched off for this app.' :
        error.message;
    }
  } catch (e) {
    err.textContent = 'Could not reach the server. Check your connection and try again.';
  }
  btn.disabled = false;
}

async function enterApp(session) {
  sbUser = session.user;
  showShell();
  if (loadCache()) render();
  await fullLoad();
  render();
  subscribeRealtime();
}

async function signOutNow() {
  try { await sb.auth.signOut(); } catch (e) {}
  localStorage.removeItem(STORE_KEY);
  state.tasks = []; state.projects = []; state.areas = []; state.settings = defaultSettings();
  sbUser = null;
  closeModal();
  showAuth();
}

document.getElementById('authGo').addEventListener('click', doAuth);
document.getElementById('authPass').addEventListener('keydown', (e) => { if (e.key === 'Enter') doAuth(); });
document.getElementById('authToggle').addEventListener('click', () => setAuthMode('signup'));

(async function boot() {
  if (!window.supabase) {
    document.getElementById('authWrap').style.display = 'flex';
    document.getElementById('authErr').textContent = 'Could not load the sync library. Check your connection and refresh.';
    return;
  }
  sb = window.supabase.createClient(SB_URL, SB_ANON);
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN' && session && !sbUser) enterApp(session);
    if (event === 'SIGNED_OUT') { sbUser = null; showAuth(); }
  });
  const { data } = await sb.auth.getSession();
  if (data && data.session) enterApp(data.session);
  else showAuth();
})();
</script>
