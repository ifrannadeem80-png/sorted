      '<span class="proj-dot" style="background:' + a.colour + '"></span><span class="proj-name">' + esc(a.name) + '</span>' +
      (c ? '<span class="nav-count">' + c + '</span>' : '') + '</button>' +
      '<button class="kebab" data-astyle="' + a.id + '" title="Group backdrop" aria-label="Backdrop for ' + esc(a.name) + '">&#8943;</button>' +
      '<button class="caret" data-caret="' + a.id + '" aria-label="' + (isCollapsed ? 'Expand' : 'Collapse') + ' ' + esc(a.name) + '">' + (isCollapsed ? '&#9656;' : '&#9662;') + '</button>' +
      '</div>';
    if (!isCollapsed) {
      for (const p of state.projects.filter(p => p.areaId === a.id)) html += projBtn(p, true);
    }
  }
  const unfiled = state.projects.filter(p => !p.areaId);
  if (unfiled.length) {
    html += '<div class="side-label">Other projects</div>';
    for (const p of unfiled) html += projBtn(p, false);
  }
  const doneCount = state.tasks.filter(t => t.status === 'done').length;
  html += '<div class="sidebar-foot">' +
    '<button class="nav-btn' + (ui.view === 'done' ? ' active' : '') + '" data-view="done">' + ICONS.done + 'Completed' +
    (doneCount ? '<span class="nav-count">' + doneCount + '</span>' : '') + '</button>' +
    '<button class="nav-btn" data-openset>' +
    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M4 21h16"></path></svg>' +
    'Backup &amp; settings</button></div>';
  document.getElementById('sidebar').innerHTML = html;
}

function renderTabbar() {
  let html = '';
  for (const v of VIEWS) {
    html += '<button class="tab' + (ui.view === v.key ? ' active' : '') + '" data-view="' + v.key + '">' + ICONS[v.key] + v.name + '</button>';
  }
  html += '<button class="tab" data-openset><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M4 21h16"></path></svg>More</button>';
  document.getElementById('tabbar').innerHTML = html;
}

function viewTitle() {
  if (ui.filterProject) {
    const p = state.projects.find(p => p.id === ui.filterProject);
    if (p) return esc(p.name);
  }
  if (ui.filterArea) {
    const a = areaOf(ui.filterArea);
    if (a) return esc(a.name);
  }
  if (ui.view === 'done') return 'Completed';
  const v = VIEWS.find(v => v.key === ui.view);
  return v ? v.name : '';
}

function renderChipbar() {
  let html = '<button class="chip-f' + (!ui.filterArea && !ui.filterProject ? ' on' : '') + '" data-all>All</button>';
  const activeProj = ui.filterProject ? state.projects.find(p => p.id === ui.filterProject) : null;
  for (const a of state.areas) {
    const expanded = ui.filterArea === a.id || (activeProj && activeProj.areaId === a.id);
    html += '<button class="chip-f' + (ui.filterArea === a.id ? ' on' : '') + '" data-area="' + a.id + '">' +
      '<span class="proj-dot" style="background:' + a.colour + '"></span>' + esc(a.name) + '</button>';
    if (expanded) {
      for (const p of state.projects.filter(p => p.areaId === a.id)) {
        html += '<button class="chip-f' + (ui.filterProject === p.id ? ' on' : '') + '" data-proj="' + p.id + '">' + esc(p.name) + '</button>';
      }
    }
  }
  for (const p of state.projects.filter(p => !p.areaId)) {
    html += '<button class="chip-f' + (ui.filterProject === p.id ? ' on' : '') + '" data-proj="' + p.id + '">' +
      '<span class="proj-dot" style="background:' + p.colour + '"></span>' + esc(p.name) + '</button>';
  }
  document.getElementById('chipbar').innerHTML = html;
}

function render() {
  renderSidebar();
  renderTabbar();
  renderChipbar();
  const titleEl = document.getElementById('viewTitle');
  const t = todayISO();
  const [y, m, d] = t.split('-').map(Number);
  const dateStr = new Date(y, m - 1, d).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  titleEl.innerHTML = viewTitle() + (ui.view === 'today' && !ui.filterProject ? '<span class="view-sub">' + dateStr + '</span>' : '');
  const el = document.getElementById('content');
  el.style.background = resolveAreaBg(activeAreaForBg());
  if (ui.view === 'today') el.innerHTML = renderToday();
  else if (ui.view === 'list') el.innerHTML = renderList();
  else if (ui.view === 'matrix') el.innerHTML = renderMatrix();
  else if (ui.view === 'priority') el.innerHTML = renderPriority();
  else if (ui.view === 'done') el.innerHTML = renderArchive();
  else if (ui.view === 'map') { renderMap(el); }
  else el.innerHTML = renderBoard();
}

/* ----- Priority ----- */

function whereLabel(t) {
  const proj = projectOf(t);
  if (proj) return '<span class="m-proj"><span class="proj-dot" style="background:' + proj.colour + '"></span>' + esc(proj.name) + '</span>';
  const area = t.areaId ? areaOf(t.areaId) : null;
  if (area) return '<span class="m-proj"><span class="proj-dot" style="background:' + area.colour + '"></span>' + esc(area.name) + '</span>';
  return '<span style="color:var(--ink-faint)">&ndash;</span>';
}

function renderPriority() {
  const items = openTasks().filter(t => t.priority)
    .sort((a, b) => (a.priority - b.priority) || sortByDue(a, b));
  if (!items.length) {
    return '<div class="empty"><div class="e-big">No priorities set.</div>' +
      'Give a task a priority from 1 to 4 in its editor, or type <b>p1</b> to <b>p4</b> when adding one, e.g. "Chase arrears p1". Only prioritised work appears here.</div>';
  }
  let html = '<div class="table-wrap"><table class="ptable"><thead><tr>' +
    '<th style="width:36px"></th><th style="width:52px">Pri</th><th>Task</th><th>Where</th><th style="width:110px">Due</th>' +
    '</tr></thead><tbody>';
  for (const t of items) {
    const pcls = t.priority >= 1 && t.priority <= 4 ? 'pri-' + t.priority : 'pri-4';
    html += '<tr data-task="' + t.id + '" tabindex="0">' +
      '<td><button class="check" data-act="done" aria-label="Mark complete">' + ICONS.tick + '</button></td>' +
      '<td><span class="pri-badge ' + pcls + '">' + t.priority + '</span></td>' +
      '<td><div class="t-title" style="font-weight:500">' + esc(t.title) + '</div>' +
      (t.quadrant ? '<span class="chip q' + t.quadrant + '" style="margin-top:3px">' + esc(state.settings.quadNames[t.quadrant - 1]) + '</span>' : '') +
      '</td>' +
      '<td>' + whereLabel(t) + '</td>' +
      '<td class="num"><span class="m-due ' + (t.due ? dueClass(t.due) : '') + '">' + (t.due ? esc(fmtDue(t.due)) : '&ndash;') + '</span></td>' +
      '</tr>';
  }
  html += '</tbody></table></div>';
  html += '<div class="drag-hint" style="padding-top:10px">Priority is your own ranking of what matters today, separate from the matrix. Completed tasks leave this table automatically.</div>';
  return html;
}

/* ----- Completed archive ----- */

function renderArchive() {
  const done = doneTasks();
  if (!done.length) {
    return '<div class="empty"><div class="e-big">Nothing completed yet.</div>Finished tasks are kept here automatically. Tick a task anywhere in the app to complete it.</div>';
  }
  const t = todayISO();
  const dayOf = (ms) => {
    const d = new Date(ms);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  };
  const buckets = [
    ['Today', x => dayOf(x.completedAt || 0) === t],
    ['Yesterday', x => dayOf(x.completedAt || 0) === addDaysISO(t, -1)],
    ['Past week', x => { const d = dayOf(x.completedAt || 0); return d < addDaysISO(t, -1) && d >= addDaysISO(t, -7); }],
    ['Past month', x => { const d = dayOf(x.completedAt || 0); return d < addDaysISO(t, -7) && d >= addDaysISO(t, -31); }],
    ['Older', x => dayOf(x.completedAt || 0) < addDaysISO(t, -31)],
  ];
  let html = '<div class="drag-hint">Everything you finish is kept here. Untick a task to bring it back; use Backup &amp; settings to clear the archive.</div>';
  for (const [name, fn] of buckets) {
    const items = done.filter(fn);
    if (!items.length) continue;
    html += '<div class="group-head">' + name + ' <span class="g-count">' + items.length + '</span></div>' + rowsHTML(items);
  }
  return html;
}

/* ----- Today ----- */

function renderToday() {
  const open = openTasks();
  const t = todayISO();
  const weekEnd = addDaysISO(t, 7);
  const focus = open.filter(x => x.focus).sort(sortByDue);
  const overdue = open.filter(x => !x.focus && x.due && x.due < t).sort(sortByDue);
  const today = open.filter(x => !x.focus && x.due === t).sort(sortByDue);
  const week = open.filter(x => !x.focus && x.due && x.due > t && x.due <= weekEnd).sort(sortByDue);
  let html = '';
  if (focus.length) html += '<div class="group-head">Focus <span class="g-count">' + focus.length + '</span></div>' + rowsHTML(focus);
  if (overdue.length) html += '<div class="group-head" style="color:var(--q1)">Overdue <span class="g-count">' + overdue.length + '</span></div>' + rowsHTML(overdue);
  if (today.length) html += '<div class="group-head">Due today <span class="g-count">' + today.length + '</span></div>' + rowsHTML(today);
  if (week.length) html += '<div class="group-head">This week <span class="g-count">' + week.length + '</span></div>' + rowsHTML(week);
  if (!html) {
    html = '<div class="empty"><div class="e-big">A clear day.</div>Nothing due or flagged for now. Star a task with the &#9734; to bring it here, or add one above.</div>';
  }
  return html;
}

/* ----- List ----- */

function applyListFilters(list) {
  let out = list;
  if (ui.fQuad !== '') out = out.filter(t => ui.fQuad === '0' ? !t.quadrant : t.quadrant === Number(ui.fQuad));
  if (ui.fPri !== '') out = out.filter(t => ui.fPri === '0' ? !t.priority : t.priority === Number(ui.fPri));
  if (ui.fStatus !== '') out = out.filter(t => t.status === ui.fStatus);
  return out;
}

function renderList() {
  const open = applyListFilters(openTasks());
  const done = doneTasks();
  const s = state.settings;
  const filtersOn = ui.fQuad !== '' || ui.fPri !== '' || ui.fStatus !== '';
  const inColumns = ui.layout === 'columns';
  let html = '<div class="toolbar">' +
    (inColumns ? '' : '<span class="tool-label">Group by</span><div class="seg">' +
    ['project', 'due', 'quadrant'].map(g =>
      '<button class="' + (ui.groupBy === g ? 'on' : '') + '" data-group="' + g + '">' + (g === 'project' ? 'Project' : g === 'due' ? 'Due date' : 'Quadrant') + '</button>'
    ).join('') + '</div>') +
    '<span class="tool-label">Sort</span><div class="seg">' +
    '<button class="' + (ui.sortBy === 'due' ? 'on' : '') + '" data-sort="due">Due date</button>' +
    '<button class="' + (ui.sortBy === 'added' ? 'on' : '') + '" data-sort="added">Newest</button>' +
    '<button class="' + (ui.sortBy === 'manual' ? 'on' : '') + '" data-sort="manual">My order</button></div>' +
    '<div class="seg">' +
    '<button class="' + (ui.layout === 'rows' ? 'on' : '') + '" data-layout="rows">Rows</button>' +
    '<button class="' + (ui.layout === 'tiles' ? 'on' : '') + '" data-layout="tiles">Tiles</button>' +
    '<button class="' + (inColumns ? 'on' : '') + '" data-layout="columns">Columns</button></div>';
  if (ui.filterProject) html += '<button class="link-btn" data-clearproj>Show all projects</button>';
  html += '</div>';
  html += '<div class="toolbar"><span class="tool-label">Filter</span>' +
    '<select class="mini-select" data-f="fQuad" aria-label="Filter by quadrant"><option value="">Any quadrant</option>' +
    QUADS.map(q => '<option value="' + q + '"' + (ui.fQuad === String(q) ? ' selected' : '') + '>' + esc(s.quadNames[q - 1]) + '</option>').join('') +
    '<option value="0"' + (ui.fQuad === '0' ? ' selected' : '') + '>Unsorted</option></select>' +
    '<select class="mini-select" data-f="fPri" aria-label="Filter by priority"><option value="">Any priority</option>' +
    [1, 2, 3, 4].map(p => '<option value="' + p + '"' + (ui.fPri === String(p) ? ' selected' : '') + '>P' + p + '</option>').join('') +
    '<option value="0"' + (ui.fPri === '0' ? ' selected' : '') + '>No priority</option></select>' +
    '<select class="mini-select" data-f="fStatus" aria-label="Filter by status"><option value="">Any status</option>' +
    STATUSES.filter(st => st.key !== 'done').map(st => '<option value="' + st.key + '"' + (ui.fStatus === st.key ? ' selected' : '') + '>' + st.name + '</option>').join('') + '</select>' +
    (filtersOn ? '<button class="link-btn" data-clearfilters>Clear filters</button>' : '') +
    '</div>';
  if (ui.sortBy === 'manual') {
    html += '<div class="drag-hint">' + (window.matchMedia('(pointer: coarse)').matches ? 'Your own arrangement. Drag on a computer to change it; the order follows you here.' : 'Drag tasks up or down to arrange your own order.') + '</div>';
  }

  if (!open.length && !done.length) {
    return html + '<div class="empty"><div class="e-big">' + (filtersOn ? 'Nothing matches those filters.' : 'Nothing here yet.') + '</div>' + (filtersOn ? 'Loosen or clear the filters above.' : 'Add your first task in the bar above. Use #Project to file it as you go.') + '</div>';
  }

  const openIds = new Set(open.map(t => t.id));
  const rowPlusKids = (t, opts, depth) => {
    let out = taskRowHTML(t, Object.assign({}, opts, { indent: depth }));
    if (ui.layout !== 'tiles') {
      for (const c of childTasksOf(t.id).filter(c => openIds.has(c.id)).sort(listSort())) {
        out += rowPlusKids(c, opts, (depth || 0) + 1);
      }
    }
    return out;
  };
  const wrap = (items, opts) => {
    if (ui.layout === 'tiles') return '<div class="tile-grid">' + rowsHTML([...items].sort(listSort()), opts) + '</div>';
    // children render indented under their parent, not as separate top-level rows
    const tops = [...items].filter(t => !(t.parentId && openIds.has(t.parentId))).sort(listSort());
    return tops.map(t => rowPlusKids(t, opts || {}, 0)).join('');
  };

  if (inColumns) {
    const cols = state.areas.map(a => ({ id: a.id, name: a.name, colour: a.colour }));
    const otherItems = open.filter(t => !taskAreaId(t));
    if (otherItems.length) cols.push({ id: null, name: 'Other', colour: null });
    html += '<div class="board" style="grid-template-columns:repeat(' + cols.length + ',minmax(250px,1fr))">';
    for (const c of cols) {
      const items = open.filter(t => taskAreaId(t) === c.id).sort(listSort());
      const colBg = c.id ? resolveAreaBg(areaOf(c.id)) : '';
      html += '<div class="col"' + (colBg ? ' style="background:' + (colBg + ' var(--surface-2)').replace(/"/g, '&quot;') + '"' : '') + '>' +
        '<div class="col-head">' + (c.colour ? '<span class="g-dot" style="background:' + c.colour + ';width:10px;height:10px;border-radius:50%"></span>' : '') + esc(c.name) +
        '<span class="q-count">' + items.length + '</span></div>' +
        wrap(items, { hideArea: true }) +
        (items.length ? '' : '<div class="empty" style="padding:16px 8px;font-size:13px">Nothing here</div>') +
        '</div>';
    }
    html += '</div>';
    if (done.length) {
      html += '<div class="toolbar" style="margin-top:18px"><button class="link-btn" data-toggledone>' + (ui.showDone ? 'Hide' : 'Show') + ' completed (' + done.length + ')</button></div>';
      if (ui.showDone) html += rowsHTML(done.slice(0, 100));
    }
    return html;
  }

  if (ui.groupBy === 'project') {
    for (const a of [...state.areas, null]) {
      const aid = a ? a.id : null;
      const direct = open.filter(t => !t.projectId && (t.areaId || null) === aid);
      const blocks = [];
      for (const p of state.projects.filter(p => (p.areaId || null) === aid)) {
        const items = open.filter(t => t.projectId === p.id);
        if (items.length) blocks.push({ p, items });
      }
      if (!blocks.length && !direct.length) continue;
      const total = direct.length + blocks.reduce((n, b) => n + b.items.length, 0);
      html += '<div class="group-head">' +
        (a ? '<span class="g-dot" style="background:' + a.colour + '"></span>' + esc(a.name) : 'Other') +
        ' <span class="g-count">' + total + '</span></div>';
      if (direct.length) html += wrap(direct, { hideProject: true, hideArea: true });
      for (const b of blocks) {
        html += '<div class="sub-head"><span class="g-dot" style="background:' + b.p.colour + '"></span>' + esc(b.p.name) + ' <span class="g-count">' + b.items.length + '</span></div>' + wrap(b.items, { hideProject: true });
      }
    }
  } else if (ui.groupBy === 'due') {
    const t = todayISO();
    const buckets = [
      ['Overdue', x => x.due && x.due < t],
      ['Today', x => x.due === t],
      ['Tomorrow', x => x.due === addDaysISO(t, 1)],
      ['This week', x => x.due && x.due > addDaysISO(t, 1) && x.due <= addDaysISO(t, 7)],
      ['Later', x => x.due && x.due > addDaysISO(t, 7)],
      ['No date', x => !x.due],
    ];
    for (const [name, fn] of buckets) {
      const items = open.filter(fn);
      if (!items.length) continue;
      const style = name === 'Overdue' ? ' style="color:var(--q1)"' : '';
      html += '<div class="group-head"' + style + '>' + name + ' <span class="g-count">' + items.length + '</span></div>' + wrap(items);
    }
  } else {
    for (const q of QUADS) {
      const items = open.filter(x => x.quadrant === q);
      if (!items.length) continue;
      html += '<div class="group-head"><span class="g-dot" style="background:var(--q' + q + ')"></span>' + esc(state.settings.quadNames[q - 1]) + ' <span class="g-count">' + items.length + '</span></div>' + wrap(items, { hideQuad: true });
    }
    const unsorted = open.filter(x => !x.quadrant);
    if (unsorted.length) html += '<div class="group-head">Not yet sorted <span class="g-count">' + unsorted.length + '</span></div>' + wrap(unsorted);
  }

  if (done.length) {
    html += '<div class="toolbar" style="margin-top:18px"><button class="link-btn" data-toggledone>' + (ui.showDone ? 'Hide' : 'Show') + ' completed (' + done.length + ')</button></div>';
    if (ui.showDone) html += ui.layout === 'tiles' ? '<div class="tile-grid">' + rowsHTML(done.slice(0, 100)) + '</div>' : rowsHTML(done.slice(0, 100));
  }
  return html;
}

/* ----- Matrix ----- */

function renderMatrix() {
  const open = openTasks();
  const s = state.settings;
  const unsorted = open.filter(t => !t.quadrant).sort(sortByDue);
  const isTouch = window.matchMedia('(pointer: coarse)').matches;
  let html = '<div class="drag-hint">' + (isTouch ? 'Tap a task to file it in a quadrant.' : 'Drag tasks between quadrants, or tap to edit.') + '</div>';
  html += '<div class="matrix-wrap">';
  html += '<div></div><div class="ax horiz">' + esc(s.axisX[0]) + '</div><div class="ax horiz">' + esc(s.axisX[1]) + '</div>';
  const cells = [
    { q: 1, axis: s.axisY[0] }, { q: 2, axis: null },
    { q: 3, axis: s.axisY[1] }, { q: 4, axis: null },
  ];
  const axesFor = (q) => esc(s.axisX[q === 1 || q === 3 ? 0 : 1]) + ' &middot; ' + esc(s.axisY[q <= 2 ? 0 : 1]);
  for (const c of cells) {
    if (c.axis !== null) html += '<div class="ax vert">' + esc(c.axis) + '</div>';
    const items = open.filter(t => t.quadrant === c.q).sort(sortByDue);
    html += '<div class="quad qc' + c.q + '" data-quad="' + c.q + '">' +
      '<div class="quad-head"><span class="q-mark" style="background:var(--q' + c.q + ')"></span>' + esc(s.quadNames[c.q - 1]) +
      '<span class="q-axes">' + axesFor(c.q) + '</span>' +
      '<span class="q-count">' + items.length + '</span></div>' +
      '<div class="quad-body">' + rowsHTML(items, { hideQuad: true }) +
      (items.length ? '' : '<div class="empty" style="padding:18px 8px;font-size:13px">Drop tasks here</div>') +
      '</div></div>';
  }
  html += '</div>';
  html += '<div class="tray" data-quad="0"><div class="tray-head">To be sorted <span>' + unsorted.length + (unsorted.length === 1 ? ' task' : ' tasks') + '</span></div>' +
    (unsorted.length ? rowsHTML(unsorted, { hideQuad: true }) : '<div class="empty" style="padding:10px;font-size:13px">Everything is sorted. New tasks land here first.</div>') +
    '</div>';
  return html;
}

/* ----- Board ----- */

function renderBoard() {
  const open = openTasks();
  const done = doneTasks();
  let html = '<div class="drag-hint">' + (window.matchMedia('(pointer: coarse)').matches ? 'Tap a task to change its status.' : 'Drag tasks across columns as work moves.') + '</div>';
  html += '<div class="board">';
  for (const st of STATUSES) {
    const items = st.key === 'done' ? done.slice(0, 30) : open.filter(t => t.status === st.key).sort(sortByDue);
    html += '<div class="col" data-status="' + st.key + '">' +
      '<div class="col-head">' + esc(st.name) + '<span class="q-count">' + items.length + '</span></div>' +
      rowsHTML(items, { hideStatus: true }) +
      '</div>';
  }
  html += '</div>';
  return html;
}

/* ================= Mind map ================= */

const mapView = { t: null, sel: null, inputActive: false, pendingRender: false, firstFit: true };

function mapForest() {
  const s = state.settings;
  const hiddenA = new Set(s.mapHiddenAreas || []);
  const hiddenP = new Set(s.mapHiddenProjects || []);
  const showDone = !!s.mapShowDone;
  const include = (t) => showDone || t.status !== 'done';
  const taskNode = (t) => ({
    kind: 'task', id: t.id, label: t.title, done: t.status === 'done', task: t,
    children: (state.settings.mapCollapsed || []).includes(t.id) ? [] : [
      ...childTasksOf(t.id).filter(include).sort(sortByManual).map(taskNode),
      ...(t.steps || []).map(st => ({ kind: 'step', id: t.id + '::' + st.id, label: st.title, done: !!st.done, taskId: t.id, stepId: st.id, children: [] })),
    ],
    childCount: childTasksOf(t.id).filter(include).length + (t.steps || []).length,
  });
  const collapsedSet = new Set(state.settings.mapCollapsed || []);
  const roots = [];
  const areasPlus = [...state.areas.map(a => ({ id: a.id, name: a.name, colour: a.colour, real: true })), { id: null, name: 'Other', colour: '#66716B', real: false }];
  for (const a of areasPlus) {
    if (a.real && hiddenA.has(a.id)) continue;
    const projs = state.projects.filter(p => (p.areaId || null) === a.id && !hiddenP.has(p.id));
    const direct = state.tasks.filter(t => !t.projectId && (t.areaId || null) === a.id && !t.parentId && include(t)).sort(sortByManual);
    const projNodes = [];
    for (const p of projs) {
      const items = state.tasks.filter(t => t.projectId === p.id && !t.parentId && include(t)).sort(sortByManual);
      projNodes.push({
        kind: 'project', id: p.id, label: p.name, colour: p.colour, project: p,
        children: collapsedSet.has(p.id) ? [] : items.map(taskNode),
        childCount: items.length,
      });
    }
    if (!projNodes.length && !direct.length && a.real && (hiddenA.size || hiddenP.size)) continue;
    if (!projNodes.length && !direct.length && !a.real) continue;
    roots.push({
      kind: 'area', id: a.id || '__other', areaId: a.id, label: a.name, colour: a.colour,
      children: collapsedSet.has(a.id || '__other') ? [] : [...projNodes, ...direct.map(taskNode)],
      childCount: projNodes.length + direct.length,
    });
  }
  return roots;
}

const MAP_DIM = { root: { w: 200, h: 46 }, area: { w: 180, h: 38 }, project: { w: 180, h: 34 }, task: { w: 230, h: 36 }, step: { w: 190, h: 28 }, gapX: 54, gapY: 10 };

function layoutMapTree(roots, startX, mirror) {
  const flat = [];
  const colW = [];
  const depthOf = (node, d) => {
    colW[d] = Math.max(colW[d] || 0, MAP_DIM[node.kind].w);
    node.depth = d;
    node.children.forEach(c => depthOf(c, d + 1));
  };
  roots.forEach(r => depthOf(r, 0));
  const colX = [];
  let acc = startX;
  for (let i = 0; i < colW.length; i++) { colX[i] = acc; acc += colW[i] + MAP_DIM.gapX; }
  let cursorY = 0;
  const place = (node) => {
    const dim = MAP_DIM[node.kind];
    node.w = dim.w; node.h = dim.h; node.x = colX[node.depth];
    if (!node.children.length) {
      node.y = cursorY;
      cursorY += dim.h + MAP_DIM.gapY;
    } else {
      node.children.forEach(place);
      const first = node.children[0], last = node.children[node.children.length - 1];
      node.y = (first.y + last.y + last.h) / 2 - dim.h / 2;
    }
    flat.push(node);
  };
  roots.forEach((r, i) => { if (i > 0) cursorY += 14; place(r); });
  if (mirror) flat.forEach(n => { n.x = -(n.x + n.w); });
  return { flat, height: cursorY };
}

function escAttr(s) { return esc(s); }
function truncLabel(s, w) {
  const maxChars = Math.floor((w - 48) / 6.4);
  return s.length > maxChars ? s.slice(0, maxChars - 1) + '…' : s;
}

function nodeColour(node, roots) {
  if (node.kind === 'area') return node.colour;
  if (node.kind === 'project') return node.colour;
  const t = node.task;
  if (t) { const a = areaOf(taskAreaId(t)); if (a) return a.colour; }
  return '#66716B';
}

function renderMap(el) {
  if (mapView.inputActive) { mapView.pendingRender = true; return; }
  const s = state.settings;
  const roots = mapForest();
  const centred = (s.mapLayout || 'centred') !== 'tree';
  let flat = [];
  if (!centred) {
    const T = layoutMapTree(roots, 20, false);
    flat = T.flat;
    flat.forEach(n => { n.side = 'right'; });
  } else {
    const weight = (n) => { let w = 1; n.children.forEach(c => { w += weight(c); }); return w; };
    const sides = s.mapSides || {};
    const left = [], right = [];
    let lw = 0, rw = 0;
    for (const r of roots) {
      const key = r.areaId || '__other';
      const w = weight(r);
      let side = sides[key];
      if (side !== 'left' && side !== 'right') side = (lw < rw) ? 'left' : 'right';
      if (side === 'left') { left.push(r); lw += w; } else { right.push(r); rw += w; }
    }
    const rd = MAP_DIM.root;
    const startX = rd.w / 2 + MAP_DIM.gapX;
    const R = layoutMapTree(right, startX, false);
    const L = layoutMapTree(left, startX, true);
    R.flat.forEach(n => { n.side = 'right'; n.y -= R.height / 2; });
    L.flat.forEach(n => { n.side = 'left'; n.y -= L.height / 2; });
    const rootNode = {
      kind: 'root', id: '__root', label: s.mapRootLabel || 'My Projects', colour: '#1E5B4A',
      x: -rd.w / 2, y: -rd.h / 2, w: rd.w, h: rd.h, side: 'right',
      children: [...right, ...left], childCount: roots.length,
    };
    flat = [...R.flat, ...L.flat, rootNode];
  }
  const byId = {}; flat.forEach(n => { byId[n.id] = n; });
  if (mapView.sel && !byId[mapView.sel]) mapView.sel = null;

  let shapes = '', edges = '';
  for (const n of flat) {
    const col = nodeColour(n, roots);
    for (const c of n.children) {
      const ccol = nodeColour(c, roots);
      const pcy = n.y + n.h / 2, ccy = c.y + c.h / 2;
      let d;
      if (c.side === 'left') {
        d = 'M' + n.x + ' ' + pcy +
          ' C' + (n.x - MAP_DIM.gapX / 2) + ' ' + pcy + ' ' +
          (c.x + c.w + MAP_DIM.gapX / 2) + ' ' + ccy + ' ' + (c.x + c.w) + ' ' + ccy;
      } else {
        d = 'M' + (n.x + n.w) + ' ' + pcy +
          ' C' + (n.x + n.w + MAP_DIM.gapX / 2) + ' ' + pcy + ' ' +
          (c.x - MAP_DIM.gapX / 2) + ' ' + ccy + ' ' + c.x + ' ' + ccy;
      }
      edges += '<path class="map-edge" stroke="' + ccol + '" d="' + d + '"></path>';
    }
    const cls = ['map-node', n.kind === 'step' ? 'step-node' : '', n.kind === 'root' ? 'root-node' : '', n.done ? 'done' : '', mapView.sel === n.id ? 'sel' : ''].filter(Boolean).join(' ');
    let metaStr = '';
    if (n.kind === 'task' && n.task) {
      const bits = [];
      if (n.task.priority) bits.push('P' + n.task.priority);
      if (n.task.due) bits.push(fmtDue(n.task.due));
      if ((n.task.steps || []).length) bits.push(n.task.steps.filter(x => x.done).length + '/' + n.task.steps.length);
      metaStr = bits.join(' · ');
    }
    const fill = n.kind === 'area' ? ' style="fill:' + col + '22"' : (n.kind === 'project' ? ' style="fill:' + col + '14"' : '');
    const fw = (n.kind === 'area' || n.kind === 'project') ? ' font-weight="700"' : '';
    const titleX = n.kind === 'root' ? n.w / 2 : 12;
    const anchor = n.kind === 'root' ? ' text-anchor="middle"' : '';
    shapes += '<g class="' + cls + '" data-node="' + escAttr(n.id) + '" data-kind="' + n.kind + '" transform="translate(' + n.x + ',' + n.y + ')">' +
      '<rect width="' + n.w + '" height="' + n.h + '" rx="' + (n.kind === 'root' ? 14 : 9) + '"' + fill + '></rect>' +
      (n.kind === 'root' ? '' : '<rect width="4" height="' + n.h + '" rx="2" fill="' + col + '"></rect>') +
      (n.kind === 'task' ? '<rect class="zi zi-top" x="2" y="0" width="' + (n.w - 4) + '" height="3" rx="1.5"></rect><rect class="zi zi-bottom" x="2" y="' + (n.h - 3) + '" width="' + (n.w - 4) + '" height="3" rx="1.5"></rect>' : '') +
      '<text class="n-title" x="' + titleX + '" y="' + (metaStr ? n.h / 2 - 1 : n.h / 2 + 4.5) + '"' + fw + anchor + '>' + esc(truncLabel(n.label || '(untitled)', n.w)) + '</text>' +
      (metaStr ? '<text class="n-meta" x="12" y="' + (n.h - 6) + '">' + esc(metaStr) + '</text>' : '') +
      '<title>' + esc(n.label || '') + '</title>' +
      '</g>';
    if (n.childCount && n.kind !== 'root') {
      const collapsed = !n.children.length;
      const cx = n.side === 'left' ? n.x : n.x + n.w;
      shapes += '<g class="map-collapse" data-collapse="' + escAttr(n.id) + '" transform="translate(' + cx + ',' + (n.y + n.h / 2) + ')">' +
        '<circle r="8"></circle><text y="3.5">' + (collapsed ? n.childCount : '−') + '</text></g>';
    }
  }

  const scopeCount = (s.mapHiddenAreas || []).length + (s.mapHiddenProjects || []).length;
  el.innerHTML =
    '<div class="map-toolbar">' +
    '<div class="seg">' +
    '<button class="' + (centred ? 'on' : '') + '" data-maplayout="centred">Centred</button>' +
    '<button class="' + (!centred ? 'on' : '') + '" data-maplayout="tree">Tree</button></div>' +
    '<button class="link-btn" data-mapscope>Scope' + (scopeCount ? ' (' + scopeCount + ' hidden)' : '') + '</button>' +
    '<button class="link-btn" data-mapdone>' + (s.mapShowDone ? 'Hide completed' : 'Show completed') + '</button>' +
    '<span class="tool-label">Drag the background to pan · wheel or pinch to zoom · double-click to edit · Tab adds a sub-task, Enter a sibling · drag a task onto a node’s middle to nest it, onto its edge to reorder' + (centred ? ' · drag a group across the centre to swap sides · double-click the centre to rename it' : '') + '</span>' +
    '</div>' +
    '<div class="map-wrap" id="mapWrap">' +
    '<div class="map-actions">' +
    '<button data-mact="child">+ Sub-task</button>' +
    '<button data-mact="sibling">+ Sibling</button>' +
    '<button data-mact="edit">Edit</button>' +
    '<button data-mact="done">Complete</button>' +
    '</div>' +
    '<svg class="map-svg" id="mapSvg"><g id="mapPane">' + edges + shapes + '</g></svg>' +
    '<div class="map-zoom">' +
    '<button data-mzoom="out" aria-label="Zoom out">−</button>' +
    '<button data-mzoom="fit" aria-label="Fit to screen" style="width:auto;padding:0 10px;font-size:12px">Fit</button>' +
    '<button data-mzoom="in" aria-label="Zoom in">+</button>' +
    '</div></div>';

  const svg = document.getElementById('mapSvg');
  const pane = document.getElementById('mapPane');
  const wrap = document.getElementById('mapWrap');

  const bbox = flat.length ? {
    x: Math.min.apply(null, flat.map(n => n.x)) - 20,
    y: Math.min.apply(null, flat.map(n => n.y)) - 20,
    x2: Math.max.apply(null, flat.map(n => n.x + n.w)) + 30,
    y2: Math.max.apply(null, flat.map(n => n.y + n.h)) + 30,
  } : { x: 0, y: 0, x2: 100, y2: 100 };

  const applyT = () => { pane.setAttribute('transform', 'translate(' + mapView.t.x + ',' + mapView.t.y + ') scale(' + mapView.t.s + ')'); };
  const fit = () => {
    const r = wrap.getBoundingClientRect();
    const cw = bbox.x2 - bbox.x, ch = bbox.y2 - bbox.y;
    const sc = Math.min(1.4, Math.max(0.2, Math.min(r.width / cw, r.height / ch)));
    mapView.t = { s: sc, x: (r.width - cw * sc) / 2 - bbox.x * sc, y: (r.height - ch * sc) / 2 - bbox.y * sc };
    applyT();
  };
  if (!mapView.t || mapView.firstFit) { fit(); mapView.firstFit = false; } else applyT();

  if (!flat.length) {
    wrap.insertAdjacentHTML('beforeend', '<div class="empty" style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center"><div class="e-big">Nothing in scope.</div>Loosen the Scope filter above, or add tasks first.</div>');
  }

  const updateSel = () => {
    svg.querySelectorAll('.map-node').forEach(g => g.classList.toggle('sel', g.dataset.node === mapView.sel));
    const selNode = mapView.sel ? byId[mapView.sel] : null;
    const can = (a) => {
      if (!selNode) return false;
      if (a === 'child') return selNode.kind !== 'step';
      if (a === 'sibling') return selNode.kind === 'task';
      if (a === 'edit') return selNode.kind === 'task' || selNode.kind === 'root';
      if (a === 'done') return selNode.kind === 'task' || selNode.kind === 'step';
      return false;
    };
    wrap.querySelectorAll('[data-mact]').forEach(b => { b.disabled = !can(b.dataset.mact); });
  };
  updateSel();

  /* ---- inline capture ---- */
  const floatInput = (anchor, placeholder, initial, onCommit) => {
    const r = wrap.getBoundingClientRect();
    let px = anchor.side === 'left'
      ? mapView.t.x + anchor.x * mapView.t.s - 215
      : mapView.t.x + (anchor.x + anchor.w + 30) * mapView.t.s;
    let py = mapView.t.y + anchor.y * mapView.t.s;
    px = Math.max(8, Math.min(px, r.width - 200)); py = Math.max(8, Math.min(py, r.height - 44));
    const inp = document.createElement('input');
    inp.className = 'map-inline-input';
    inp.placeholder = placeholder;
    if (initial) inp.value = initial;
    inp.style.left = px + 'px'; inp.style.top = py + 'px';
    wrap.appendChild(inp);
    mapView.inputActive = true;
    const close = (rerender) => {
      mapView.inputActive = false;
      inp.remove();
      if (rerender || mapView.pendingRender) { mapView.pendingRender = false; render(); }
    };
    inp.addEventListener('keydown', (e) => {
      e.stopPropagation();
      if (e.key === 'Escape') { close(false); return; }
      if (e.key === 'Enter') {
        const v = inp.value.trim();
        if (!v) { close(false); return; }
        onCommit(v);
        close(true);
      }
    });
    inp.addEventListener('blur', () => { if (mapView.inputActive) close(false); });
    setTimeout(() => inp.focus(), 30);
  };

  const openRootRename = () => {
    const rootNode = byId['__root'];
    if (!rootNode) return;
    floatInput(rootNode, 'Name the centre', state.settings.mapRootLabel || 'My Projects', (v) => {
      state.settings.mapRootLabel = v;
      save();
    });
  };
  mapView.openRootRename = openRootRename;

  const openInline = (mode) => {
    const selNode = mapView.sel ? byId[mapView.sel] : null;
    if (!selNode) return;
    if (mode === 'child' && selNode.kind === 'root') {
      floatInput(selNode, 'New group', '', (v) => {
        const a = addArea(v);
        mapView.sel = a.id;
      });
      return;
    }
    let target; // {parentId, projectId, areaId, anchor}
    if (mode === 'child' && selNode.kind === 'area') target = { parentId: null, projectId: null, areaId: selNode.areaId, anchor: selNode };
    else if (mode === 'child' && selNode.kind === 'project') target = { parentId: null, projectId: selNode.id, areaId: null, anchor: selNode };
    else if (mode === 'child' && selNode.kind === 'task') target = { parentId: selNode.id, projectId: selNode.task.projectId, areaId: selNode.task.areaId, anchor: selNode };
    else if (mode === 'sibling' && selNode.kind === 'task') target = { parentId: selNode.task.parentId, projectId: selNode.task.projectId, areaId: selNode.task.areaId, anchor: selNode };
    else return;
    // uncollapse the anchor so the new node is visible
    state.settings.mapCollapsed = (state.settings.mapCollapsed || []).filter(x => x !== (selNode.kind === 'area' ? (selNode.areaId || '__other') : selNode.id));
    floatInput(target.anchor,
      mode === 'child' ? 'New sub-task of "' + truncLabel(selNode.label, 160) + '"' : 'New sibling task',
      '',
      (v) => {
        const nt = addTask({ title: v, parentId: target.parentId, projectId: target.projectId, areaId: target.areaId });
        if (nt) mapView.sel = nt.id;
      });
  };
  mapView.openInline = openInline;

  /* ---- toolbar actions ---- */
  wrap.querySelector('.map-actions').addEventListener('click', (e) => {
    const b = e.target.closest('[data-mact]');
    if (!b || b.disabled) return;
    const selNode = byId[mapView.sel];
    if (!selNode) return;
    const a = b.dataset.mact;
    if (a === 'child' || a === 'sibling') openInline(a);
    else if (a === 'edit' && selNode.kind === 'root') openRootRename();
    else if (a === 'edit' && selNode.kind === 'task') openEdit(selNode.id);
    else if (a === 'done') {
      if (selNode.kind === 'task') toggleDone(selNode.id);
      else if (selNode.kind === 'step') {
        const t = getTask(selNode.taskId);
        const st = (t.steps || []).find(x => x.id === selNode.stepId);
        if (st) { st.done = !st.done; save(); render(); }
      }
    }
  });

  el.querySelectorAll('[data-maplayout]').forEach(b => b.addEventListener('click', () => {
    state.settings.mapLayout = b.dataset.maplayout;
    mapView.firstFit = true;
    save(); render();
  }));
  el.querySelector('[data-mapscope]').addEventListener('click', openMapScope);
  el.querySelector('[data-mapdone]').addEventListener('click', () => { state.settings.mapShowDone = !state.settings.mapShowDone; save(); render(); });
  wrap.querySelector('.map-zoom').addEventListener('click', (e) => {
    const b = e.target.closest('[data-mzoom]');
    if (!b) return;
    if (b.dataset.mzoom === 'fit') { fit(); return; }
    const r = wrap.getBoundingClientRect();
    const f = b.dataset.mzoom === 'in' ? 1.25 : 0.8;
    const ns = Math.max(0.2, Math.min(2.5, mapView.t.s * f));
    const cx = r.width / 2, cy = r.height / 2;
    mapView.t.x = cx - (cx - mapView.t.x) * (ns / mapView.t.s);
    mapView.t.y = cy - (cy - mapView.t.y) * (ns / mapView.t.s);
    mapView.t.s = ns;
    applyT();
  });

  /* ---- pointer interactions: pan, select, drag to re-parent, pinch ---- */
  let pts = new Map(), panStart = null, dragNode = null, dragMoved = false, dragStart = null, pinchBase = null;
  const nodeAt = (clientX, clientY) => {
    const elm = document.elementFromPoint(clientX, clientY);
    const g = elm && elm.closest ? elm.closest('[data-node]') : null;
    return g ? byId[g.dataset.node] : null;
  };
  svg.addEventListener('pointerdown', (e) => {
    try { svg.setPointerCapture(e.pointerId); } catch (err) {}
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      pinchBase = { d: Math.hypot(a.x - b.x, a.y - b.y), s: mapView.t.s, cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2, tx: mapView.t.x, ty: mapView.t.y };
      dragNode = null; panStart = null;
      return;
    }
    const g = e.target.closest('[data-node]');
    const collapseBtn = e.target.closest('[data-collapse]');
    if (collapseBtn) { panStart = null; dragNode = null; return; }
    if (g) {
      const n = byId[g.dataset.node];
      dragNode = (n && (n.kind === 'task' || (n.kind === 'area' && centred && n.areaId))) ? n : null;
      dragMoved = false;
      dragStart = { x: e.clientX, y: e.clientY };
      panStart = null;
    } else {
      panStart = { x: e.clientX, y: e.clientY, tx: mapView.t.x, ty: mapView.t.y };
      svg.classList.add('panning');
    }
  });
  svg.addEventListener('pointermove', (e) => {
    if (pts.has(e.pointerId)) pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinchBase && pts.size === 2) {
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      const ns = Math.max(0.2, Math.min(2.5, pinchBase.s * (d / pinchBase.d)));
      const r = wrap.getBoundingClientRect();
      const cx = pinchBase.cx - r.left, cy = pinchBase.cy - r.top;
      mapView.t.x = cx - (cx - pinchBase.tx) * (ns / pinchBase.s);
      mapView.t.y = cy - (cy - pinchBase.ty) * (ns / pinchBase.s);
      mapView.t.s = ns;
      applyT();
      return;
    }
    if (panStart) {
      mapView.t.x = panStart.tx + (e.clientX - panStart.x);
      mapView.t.y = panStart.ty + (e.clientY - panStart.y);
      applyT();
    } else if (dragNode) {
      if (!dragMoved && dragStart && Math.hypot(e.clientX - dragStart.x, e.clientY - dragStart.y) < 7) return;
      dragMoved = true;
      svg.querySelectorAll('.droptgt, .rz-top, .rz-bottom').forEach(x => x.classList.remove('droptgt', 'rz-top', 'rz-bottom'));
      if (dragNode.kind !== 'task') return; // group drags only swap sides, no drop target
      const over = nodeAt(e.clientX, e.clientY);
      if (over && over.id !== dragNode.id && over.kind !== 'step' && !(over.kind === 'task' && isDescendantTask(over.id, dragNode.id))) {
        const g = svg.querySelector('[data-node="' + CSS.escape(over.id) + '"]');
        if (!g) return;
        if (over.kind === 'task') {
          const r = g.getBoundingClientRect();
          const rel = (e.clientY - r.top) / Math.max(1, r.height);
          if (rel < 0.3) g.classList.add('rz-top');
          else if (rel > 0.7) g.classList.add('rz-bottom');
          else g.classList.add('droptgt');
        } else {
          g.classList.add('droptgt');
        }
      }
    }
  });
  svg.addEventListener('pointerup', (e) => {
    pts.delete(e.pointerId);
    if (pinchBase) { if (pts.size < 2) pinchBase = null; return; }
    if (panStart) { panStart = null; svg.classList.remove('panning'); return; }
    const collapseBtn = e.target.closest('[data-collapse]');
    if (collapseBtn) {
      const id = collapseBtn.dataset.collapse;
      const c = state.settings.mapCollapsed || (state.settings.mapCollapsed = []);
      const i = c.indexOf(id);
      if (i === -1) c.push(id); else c.splice(i, 1);
      save(); render();
      return;
    }
    if (dragNode && dragMoved) {
      svg.querySelectorAll('.droptgt, .rz-top, .rz-bottom').forEach(x => x.classList.remove('droptgt', 'rz-top', 'rz-bottom'));
      if (dragNode.kind === 'area') {
        // group drag in centred layout: crossing the centre swaps the branch side
        const r = wrap.getBoundingClientRect();
        const mapX = (e.clientX - r.left - mapView.t.x) / mapView.t.s;
        const newSide = mapX < 0 ? 'left' : 'right';
        const sidesMap = state.settings.mapSides || (state.settings.mapSides = {});
        if (sidesMap[dragNode.areaId] !== newSide) {
          sidesMap[dragNode.areaId] = newSide;
          save(); toast('Branch moved to the ' + newSide);
        }
        dragNode = null; dragMoved = false;
        render();
        return;
      }
      const over = nodeAt(e.clientX, e.clientY);
      const t = getTask(dragNode.id);
      if (over && t && over.id !== dragNode.id) {
        if (over.kind === 'task' && !isDescendantTask(over.id, dragNode.id)) {
          const g = svg.querySelector('[data-node="' + CSS.escape(over.id) + '"]');
          const r = g ? g.getBoundingClientRect() : null;
          const rel = r ? (e.clientY - r.top) / Math.max(1, r.height) : 0.5;
          if (rel < 0.3 || rel > 0.7) {
            // reorder: slot before or after the target, adopting its place in the tree
            t.parentId = over.task.parentId; t.projectId = over.task.projectId; t.areaId = over.task.areaId;
            dragNode = null; dragMoved = false;
            moveTaskRelative(t.id, over.id, rel < 0.3);
            toast('Reordered');
            return;
          }
          t.parentId = over.id; t.projectId = over.task.projectId; t.areaId = over.task.areaId;
          save(); toast('Moved under "' + truncLabel(over.label, 180) + '"');
        } else if (over.kind === 'project') {
          t.parentId = null; t.projectId = over.id; t.areaId = null;
          save(); toast('Moved to project "' + truncLabel(over.label, 180) + '"');
        } else if (over.kind === 'area') {
          t.parentId = null; t.projectId = null; t.areaId = over.areaId;
          save(); toast('Moved to group "' + truncLabel(over.label, 180) + '"');
        } else if (over.kind === 'root') {
          t.parentId = null; t.projectId = null; t.areaId = null;
          save(); toast('Moved out of all groups');
        }
      }
      dragNode = null; dragMoved = false;
      render();
      return;
    }
    if (dragNode) { mapView.sel = dragNode.id; dragNode = null; updateSel(); return; }
    const g = e.target.closest('[data-node]');
    if (g) { mapView.sel = g.dataset.node; updateSel(); }
    else { mapView.sel = null; updateSel(); }
  });
  svg.addEventListener('dblclick', (e) => {
    const g = e.target.closest('[data-node]');
    if (!g) return;
    const n = byId[g.dataset.node];
    if (n && n.kind === 'root') openRootRename();
    else if (n && n.kind === 'task') openEdit(n.id);
    else if (n && n.kind === 'step') {
      const t = getTask(n.taskId);
      const st = (t.steps || []).find(x => x.id === n.stepId);
      if (st) { st.done = !st.done; save(); render(); }
    }
  });
  svg.addEventListener('wheel', (e) => {
    e.preventDefault();
    const r = wrap.getBoundingClientRect();
    const f = Math.pow(1.0015, -e.deltaY);
    const ns = Math.max(0.2, Math.min(2.5, mapView.t.s * f));
    const cx = e.clientX - r.left, cy = e.clientY - r.top;
    mapView.t.x = cx - (cx - mapView.t.x) * (ns / mapView.t.s);
    mapView.t.y = cy - (cy - mapView.t.y) * (ns / mapView.t.s);
    mapView.t.s = ns;
    applyT();
  }, { passive: false });
}

    '</div></div></div>';

  const root = document.getElementById('modalRoot');
  const local = { quadrant: t.quadrant, status: t.status, focus: t.focus, priority: t.priority, deleteArmed: false,
    parentId: t.parentId || null,
    steps: (t.steps || []).map(s => ({ id: s.id || uid(), title: s.title, done: !!s.done })) };
  const detachBtn = root => {
    const b = root.querySelector('#etDetach');
    if (b) b.addEventListener('click', (e) => {
      local.parentId = local.parentId ? null : t.parentId;
      e.currentTarget.textContent = local.parentId ? 'Make top-level' : 'Will become top-level on save';
      e.currentTarget.classList.toggle('on', !local.parentId);
    });
  };

  const renderSteps = () => {
    const box = root.querySelector('#etSteps');
    box.innerHTML = local.steps.map(s =>
      '<div class="step-row' + (s.done ? ' done' : '') + '" data-sid="' + s.id + '">' +
      '<button class="check' + (s.done ? ' checked' : '') + '" data-stoggle aria-label="Toggle step">' + ICONS.tick + '</button>' +
      '<span class="step-title">' + esc(s.title) + '</span>' +
      '<button class="step-del" data-sdel aria-label="Remove step">&times;</button></div>'
    ).join('') || '<div style="font-size:13px;color:var(--ink-faint);padding:2px 0">No steps yet. Steps let one task hold its sub-activities.</div>';
  };
  renderSteps();
  detachBtn(root);
  root.querySelector('#etSteps').addEventListener('click', (e) => {
    const row = e.target.closest('[data-sid]');
    if (!row) return;
    const s = local.steps.find(x => x.id === row.dataset.sid);
    if (!s) return;
    if (e.target.closest('[data-stoggle]')) { s.done = !s.done; renderSteps(); }
    if (e.target.closest('[data-sdel]')) { local.steps = local.steps.filter(x => x.id !== s.id); renderSteps(); }
  });
  const addStep = () => {
    const inp = root.querySelector('#etStepNew');
    const v = inp.value.trim();
    if (!v) return;
    local.steps.push({ id: uid(), title: v, done: false });
    inp.value = ''; inp.focus();
    renderSteps();
  };
  root.querySelector('#etStepAdd').addEventListener('click', addStep);
  root.querySelector('#etStepNew').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addStep(); } });

  root.querySelector('.overlay').addEventListener('click', (e) => {

  });
  root.querySelector('[data-close-btn]').addEventListener('click', closeModal);

  root.querySelector('#etQuads').addEventListener('click', (e) => {
    const b = e.target.closest('[data-quad]');
    if (!b) return;
    local.quadrant = Number(b.dataset.quad) || null;
    root.querySelectorAll('#etQuads .pick').forEach(x => x.classList.toggle('on', (Number(x.dataset.quad) || null) === local.quadrant));
  });
  root.querySelector('#etPris').addEventListener('click', (e) => {
    const b = e.target.closest('[data-pri]');
    if (!b) return;
    local.priority = Number(b.dataset.pri) || null;
    root.querySelectorAll('#etPris .pick').forEach(x => x.classList.toggle('on', (Number(x.dataset.pri) || null) === local.priority));
  });
  root.querySelector('#etStats').addEventListener('click', (e) => {
    const b = e.target.closest('[data-status]');
    if (!b) return;
    local.status = b.dataset.status;
    root.querySelectorAll('#etStats .pick').forEach(x => x.classList.toggle('on', x.dataset.status === local.status));
  });
  root.querySelector('#etFocus').addEventListener('click', (e) => {
    local.focus = !local.focus;
    e.currentTarget.classList.toggle('on', local.focus);
    e.currentTarget.innerHTML = local.focus ? '&#9733; In Today focus' : '&#9734; Add to Today focus';
  });
  root.querySelector('#etDelete').addEventListener('click', (e) => {
    if (!local.deleteArmed) {
      local.deleteArmed = true;
      e.currentTarget.textContent = 'Really delete?';
      return;
    }
    deleteTask(t.id);
    closeModal();
    toast('Task deleted');
  });
  root.querySelector('#etSave').addEventListener('click', () => {
    const title = root.querySelector('#etTitle').value.trim();
    if (!title) { toast('The task needs a title'); return; }
    t.title = title;
    t.notes = root.querySelector('#etNotes').value.trim();
    t.projectId = root.querySelector('#etProj').value || null;
    t.areaId = root.querySelector('#etArea').value || null;
    t.due = root.querySelector('#etDue').value || null;
    t.quadrant = local.quadrant;
    t.priority = local.priority;
    t.focus = local.focus;
    t.steps = local.steps;
    t.parentId = local.parentId;
    if (local.status !== t.status) {
      t.status = local.status;
      t.completedAt = t.status === 'done' ? Date.now() : null;
    }
    save(); closeModal(); render();
  });
  root.querySelector('#etTitle').focus();
}

      const clean = line.replace(/\t/g, ' ').replace(/^\s*(?:[-*•]|\d+[.)])\s+/, '').trim();
      if (!clean) continue;

        else if (ui.filterArea) parsed.areaId = ui.filterArea;
      }
      addTask(parsed);
      added++;
    }
    if (!added) { toast(skipped ? 'No task descriptions found on those lines' : 'Nothing to add yet'); return; }
    closeModal(); render();
    toast('Added ' + added + ' ' + (added === 1 ? 'task' : 'tasks') + (skipped ? ', skipped ' + skipped : ''));

/* ================= Backup ================= */

function backupPayload() {
  return JSON.stringify({ app: 'Sorted', v: 1, exportedAt: new Date().toISOString(), tasks: state.tasks, projects: state.projects, areas: state.areas, settings: state.settings }, null, 2);
}

async function exportBackup() {
  const filename = 'sorted-backup-' + todayISO() + '.json';
  const data = backupPayload();
  if (window.claude && window.claude.downloads) {
    try {
      await window.claude.downloads.save({ filename, data });
      toast('Backup saved');
      return;
    } catch (err) {
      if (err && err.code === 'declined') return;
      if (err && err.code === 'rate_limited') { toast('One moment, then try again'); return; }
      /* fall through to plain download */
    }
  }
  try {
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast('Backup downloaded');
  } catch (e) {
    toast('Could not create the backup file');
  }
}

function importBackup(text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { toast('That file is not a valid backup'); return; }
  if (!data || !Array.isArray(data.tasks)) { toast('That file is not a Sorted backup'); return; }
  // Merge: keep existing tasks, add any from the backup not already present
  const existingIds = new Set(state.tasks.map(t => t.id));
  let added = 0;
  for (const t of data.tasks) {
    if (t && t.id && !existingIds.has(t.id) && t.title) { state.tasks.push(t); added++; }
  }
  const existingProj = new Set(state.projects.map(p => p.id));
  for (const p of (data.projects || [])) {
    if (p && p.id && !existingProj.has(p.id) && !state.projects.some(x => x.name.toLowerCase() === p.name.toLowerCase())) state.projects.push(p);
  }
  const existingArea = new Set(state.areas.map(a => a.id));
  for (const a of (data.areas || [])) {
    if (a && a.id && !existingArea.has(a.id) && !state.areas.some(x => x.name.toLowerCase() === a.name.toLowerCase())) state.areas.push(a);
  }
  if (data.settings && state.tasks.length === added) state.settings = Object.assign(defaultSettings(), data.settings);
  save(); render(); closeModal();
  toast(added ? ('Restored ' + added + ' ' + (added === 1 ? 'task' : 'tasks')) : 'Nothing new to restore; your list already has these tasks');
}

/* Drag and drop */
let dragId = null;
document.getElementById('content').addEventListener('dragstart', (e) => {
  const row = e.target.closest('[data-task]');
  if (!row) return;
  dragId = row.dataset.task;
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', dragId); } catch (err) {}
});
function clearDropMarks() {
  document.querySelectorAll('.drop-above, .drop-below').forEach(el => el.classList.remove('drop-above', 'drop-below'));
}

function manualReorderActive() { return ui.view === 'list' && ui.sortBy === 'manual'; }

document.getElementById('content').addEventListener('dragover', (e) => {
  if (manualReorderActive()) {
    const row = e.target.closest('.task-row[data-task]');
    if (row && row.dataset.task !== dragId) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const r = row.getBoundingClientRect();
      const before = (e.clientY - r.top) < r.height / 2;
      clearDropMarks();
      row.classList.add(before ? 'drop-above' : 'drop-below');
      return;
    }
    return;
  }
  const zone = e.target.closest('[data-quad], [data-status]');
  if (!zone) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  zone.classList.add('drag-over');
});
document.getElementById('content').addEventListener('dragleave', (e) => {
  if (manualReorderActive()) {
    const row = e.target.closest('.task-row[data-task]');
    if (row && !row.contains(e.relatedTarget)) row.classList.remove('drop-above', 'drop-below');
    return;
  }
  const zone = e.target.closest('[data-quad], [data-status]');
  if (zone && !zone.contains(e.relatedTarget)) zone.classList.remove('drag-over');
});
document.getElementById('content').addEventListener('dragend', clearDropMarks);
document.getElementById('content').addEventListener('drop', (e) => {
  if (manualReorderActive()) {
    const row = e.target.closest('.task-row[data-task]');
    if (row && dragId && row.dataset.task !== dragId) {
      e.preventDefault();
      const r = row.getBoundingClientRect();
      const before = (e.clientY - r.top) < r.height / 2;
      clearDropMarks();
      moveTaskRelative(dragId, row.dataset.task, before);
      dragId = null;
    }
    return;
  }
  const zone = e.target.closest('[data-quad], [data-status]');
  if (!zone || !dragId) return;
  e.preventDefault();
  zone.classList.remove('drag-over');
  const t = getTask(dragId);
  dragId = null;
  if (!t) return;
  if (zone.dataset.quad !== undefined) {
    t.quadrant = Number(zone.dataset.quad) || null;
  } else if (zone.dataset.status) {
    const st = zone.dataset.status;
    if (st !== t.status) {
      t.status = st;
      t.completedAt = st === 'done' ? Date.now() : null;
    }
  }
  save(); render();
});

let authMode = 'signin';

function showAuth() {
  document.getElementById('shell').style.display = 'none';
  document.getElementById('tabbar').style.display = '';
  document.getElementById('authWrap').style.display = 'flex';
}

function showShell() {
  document.getElementById('authWrap').style.display = 'none';
  document.getElementById('shell').style.display = 'flex';
}

function setAuthMode(mode) {
  authMode = mode;
  document.getElementById('authGo').textContent = mode === 'signin' ? 'Sign in' : 'Create account';
  document.getElementById('authSub').textContent = mode === 'signin'
    ? 'Sign in to see your tasks on any device.'
    : 'Choose the email and password you will use on every device.';
  document.getElementById('authAlt').innerHTML = mode === 'signin'
    ? 'First time here? <button id="authToggle">Create your account</button>'
    : 'Already set up? <button id="authToggle">Sign in instead</button>';
  document.getElementById('authToggle').addEventListener('click', () => setAuthMode(authMode === 'signin' ? 'signup' : 'signin'));
  document.getElementById('authErr').textContent = '';
}

async function doAuth() {
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPass').value;
  const err = document.getElementById('authErr');
  if (!email || !pass) { err.textContent = 'Enter your email and password.'; return; }
  if (authMode === 'signup' && pass.length < 8) { err.textContent = 'Use a password of at least 8 characters.'; return; }
  const btn = document.getElementById('authGo');
  btn.disabled = true; err.textContent = '';
  try {
    const fn = authMode === 'signin'
      ? sb.auth.signInWithPassword({ email, password: pass })
      : sb.auth.signUp({ email, password: pass });
    const { error } = await fn;
    if (error) {
      err.textContent = /invalid/i.test(error.message) ? 'Email or password not recognised.' :
        /already registered/i.test(error.message) ? 'That email already has an account. Sign in instead.' :
        /signups not allowed/i.test(error.message) ? 'New accounts are switched off for this app.' :
        error.message;
    }
  } catch (e) {
    err.textContent = 'Could not reach the server. Check your connection and try again.';
  }
  btn.disabled = false;
}

async function enterApp(session) {
  sbUser = session.user;
  showShell();
  if (loadCache()) { applyListPrefs(); render(); }
  await fullLoad();
  applyListPrefs();
  render();
  subscribeRealtime();
}

async function signOutNow() {
  try { await sb.auth.signOut(); } catch (e) {}
  localStorage.removeItem(STORE_KEY);
  state.tasks = []; state.projects = []; state.areas = []; state.settings = defaultSettings();
  sbUser = null;
  closeModal();
  showAuth();
}

document.getElementById('authGo').addEventListener('click', doAuth);
document.getElementById('authPass').addEventListener('keydown', (e) => { if (e.key === 'Enter') doAuth(); });
document.getElementById('authToggle').addEventListener('click', () => setAuthMode('signup'));

(async function boot() {
  if (!window.supabase) {
    document.getElementById('authWrap').style.display = 'flex';
    document.getElementById('authErr').textContent = 'Could not load the sync library. Check your connection and refresh.';
    return;
  }
  sb = window.supabase.createClient(SB_URL, SB_ANON);
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN' && session && !sbUser) enterApp(session);
    if (event === 'SIGNED_OUT') { sbUser = null; showAuth(); }
  });
  const { data } = await sb.auth.getSession();
  if (data && data.session) enterApp(data.session);
  else showAuth();
})();
</script>

</body>
</html>
